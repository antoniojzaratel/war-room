  </tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="btnSim">Rerun 6,000 simulations</button></div>`;
}
const olTag=t=>{const o=OUTLOOK[t.outlook]||{};return `<span class="tag ${o.tone==='good'?'good':o.tone==='bad'?'bad':'warn'}">${h(o.label||'')}</span>`};

/* ---------- team outlook ---------- */
function fcOutlook(){
  const T=[...S.teams].sort((a,b)=>(b.rid===S.meRid)-(a.rid===S.meRid)||a.fut[0].rank-b.fut[0].rank);
  const nm=id=>h(S.P[id].n);const n=S.teams.length;
  const counts={};S.teams.forEach(t=>counts[t.outlook]=(counts[t.outlook]||0)+1);
  const legend=Object.keys(OUTLOOK).filter(k=>counts[k]).map(k=>`<div class="ol-leg">${olTag({outlook:k})} <span class="psub">${counts[k]} ${counts[k]===1?'team':'teams'}. ${OUTLOOK[k].line}</span></div>`).join('');
  return `<p class="lede">Each team is placed by how strong its best lineup is now versus two seasons from now, how old its starters are, and the draft picks it owns.</p>
  <div class="panel" style="margin-bottom:16px">${legend}</div>
  <div class="ol-grid">${T.map(t=>{const f=t.fut,d=f[2].rank-f[0].rank;
    const firstsBy={};t.firsts.forEach(p=>(firstsBy[p.season]=firstsBy[p.season]||[]).push(p.orig===t.rid?'own':S.byRid[p.orig].name));
    return `<article class="panel ol-card ${t.rid===S.meRid?'ol-me':''}">
      <div class="ol-head"><div><div class="pname" style="font-size:18px">${h(t.name)}${t.rid===S.meRid?' <span class="tag">You</span>':''}</div><div class="psub">@${h(t.handle)}, ${t.w}-${t.l}</div></div>${olTag(t)}</div>
      <p style="margin:8px 0 12px">${OUTLOOK[t.outlook].line}</p>
      <div class="ol-stats">
        <div><div class="psub">Lineup rank</div><div class="num ol-n">#${f[0].rank} <span class="mute">to</span> #${f[2].rank}</div><div class="psub">now to ${yearLabel(2)}${d<0?', climbing':d>0?', falling':''}</div></div>
        <div><div class="psub">Starter age</div><div class="num ol-n">${t.coreAge?f1(t.coreAge):'n/a'}</div><div class="psub">league avg ${f1(S.teams.reduce((s,x)=>s+(x.coreAge||0),0)/n)}</div></div>
        <div><div class="psub">First-round picks</div><div class="num ol-n">${t.firsts.length}</div><div class="psub">${Object.keys(firstsBy).sort().map(s=>`${s}: ${firstsBy[s].length}`).join(', ')||'none owned'}</div></div>
      </div>
      <ul class="ol-list">
        <li><b>Strongest:</b> ${t.strongPos.p} (${t.strongPos.d>=0?'+':''}${f1(t.strongPos.d)} pts/wk vs league). <b>Weakest:</b> ${t.weakPos.p} (${f1(t.weakPos.d)}).</li>
        ${t.youngCore.length?`<li><b>Young core:</b> ${t.youngCore.slice(0,3).map(id=>`${nm(id)} (${S.P[id].age})`).join(', ')}.</li>`:'<li><b>Young core:</b> none worth building around yet.</li>'}
        ${t.decliners.length?`<li><b>Sell before they drop:</b> ${t.decliners.slice(0,3).map(x=>`${nm(x.id)} (${f1(x.now)} to ${f1(x.y2)} pts/wk)`).join(', ')}.</li>`:''}
        ${t.risers.length?`<li><b>On the rise:</b> ${t.risers.slice(0,3).map(x=>`${nm(x.id)} (${f1(x.now)} to ${f1(x.y2)})`).join(', ')}.</li>`:''}
        ${t.ownNext1&&t.fut[0].rank>n-3?`<li><b>Tank incentive:</b> owns its own ${pickSeasons()[0]} first.</li>`:''}
      </ul>
      <p class="ol-advice"><b>Move:</b> ${h(outlookAdvice(t))}</p>
    </article>`}).join('')}</div>`;
}

/* ---------- next three seasons ---------- */
function slopeChart(){
  const T=S.teams,n=T.length,Y=[0,1,2];
  const W=760,top=28,rowH=34,H=top+rowH*(n-1)+30,xs=[250,380,510];
  const y=r=>top+(r-1)*rowH;
  const lines=T.map(t=>{const me=t.rid===S.meRid;const pts=Y.map(k=>[xs[k],y(t.fut[k].rank)]);
    const tip=`${t.name}: ${Y.map(k=>`${yearLabel(k)} #${t.fut[k].rank} (${f1(t.fut[k].total)} pts/wk)`).join(', ')}`;
    return `<g class="sl-g${me?' sl-me':''}" data-tip="${h(tip)}" tabindex="0">
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="sl-line"/>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${me?6:4.5}" class="sl-dot"/>`).join('')}
      <text x="${xs[0]-14}" y="${pts[0][1]+5}" text-anchor="end" class="sl-lab">${h(t.name)}</text>
      <text x="${xs[2]+14}" y="${pts[2][1]+5}" class="sl-lab">${h(t.name)}</text>
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="sl-hit"/></g>`}).sort((a,b)=>a.includes('sl-me')-b.includes('sl-me')).join('');
  const axis=Y.map(k=>`<text x="${xs[k]}" y="14" text-anchor="middle" class="sl-yr">${yearLabel(k)}</text><line x1="${xs[k]}" x2="${xs[k]}" y1="${top-8}" y2="${H-18}" class="sl-ax"/>`).join('');
  const ranks=range(1,n).map(r=>`<text x="${W-18}" y="${y(r)+5}" text-anchor="end" class="sl-rk">#${r}</text>`).join('');
  return `<div class="sl-wrap"><svg viewBox="0 0 ${W} ${H}" class="slope" role="img" aria-label="Lineup strength rank for each team, now and the next two seasons. Table below has the numbers.">${axis}${ranks}${lines}</svg><div class="sl-tip" hidden></div></div>`;
}
function fcFuture(){
  const T=[...S.teams].sort((a,b)=>a.fut[2].rank-b.fut[2].rank);
  if(!FC.team)FC.team=S.meRid;const t=S.byRid[FC.team];
  const lu=y=>t.fut[y].lineup.map(x=>`<tr><td>${posTag(x.slot)}</td><td>${x.rk?`<span class="pname">${h(pickLabel(x.pick))}</span><div class="psub">Rookie from this pick, drafted ${x.pick.season}</div>`:`<span class="pname">${h(S.P[x.id].n)}</span><div class="psub">${S.P[x.id].pos}, age ${S.P[x.id].age?S.P[x.id].age+y:'?'} in ${yearLabel(y).slice(0,4)}</div>`}</td><td class="r num">${f1(x.pts)}</td></tr>`).join('');
  return `<p class="lede">Each player is projected forward with a typical aging curve for his position, nudged by his dynasty market value, so a young player priced like a star is read as a breakout in progress. Draft picks turn into expected rookies, scaled by round and by how the original team is likely to finish. Numbers are each team's best lineup, in points per week.</p>
  <div class="panel">${slopeChart()}</div>
  <h3>Strength by season</h3><div class="panel scroll"><table><thead><tr><th>Team</th><th>Outlook</th>${[0,1,2].map(k=>`<th class="r">${yearLabel(k)}</th>`).join('')}<th class="r">Change</th><th class="r">Rookies starting in ${yearLabel(2)}</th></tr></thead><tbody>
  ${T.map(x=>{const ch=x.fut[2].total-x.fut[0].total;return `<tr class="${x.rid===S.meRid?'me':''}"><td class="pname">${h(x.name)}</td><td>${olTag(x)}</td>${[0,1,2].map(k=>`<td class="r num">${f1(x.fut[k].total)} <span class="psub">#${x.fut[k].rank}</span></td>`).join('')}
    <td class="r num ${ch>=0?'up':'down'}">${ch>=0?'+':''}${f1(ch)}</td><td class="r num">${x.fut[2].rookies}</td></tr>`}).join('')}</tbody></table></div>
  <h3>Projected lineups</h3><div class="row"><select id="fcTeam" aria-label="Team">${S.teams.map(x=>`<option value="${x.rid}" ${x.rid===t.rid?'selected':''}>${h(x.name)}${x.rid===S.meRid?' (you)':''}</option>`).join('')}</select></div>
  <div class="fc-lu">${[0,1,2].map(y=>`<div class="panel"><h3 style="margin-top:0">${yearLabel(y)}, ${f1(t.fut[y].total)} pts/wk</h3><div class="scroll"><table><tbody>${lu(y)}</tbody></table></div></div>`).join('')}</div>`;
}
const FSECS=[['season','This season'],['outlook','Team outlook'],['future','Next 3 seasons']];
function rForecast(){
  const body={season:fcSeason,outlook:fcOutlook,future:fcFuture}[FC.sec]||fcSeason;
  return `<h2>Forecast</h2><nav class="chips" style="margin:6px 0 14px" aria-label="Forecast sections">${FSECS.map(([k,l])=>`<button class="chip" data-fcsec="${k}" aria-pressed="${FC.sec===k}">${l}</button>`).join('')}</nav>${body()}`;
}
document.addEventListener('click',e=>{if(S.tab!=='forecast')return;const b=e.target.closest('[data-fcsec]');if(b){FC.sec=b.dataset.fcsec;store.set('wr_fcsec',FC.sec);render()}});
document.addEventListener('change',e=>{if(e.target.id==='fcTeam'){FC.team=Number(e.target.value);const y=window.scrollY;render();window.scrollTo(0,y)}});
/* slope chart hover and keyboard focus tooltip */
function slTip(g,ev){const w=g.closest('.sl-wrap'),tip=w.querySelector('.sl-tip');w.querySelectorAll('.sl-g').forEach(x=>x.classList.toggle('sl-dim',x!==g));
  tip.textContent=g.dataset.tip;tip.hidden=false;const r=w.getBoundingClientRect();const x=ev&&ev.clientX?ev.clientX-r.left:r.width/2,y=ev&&ev.clientY?ev.clientY-r.top:20;
  tip.style.left=Math.min(Math.max(8,x+12),r.width-tip.offsetWidth-8)+'px';tip.style.top=Math.max(4,y-44)+'px'}
function slClear(w){w.querySelectorAll('.sl-g').forEach(x=>x.classList.remove('sl-dim'));w.querySelector('.sl-tip').hidden=true}
document.addEventListener('mousemove',e=>{const g=e.target.closest&&e.target.closest('.sl-g');if(g)slTip(g,e);else{const w=document.querySelector('.sl-wrap');if(w&&!w.querySelector('.sl-tip').hidden&&!e.target.closest('.sl-wrap'))slClear(w)}});
document.addEventListener('focusin',e=>{const g=e.target.closest&&e.target.closest('.sl-g');if(g)slTip(g,null)});
document.addEventListener('pointerleave',e=>{if(e.target.classList&&e.target.classList.contains('sl-wrap'))slClear(e.target)},true);
registerModule({key:'forecast',label:'Forecast',order:40,render:rForecast});

document.addEventListener('wr:reset',()=>{FC.team=null});

</script>
<script>
/* js/modules/trades.js */
/* Trades: calculator for 2 to 4 teams, and win-win trade suggestions */
const MAX_TRADE_TEAMS=4;
function teamAssets(t){
  const pl=t.players.map(id=>({k:'p:'+id,label:S.P[id].n,sub:`${S.P[id].pos} ${S.P[id].team||'FA'}${S.P[id].age?', '+S.P[id].age:''}`,v:S.val[id]||0}));
  const pk=S.picks.filter(p=>p.owner===t.rid).map(p=>({k:p.key,label:pickLabel(p),sub:'Pick',v:pickValue(p)}));
  return pl.concat(pk).sort((a,b)=>b.v-a.v);
}
function assetOwner(k){if(k.startsWith('p:')){const id=k.slice(2);const t=S.teams.find(x=>x.players.includes(id));return t&&t.rid}const p=S.picks.find(x=>x.key===k);return p&&p.owner}
const assetLabel=k=>{if(k.startsWith('p:'))return (S.P[k.slice(2)]||{}).n;const p=S.picks.find(x=>x.key===k);return `${p.season} round ${p.round} (${S.byRid[p.orig].name}'s)`};
function lineupAfter(t,give,get){const L=t.players.filter(id=>!give.includes(id)).concat(get);return optimize(L.filter(id=>!t.reserve.has(id)&&!t.taxi.has(id)),ros).total}
/* team strength y seasons out after a trade: players with aging, picks as rookies */
function futureAfter(t,giveP,getP,giveK,getK,y){
  const s0=Number(S.season);
  const players=t.players.filter(id=>!giveP.includes(id)).concat(getP);
  const picks=(t.myPicks||[]).filter(p=>!giveK.includes(p.key)).concat(getK.map(k=>S.picks.find(p=>p.key===k)));
  const pool=players.filter(id=>S.P[id]).map(id=>({pos:S.P[id].pos,pts:ppgYear(id,y)}));
  const rk=picks.filter(pk=>pk.season-s0>=1&&pk.season-s0<=y).map(pk=>({pos:'WR',pts:rookiePpg(pk,y-(pk.season-s0))}));
  return optimizeItems(pool.concat(rk)).total;
}
function normTC(){
  if(!S.tc||!S.tc.teams){const a=S.meRid,b=(S.teams.find(t=>t.rid!==S.meRid)||{}).rid;S.tc={teams:[a,b],mv:{}}}
  for(const k in S.tc.mv){const m=S.tc.mv[k];if(!S.tc.teams.includes(m.from)||!S.tc.teams.includes(m.to)||m.from===m.to)delete S.tc.mv[k]}
}
function tradeEval(){
  const T=S.tc.teams.map(r=>S.byRid[r]);const mv=Object.entries(S.tc.mv);
  return T.map(t=>{
    const out=mv.filter(([k,m])=>m.from===t.rid).map(([k])=>k),inn=mv.filter(([k,m])=>m.to===t.rid).map(([k])=>k);
    const vo=out.map(assetVal),vi=inn.map(assetVal);
    const adj=vs=>vs.reduce((s,v)=>s+Math.pow(v,1.15),0);
    const P=ks=>ks.filter(k=>k.startsWith('p:')).map(k=>k.slice(2)),K=ks=>ks.filter(k=>!k.startsWith('p:'));
    const now=lineupAfter(t,P(out),P(inn))-t.rosMean;
    const fut=S.isDynasty&&t.fut?futureAfter(t,P(out),P(inn),K(out),K(inn),2)-t.fut[2].total:null;
    return{t,out,inn,sent:vo.reduce((a,b)=>a+b,0),got:vi.reduce((a,b)=>a+b,0),adjSent:adj(vo),adjGot:adj(vi),now,fut};
  });
}
function rTrade(){
  normTC();const E=tradeEval(),n=E.length;
  const inTrade=new Set(S.tc.teams);const moves=Object.keys(S.tc.mv).length;
  const panel=e=>{const t=e.t,others=S.tc.teams.filter(r=>r!==t.rid);
    return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div><div class="pname">${h(t.name)}</div><div class="psub">sends ${e.out.length} ${e.out.length===1?'asset':'assets'}, gets ${e.inn.length}</div></div>
      ${n>2?`<button class="btn ghost" data-tcrm="${t.rid}" aria-label="Remove ${h(t.name)} from trade">Remove</button>`:''}</div>
      <div class="assets">${teamAssets(t).map(a=>{const m=S.tc.mv[a.k];return `<div class="tc-a${m?' on':''}"><label><input type="checkbox" data-asset="${h(a.k)}" data-from="${t.rid}" ${m?'checked':''}><span><span class="pname">${h(a.label)}</span> <span class="psub">${h(a.sub)}</span></span></label>
        ${m&&n>2?`<select data-dest="${h(a.k)}" aria-label="Send to">${others.map(r=>`<option value="${r}" ${m.to===r?'selected':''}>to ${h(S.byRid[r].name)}</option>`).join('')}</select>`:''}<span class="v">${f0(a.v)}</span></div>`}).join('')}</div></div>`};
  const addable=S.teams.filter(t=>!inTrade.has(t.rid));
  let res='';
  if(moves){
    const totAdj=E.reduce((s,e)=>s+e.adjGot,0)||1;
    const net=E.map(e=>({e,d:(e.adjGot-e.adjSent)/totAdj}));const worst=[...net].sort((a,b)=>a.d-b.d)[0],best=[...net].sort((a,b)=>b.d-a.d)[0];
    const spread=best.d-worst.d;
    const verdict=spread<.1?'Fair trade':spread<.25?`${best.e.t.name} slightly wins this trade`:`${best.e.t.name} wins this trade`;
    let fix='';
    if(spread>=.1){const gap=(best.e.got-best.e.sent)-(worst.e.got-worst.e.sent);
      const c=teamAssets(best.e.t).filter(a=>!S.tc.mv[a.k]&&a.v>0).sort((x,y)=>Math.abs(x.v-gap/2)-Math.abs(y.v-gap/2))[0];
      if(c)fix=`<p style="margin:10px 0 0">To even it out, ${h(best.e.t.name)} could add <b>${h(c.label)}</b> (${f0(c.v)}) going to ${h(worst.e.t.name)}.</p>`}
    res=`<div class="panel" style="margin-top:16px"><div class="verdict">${h(verdict)}</div>
      <div class="scroll"><table style="margin-top:10px"><thead><tr><th>Team</th><th>Gets</th><th class="r">Sends</th><th class="r">Receives</th><th class="r">Net value</th><th class="r">Lineup now</th>${S.isDynasty?'<th class="r">In 2 years</th>':''}</tr></thead><tbody>
      ${E.map(e=>{const nv=e.got-e.sent;return `<tr><td class="pname">${h(e.t.name)}</td><td class="psub">${e.inn.map(k=>h(assetLabel(k))).join(', ')||'Nothing'}</td>
        <td class="r num">${f0(e.sent)}</td><td class="r num">${f0(e.got)}</td><td class="r num ${nv>=0?'up':'down'}">${nv>=0?'+':''}${f0(nv)}</td>
        <td class="r num ${e.now>=0?'up':'down'}">${e.now>=0?'+':''}${f1(e.now)}/wk</td>${S.isDynasty?`<td class="r num ${e.fut>=0?'up':'down'}">${e.fut>=0?'+':''}${f1(e.fut)}/wk</td>`:''}</tr>`}).join('')}</tbody></table></div>${fix}</div>`;
  }
  let html=`<h2 id="tcTop">Trade calculator</h2><p class="lede">Up to ${MAX_TRADE_TEAMS} teams. Tick what each team sends${n>2?' and choose who gets it':''}. Value is ${h(S.valueSource)} with a consolidation premium, so one star beats two pieces that add up to the same number. Lineup now is the change in each team's best weekly lineup over the next four weeks${S.isDynasty?'; in 2 years uses the aging and draft-pick model from Forecast':''}.</p>
  <div class="row">${n<MAX_TRADE_TEAMS&&addable.length?`<select id="tcAdd" aria-label="Add a team"><option value="">Add a team to the trade</option>${addable.map(t=>`<option value="${t.rid}">${h(t.name)}</option>`).join('')}</select>`:''}
    ${n===2?`<select id="tcSwap" aria-label="Trade partner">${S.teams.filter(t=>t.rid!==S.tc.teams[0]).map(t=>`<option value="${t.rid}" ${t.rid===S.tc.teams[1]?'selected':''}>Partner: ${h(t.name)}</option>`).join('')}</select>`:''}
    ${moves?'<button class="btn ghost" id="tcClear">Clear trade</button>':''}</div>
  <div class="tl tl-${n}">${E.map(panel).join('')}</div>${res}`;
  html+=`<h2>Trade ideas for ${h(S.byRid[S.meRid].name)}</h2><p class="lede">Every one-for-one and two-for-one deal with every team was tested. These are the ones where your weekly lineup gets better, the value is close to fair, and the other manager doesn't lose starting production, so they have a reason to accept.</p>`;
  if(!S.suggest)html+='<div class="status">Testing trades across the league…</div>';
  else if(!S.suggest.length)html+='<div class="panel">No win-win deals found right now. Your lineup is tough to upgrade without overpaying.</div>';
  else html+=`<div class="panel scroll"><table><thead><tr><th>Partner</th><th>You give</th><th>You get</th><th class="r">Your lineup</th><th class="r">Their lineup</th><th class="r">Value</th><th></th></tr></thead><tbody>
    ${S.suggest.map((s,i)=>`<tr><td>${h(S.byRid[s.rid].name)}</td><td>${s.give.map(id=>h(S.P[id].n)).join(' + ')}</td><td>${s.get.map(id=>h(S.P[id].n)).join(' + ')}</td>
    <td class="r num up">+${f1(s.gain)}</td><td class="r num ${s.their>=0?'up':'down'}">${s.their>=0?'+':''}${f1(s.their)}</td><td class="r num ${s.dv>=0?'up':'down'}">${s.dv>=0?'+':''}${f0(s.dv)}</td>
    <td><button class="btn ghost" data-load="${i}">Open in calculator</button></td></tr>`).join('')}</tbody></table></div>`;
  return html;
}
function suggestTrades(){
  const me=S.byRid[S.meRid];const res=[];const mine=me.players.filter(id=>(S.val[id]||0)>250&&!me.taxi.has(id));
  const V=id=>S.val[id]||0;
  for(const t of S.teams){if(t.rid===me.rid)continue;const theirs=t.players.filter(id=>V(id)>250);
    const ev=(give,get)=>{const g=lineupAfter(me,give,get)-me.rosMean;if(g<.6)return;const th=lineupAfter(t,get,give)-t.rosMean;if(th<-1.2)return;
      const dv=get.reduce((s,x)=>s+V(x),0)-give.reduce((s,x)=>s+V(x),0);
      res.push({rid:t.rid,give,get,gain:g,their:th,dv,score:g+.4*Math.max(0,th)+(S.isDynasty?dv/900:0)})};
    for(const b of theirs){const vb=V(b);
      for(const a of mine){const va=V(a);if(Math.abs(va-vb)/Math.max(va,vb)<=.15)ev([a],[b])}
      for(let i=0;i<mine.length;i++)for(let k=i+1;k<mine.length;k++){const x=V(mine[i]),y=V(mine[k]);if(Math.max(x,y)>=vb)continue;const s=x+y;if(s>=vb*.95&&s<=vb*1.35)ev([mine[i],mine[k]],[b])}}}
  res.sort((a,b)=>b.score-a.score);const seen=new Set(),out=[];
  for(const r of res){const k=r.get.join()+'|'+r.rid;if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=12)break}
  return out;
}
function tcRerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
document.addEventListener('change',e=>{
  if(S.tab!=='trade')return;const el=e.target;
  if(el.id==='tcAdd'&&el.value){S.tc.teams.push(Number(el.value));tcRerender();return}
  if(el.id==='tcSwap'){S.tc.teams[1]=Number(el.value);S.tc.mv={};tcRerender();return}
  if(el.dataset.asset){const k=el.dataset.asset,from=Number(el.dataset.from);
    if(el.checked){const others=S.tc.teams.filter(r=>r!==from);S.tc.mv[k]={from,to:others[0]}}else delete S.tc.mv[k];tcRerender();return}
  if(el.dataset.dest){const m=S.tc.mv[el.dataset.dest];if(m)m.to=Number(el.value);tcRerender()}
});
document.addEventListener('click',e=>{
  if(S.tab!=='trade')return;
  const rm=e.target.closest('[data-tcrm]');if(rm){const r=Number(rm.dataset.tcrm);S.tc.teams=S.tc.teams.filter(x=>x!==r);tcRerender();return}
  if(e.target.id==='tcClear'){S.tc.mv={};tcRerender();return}
  const ld=e.target.closest('[data-load]');if(ld){const s=S.suggest[Number(ld.dataset.load)];const mv={};
    s.give.forEach(id=>mv['p:'+id]={from:S.meRid,to:s.rid});s.get.forEach(id=>mv['p:'+id]={from:s.rid,to:S.meRid});
    S.tc={teams:[S.meRid,s.rid],mv};render();$('#tcTop').scrollIntoView({behavior:'smooth'})}
});

</script>
<script>
/* js/modules/waivers.js */
/* Waivers: free agents, trending adds, drop candidates */
function rWire(){
  const rostered=new Set();S.teams.forEach(t=>t.players.forEach(id=>rostered.add(id)));
  const used=new Set(S.slots.flatMap(s=>ELIG[s]));const trend={};S.trend.forEach(x=>trend[x.player_id]=x.count);
  let fa=Object.keys(S.P).filter(id=>{const p=S.P[id];return p.team&&p.active&&used.has(p.pos)&&!rostered.has(id)&&(ros(id)>0||trend[id])});
  if(S.wvPos!=='ALL')fa=fa.filter(id=>S.P[id].pos===S.wvPos);
  fa.sort((a,b)=>ros(b)-ros(a));fa=fa.slice(0,30);
  const me=S.byRid[S.meRid];const lu=optimize(startable(me),ros);
  const worst={};lu.lineup.forEach(x=>{if(!x.id)return;const p=x.pos;if(worst[p]==null||x.pts<worst[p])worst[p]=x.pts});
  const drops=me.players.filter(id=>!lu.lineup.some(x=>x.id===id)).sort((a,b)=>(S.val[a]||0)-(S.val[b]||0)).slice(0,5);
  const chips=['ALL',...POS.filter(p=>used.has(p))].map(p=>`<button class="chip" data-wp="${p}" aria-pressed="${S.wvPos===p}">${p==='ALL'?'All':p}</button>`).join('');
  return `<h2>Waiver wire</h2><p class="lede">Unrostered players in your league ranked by projected points over the next four weeks. The trend column is how many Sleeper leagues added them in the last 48 hours.</p>
  <div class="row chips">${chips}</div>
  <div class="panel scroll"><table><thead><tr><th>Player</th><th class="r">Week ${S.planWeek}</th><th class="r">Next 4 avg</th><th class="r">Adds, 48h</th><th class="r">Value</th><th>For you</th></tr></thead><tbody>
  ${fa.map(id=>{const p=S.P[id],up=worst[p.pos]!=null&&ros(id)>worst[p.pos];return `<tr><td>${pcell(id)}</td><td class="r num">${f1(wkPlan(id))}</td><td class="r num">${f1(ros(id))}</td><td class="r num">${trend[id]?f0(trend[id]):''}</td><td class="r num">${f0(S.val[id])}</td><td>${up?`<span class="tag good">Beats your ${p.pos} starter</span>`:''}</td></tr>`}).join('')}
  </tbody></table></div>
  <h3>Your drop candidates</h3><div class="panel scroll"><table><tbody>${drops.map(id=>`<tr><td>${pcell(id)}</td><td class="r num">${f1(ros(id))} per week</td><td class="r num">${f0(S.val[id])} value</td></tr>`).join('')}</tbody></table></div>`;
}

<script>
/* js/modules/sportsbook.js */
/* Sportsbook: play-money betting on the league.
   Every price comes from the same projections and simulations as the rest of War Room, with a 5% house edge.
   Bets are stored on the device (localStorage) and settle automatically from real Sleeper results. */
const VIG=0.05,START_BANK=1000;
const B={slip:[],mode:'parlay',stake:50,fmt:store.get('wr_oddsfmt')||'us',msg:'',sec:'games',ppos:'ALL',pmu:'all'};
const bkKey=()=>`wr_book_${S.leagueId}_${S.username.toLowerCase()}`;
function bkLoad(){try{const d=JSON.parse(store.get(bkKey())||'null');if(d&&Array.isArray(d.bets))return d}catch(e){}return{bank:START_BANK,bets:[]}}
function bkSave(d){store.set(bkKey(),JSON.stringify(d))}
const priced=p=>{p=Math.min(.985,Math.max(.015,p));const d=1/Math.min(.995,p*(1+VIG));return Math.max(1.01,Math.round(d*100)/100)};
function oddsTxt(d){if(B.fmt==='dec')return d.toFixed(2);const a=d>=2?Math.round((d-1)*100/5)*5:-Math.round(100/(d-1)/5)*5;return a>0?'+'+a:String(a)}
const halfLine=x=>Math.round(x-.5)+.5;
const sgn=x=>x>0?'+'+x:String(x);
const tn=r=>S.byRid[r]?S.byRid[r].name:'?';
const pn=id=>S.P[id]?S.P[id].n:'Unknown player';
function oppOf(w,rid){const p=pairsOf(S.mu[w]).find(x=>x.some(m=>m.roster_id===rid));return p?p.find(m=>m.roster_id!==rid).roster_id:rid}
const mkOf=(w,rid)=>Math.min(rid,oppOf(w,rid));

/* ---------- when things are over ---------- */
function weekDone(w){if(w<S.week||(w===S.week&&S.weekOver))return (S.mu[w]||[]).some(m=>m.points>0);if(w>S.week)return false;
  const g=Object.values(S.games);return g.length>0&&g.every(x=>x.state==='post')&&(S.mu[w]||[]).some(m=>m.points>0)}
function bookWeek(){let w=S.week;if(weekDone(w))w++;return w<=S.regEnd+3&&pairsOf(S.mu[w]).length?w:null}
const gameOver=id=>{const g=S.games[(S.P[id]||{}).team];return !!g&&g.state==='post'};

/* ---------- distributions ---------- */
function weekStarters(w,rid){
  if(w===S.week){const m=(S.mu[w]||[]).find(x=>x.roster_id===rid);const st=m&&(m.starters||[]).filter(id=>id&&id!=='0'&&S.P[id]);if(st&&st.length)return st}
  const pr=S.proj[w]||{};return optimize(startable(S.byRid[rid]),id=>pr[id]||0).lineup.map(x=>x.id).filter(Boolean);
}
function playerDist(w,id,rid){
  if(w===S.week){const m=(S.mu[w]||[]).find(x=>x.roster_id===rid);const lp=livePlayer(id,((m&&m.players_points)||{})[id]||0);return{mean:lp.mean,sd:Math.max(.3,lp.sd*1.1),full:lp.full,actual:lp.actual}}
  const mean=(S.proj[w]||{})[id]||0;return{mean,sd:Math.max(3,mean*.5),full:mean,actual:0};
}
function teamDist(rid,w){
  if(w===S.week&&S.liveTeam[rid]&&S.liveTeam[rid].mean>0)return S.liveTeam[rid];
  const pr=S.proj[w]||{};const mean=optimize(startable(S.byRid[rid]),id=>pr[id]||0).total||S.byRid[rid].rosMean;
  return{mean,sd:Math.max(16,mean*.17),actual:0};
}

/* ---------- markets ---------- */
function buildMarkets(){
  const w=bookWeek();const M={w,games:[],hi:[],lo:[],tt:[],blow:[],ptop:[],props:[],duels:[],fut:{}};
  if(w){
    const pairs=pairsOf(S.mu[w]);
    const dists={};pairs.flat().forEach(m=>dists[m.roster_id]=teamDist(m.roster_id,w));
    for(const [a,b] of pairs){const A=dists[a.roster_id],Bd=dists[b.roster_id],mk=Math.min(a.roster_id,b.roster_id);
      const dm=A.mean-Bd.mean,sd=Math.sqrt(A.sd**2+Bd.sd**2),pA=Phi(dm/sd);
      const lineA=-halfLine(Math.abs(dm))*Math.sign(dm||1),pCover=1-Phi((-lineA-dm)/sd);
      const T=A.mean+Bd.mean,tl=halfLine(T),pOver=1-Phi((tl-T)/sd);
      const stA=weekStarters(w,a.roster_id),stB=weekStarters(w,b.roster_id);
      const lock=w===S.week&&stA.concat(stB).every(gameOver);
      M.games.push({mk,lock,a:a.roster_id,b:b.roster_id,A,B:Bd,
        ml:[{t:'ml',w,rid:a.roster_id,d:priced(pA)},{t:'ml',w,rid:b.roster_id,d:priced(1-pA)}],
        sp:[{t:'sp',w,rid:a.roster_id,opp:b.roster_id,line:lineA,d:priced(pCover)},{t:'sp',w,rid:b.roster_id,opp:a.roster_id,line:-lineA,d:priced(1-pCover)}],
        tot:[{t:'tot',w,a:a.roster_id,b:b.roster_id,line:tl,side:'o',d:priced(pOver)},{t:'tot',w,a:a.roster_id,b:b.roster_id,line:tl,side:'u',d:priced(1-pOver)}]});
      for(const [rid,D] of [[a.roster_id,A],[b.roster_id,Bd]]){const l=halfLine(D.mean),po=1-Phi((l-D.mean)/D.sd);
        M.tt.push({rid,mk,lock,mean:D.mean,o:{t:'tt',w,rid,side:'o',line:l,d:priced(po)},u:{t:'tt',w,rid,side:'u',line:l,d:priced(1-po)}})}
      // player over/unders and same-slot duels
      const side=(st,rid)=>st.map(id=>({id,rid,pos:S.P[id].pos,...playerDist(w,id,rid)}));
      const PA=side(stA,a.roster_id),PB=side(stB,b.roster_id);
      for(const p of PA.concat(PB)){if(p.full<1.5&&!p.actual)continue;const done=w===S.week&&gameOver(p.id);
        const l=Math.max(.5,halfLine(p.mean)),po=1-Phi((l-p.mean)/p.sd);
        M.props.push({...p,mk,lock:done,o:{t:'pou',w,pid:p.id,rid:p.rid,side:'o',line:l,d:priced(po)},u:{t:'pou',w,pid:p.id,rid:p.rid,side:'u',line:l,d:priced(1-po)}})}
      const used=new Set();
      for(const x of PA){const y=PB.find(q=>q.pos===x.pos&&!used.has(q.id));if(!y||x.full<1.5||y.full<1.5)continue;used.add(y.id);
        const px=Phi((x.mean-y.mean)/Math.sqrt(x.sd**2+y.sd**2)),done=w===S.week&&gameOver(x.id)&&gameOver(y.id);
        M.duels.push({mk,lock:done,x,y,dx:{t:'pdu',w,pid:x.id,opp:y.id,rid:x.rid,d:priced(px)},dy:{t:'pdu',w,pid:y.id,opp:x.id,rid:y.rid,d:priced(1-px)}})}
    }
    M.simPlayers=[];for(const [a,b] of pairs)for(const m of [a,b])for(const id of weekStarters(w,m.roster_id)){const d=playerDist(w,id,m.roster_id);M.simPlayers.push({id,rid:m.roster_id,mean:d.mean,sd:d.sd})}
    M.simPairs=pairs.map(([a,b])=>[a.roster_id,b.roster_id]);
    // specials by simulation: top and lowest team, biggest blowout, top scoring player
    const rids=Object.keys(dists).map(Number),N=6000,hi={},lo={},bl={};rids.forEach(r=>{hi[r]=0;lo[r]=0});
    const mks=M.games.map(g=>g.mk);mks.forEach(k=>bl[k]=0);
    const pl=M.props.filter(p=>p.full>=4||p.actual>=4),top={};pl.forEach(p=>top[p.id]=0);
    for(let n=0;n<N;n++){const v={};let bi=0,li=0,bv=-1e9,lv=1e9;
      for(const r of rids){const d=dists[r];const x=d.mean+d.sd*gauss();v[r]=x;if(x>bv){bv=x;bi=r}if(x<lv){lv=x;li=r}}
      hi[bi]++;lo[li]++;let bm=-1,bk=null;for(const g of M.games){const m=Math.abs(v[g.a]-v[g.b]);if(m>bm){bm=m;bk=g.mk}}bl[bk]++;
      let tp=null,tv=-1e9;for(const p of pl){const x=p.mean+p.sd*gauss();if(x>tv){tv=x;tp=p.id}}if(tp)top[tp]++}
    M.hi=rids.map(r=>({t:'hi',w,rid:r,d:priced(hi[r]/N)})).sort((x,y)=>x.d-y.d);
    M.lo=rids.map(r=>({t:'lo',w,rid:r,d:priced(lo[r]/N)})).sort((x,y)=>x.d-y.d);
    M.blow=M.games.map(g=>({t:'blow',w,a:g.a,b:g.b,mk:g.mk,d:priced(bl[g.mk]/N)})).sort((x,y)=>x.d-y.d);
    M.ptop=pl.map(p=>({t:'ptop',w,pid:p.id,rid:p.rid,d:priced(top[p.id]/N)})).sort((x,y)=>x.d-y.d).slice(0,15);
  }
  const sim=S.sim||{},regOver=S.week>S.regEnd;
  const fut=(t,k)=>S.teams.map(x=>({t,rid:x.rid,d:priced((sim[x.rid]||{})[k]||0)})).sort((x,y)=>x.d-y.d);
  M.fut={champ:fut('champ','champ'),toilet:fut('toilet','toilet'),seed1:regOver?[]:fut('seed1','one'),last:regOver?[]:fut('last','last'),
    po:regOver?[]:S.teams.map(x=>{const p=(sim[x.rid]||{}).po||0;return{rid:x.rid,yes:{t:'po',rid:x.rid,yes:true,d:priced(p)},no:{t:'po',rid:x.rid,yes:false,d:priced(1-p)}}}),
    wins:regOver?[]:S.teams.map(x=>{const s=sim[x.rid]||{},l=halfLine(s.wins||0),sd=Math.max(.35,s.winsSd||.8),po=1-Phi((l-s.wins)/sd);
      return{rid:x.rid,line:l,o:{t:'wins',rid:x.rid,side:'o',line:l,d:priced(po)},u:{t:'wins',rid:x.rid,side:'u',line:l,d:priced(1-po)}}}).sort((a,b)=>b.line-a.line)};
  return M;
}

function legLabel(l){switch(l.t){
  case'ml':return `${tn(l.rid)} to win, week ${l.w}`;
  case'sp':return `${tn(l.rid)} ${sgn(l.line)} vs ${tn(l.opp)}, week ${l.w}`;
  case'tot':return `${l.side==='o'?'Over':'Under'} ${l.line} total points, ${tn(l.a)} vs ${tn(l.b)}, week ${l.w}`;
  case'tt':return `${tn(l.rid)} ${l.side==='o'?'over':'under'} ${l.line} points, week ${l.w}`;
  case'pou':return `${pn(l.pid)} ${l.side==='o'?'over':'under'} ${l.line} fantasy points, week ${l.w}`;
  case'pdu':return `${pn(l.pid)} outscores ${pn(l.opp)}, week ${l.w}`;
  case'ptop':return `${pn(l.pid)} top-scoring starter in the league, week ${l.w}`;
  case'hi':return `${tn(l.rid)} top-scoring team of week ${l.w}`;
  case'lo':return `${tn(l.rid)} lowest-scoring team of week ${l.w}`;
  case'blow':return `${tn(l.a)} vs ${tn(l.b)} is the biggest blowout of week ${l.w}`;
  case'champ':return `${tn(l.rid)} wins the championship`;
  case'toilet':return `${tn(l.rid)} loses the toilet bowl`;
  case'seed1':return `${tn(l.rid)} finishes as the #1 seed`;
  case'last':return `${tn(l.rid)} finishes last in the regular season`;
  case'po':return `${tn(l.rid)} ${l.yes?'makes':'misses'} the playoffs`;
  case'wins':return `${tn(l.rid)} ${l.side==='o'?'over':'under'} ${l.line} regular-season wins`}}
const legKey=l=>[l.t,l.w,l.rid,l.pid,l.opp,l.a,l.side,l.line,l.yes].join('|');

/* Parlays. Legs from the same week are priced together by simulating that week player by player, so a same-game parlay
   (a player's over plus his team's moneyline, a moneyline plus the total) pays what its real joint chance is worth.
   Only picks that can't all win together, and two futures on the same team or market, are refused. */
function futConflict(){const f=B.slip.filter(l=>l.w==null);for(let i=0;i<f.length;i++)for(let k=i+1;k<f.length;k++)if(f[i].rid===f[k].rid||f[i].t===f[k].t)return true;return false}
function simWeek(M){
  const p={},t={};for(const r of M.simPairs.flat())t[r]=0;
  for(const x of M.simPlayers){const v=x.mean+x.sd*gauss();p[x.id]=v;t[x.rid]+=v}
  return{t,p,st:M.simPlayers.map(x=>x.id),pairs:M.simPairs};
}
function priceParlay(legs){
  const ind=legs.reduce((x,l)=>x*l.d,1);const wl=legs.filter(l=>l.w!=null);const M=S.bookM;
  if(wl.length<2||!M||!M.simPlayers||wl.some(l=>l.w!==M.w))return{d:ind,factor:1,impossible:false};
  const N=8000,marg=wl.map(()=>0);let joint=0;
  for(let n=0;n<N;n++){const W=simWeek(M);let all=true;wl.forEach((l,i)=>{const o=legOutcome(l,W);if(o==='win')marg[i]++;else all=false});if(all)joint++}
  const pj=joint/N,pi=marg.reduce((x,m)=>x*Math.max(m,1)/N,1);
  if(pj<.002)return{d:ind,factor:0,impossible:true};
  const factor=Math.min(4,Math.max(.25,pj/pi));
  return{d:Math.max(1.01,Math.round(ind/factor*100)/100),factor,impossible:false};
}
let parlayCache={key:'',v:null};
function parlayPrice(){const k=B.slip.map(legKey).join('#');if(parlayCache.key!==k)parlayCache={key:k,v:priceParlay(B.slip)};return parlayCache.v}

/* ---------- settlement from real Sleeper data ---------- */
function weekPts(w){const t={},p={},st=[];(S.mu[w]||[]).forEach(m=>{t[m.roster_id]=m.points||0;Object.assign(p,m.players_points||{});(m.starters||[]).forEach(id=>{if(id&&id!=='0')st.push(id)})});return{t,p,st}}
function standingsFinal(){if(S.week<=S.regEnd||!weekDone(S.regEnd))return null;
  const rec={};S.teams.forEach(t=>rec[t.rid]={w:0,pf:0});
  for(let w=1;w<=S.regEnd;w++)pairsOf(S.mu[w]).forEach(([a,b])=>{rec[a.roster_id].pf+=a.points||0;rec[b.roster_id].pf+=b.points||0;if(a.points>b.points)rec[a.roster_id].w++;else if(b.points>a.points)rec[b.roster_id].w++;else{rec[a.roster_id].w+=.5;rec[b.roster_id].w+=.5}});
  return{order:S.teams.map(t=>t.rid).sort((x,y)=>rec[y].w-rec[x].w||rec[y].pf-rec[x].pf),rec}}
/* W = {t:{roster:points}, p:{player:points}, st:[starters], pairs:[[roster,roster]]} from real results or one simulated week */
function legOutcome(l,W){
  const cmp=(x,y)=>x>y?'win':x<y?'loss':'push',pts=W.t,opp=r=>{const p=W.pairs.find(x=>x.includes(r));return p?p.find(x=>x!==r):r};
  switch(l.t){case'ml':return cmp(pts[l.rid],pts[opp(l.rid)]);
    case'sp':return cmp(pts[l.rid]+l.line,pts[l.opp]);
    case'tot':{const T=pts[l.a]+pts[l.b];return l.side==='o'?cmp(T,l.line):cmp(l.line,T)}
    case'tt':return l.side==='o'?cmp(pts[l.rid],l.line):cmp(l.line,pts[l.rid]);
    case'pou':{const v=W.p[l.pid];if(v==null)return'push';return l.side==='o'?cmp(v,l.line):cmp(l.line,v)}
    case'pdu':{const x=W.p[l.pid],y=W.p[l.opp];if(x==null||y==null)return'push';return cmp(x,y)}
    case'ptop':{let mx=-1e9;for(const id of W.st){const v=W.p[id]||0;if(v>mx)mx=v}return W.st.includes(l.pid)&&(W.p[l.pid]||0)===mx?'win':'loss'}
    case'hi':case'lo':{const v=Object.values(pts),x=l.t==='hi'?Math.max(...v):Math.min(...v);return pts[l.rid]===x?'win':'loss'}
    case'blow':{let bk=null,bm=-1;W.pairs.forEach(([a,b])=>{const m=Math.abs((pts[a]||0)-(pts[b]||0));if(m>bm){bm=m;bk=Math.min(a,b)}});return bk===Math.min(l.a,l.b)?'win':'loss'}}
  return null}
function settleLeg(l){
  const cmp=(x,y)=>x>y?'win':x<y?'loss':'push';
  if(l.w!=null){if(!weekDone(l.w))return null;const W=weekPts(l.w);W.pairs=pairsOf(S.mu[l.w]).map(([a,b])=>[a.roster_id,b.roster_id]);return legOutcome(l,W)}
  const F=standingsFinal(),st=F&&F.order;const nPO=Math.min(S.league.settings.playoff_teams||6,S.teams.length);
  switch(l.t){
    case'seed1':return st?(st[0]===l.rid?'win':'loss'):null;
    case'last':return st?(st[st.length-1]===l.rid?'win':'loss'):null;
    case'po':return st?((st.indexOf(l.rid)<nPO)===l.yes?'win':'loss'):null;
    case'wins':return F?(l.side==='o'?cmp(F.rec[l.rid].w,l.line):cmp(l.line,F.rec[l.rid].w)):null;
    case'champ':{const f=(S.wb||[]).find(m=>m.p===1&&m.w);return f?(f.w===l.rid?'win':'loss'):(st&&st.indexOf(l.rid)>=nPO?'loss':null)}
    case'toilet':{const t=bracketResult(S.wb,S.lb,S.mu,(S.league.settings||{}).playoff_week_start||15).toilet;return t?(t===l.rid?'win':'loss'):(st&&st.indexOf(l.rid)<nPO?'loss':null)}}
  return null}
function settleBet(b){const r=b.legs.map(settleLeg);if(r.includes('loss'))return{st:'loss',pay:0,r};if(r.includes(null))return{st:'open',r};
  const d=(b.pd||b.legs.reduce((x,l)=>x*l.d,1))/b.legs.reduce((x,l,i)=>x*(r[i]==='push'?l.d:1),1);return{st:r.every(x=>x==='push')?'push':'win',pay:b.stake*Math.max(1,d),r}}
function ledger(){const d=bkLoad();let bank=d.bank,won=0,lost=0,open=0,pl=0,staked=0;
  const rows=d.bets.map(b=>{const s=settleBet(b);staked+=b.stake;if(s.st==='open'){bank-=b.stake;open++}else{bank+=s.pay-b.stake;pl+=s.pay-b.stake;if(s.st==='win')won++;if(s.st==='loss')lost++}return{b,...s}});
  return{d,bank,won,lost,open,pl,staked,rows}}

  <div class="row" style="margin-top:10px"><button class="btn ghost" id="bkShare">Copy my bets for the group chat</button><button class="btn ghost" id="bkReset">Reset to ${f0(START_BANK)} chips</button><span class="mute" id="bkShareMsg"></span></div>`;

function rSlip(bank){
  if(!B.slip.length)return `<div class="panel"><h3 style="margin-top:0">Bet slip</h3><p class="mute" style="margin:0">Tap any odds to add a pick. Add two or more for a parlay.</p>${B.msg?`<p class="up" style="margin:8px 0 0">${h(B.msg)}</p>`:''}</div>`;

   ${multi?`<div class="chips" style="margin-bottom:10px"><button class="chip" data-bm="parlay" aria-pressed="${B.mode==='parlay'}">Parlay</button><button class="chip" data-bm="single" aria-pressed="${B.mode==='single'}">Singles</button></div>`:''}

}

function bkRerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function refreshSlip(){const LG=ledger();const s=$('#slip');if(s){const f=document.activeElement&&document.activeElement.id==='bkStake';s.innerHTML=rSlip(LG.bank);if(f){const i=$('#bkStake');i.focus();const v=i.value;i.value='';i.value=v}}}
document.addEventListener('click',e=>{

});

<script>
/* js/modules/history.js */
/* History: every season this league has on Sleeper, followed back through previous_league_id.
   All-time manager records, trophies, league records, the best players in league history, and a trade ledger that grades
   every trade by the points the players actually scored for their new team plus what the assets are worth today.
   Completed seasons are cached in the browser; the current season is always fetched fresh. */
const HX={sec:'all',state:'idle',err:null,data:null,leagueId:null};
async function histSeason(lg){
  const id=lg.league_id,complete=lg.status==='complete';
  if(complete){const c=await idbGet('hist_v1_'+id);if(c)return c}
  const pws=(lg.settings&&lg.settings.playoff_week_start)||15,last=Math.min(18,pws+3);
  const [users,rosters,wb,lb,drafts,mus,txs]=await Promise.all([
    tj(`${API}/v1/league/${id}/users`),tj(`${API}/v1/league/${id}/rosters`),tj(`${API}/v1/league/${id}/winners_bracket`),tj(`${API}/v1/league/${id}/losers_bracket`),tj(`${API}/v1/league/${id}/drafts`),
    Promise.all(range(1,last).map(w=>tj(`${API}/v1/league/${id}/matchups/${w}`))),
    Promise.all(range(0,last).map(w=>tj(`${API}/v1/league/${id}/transactions/${w}`)))]);
  const U={};(users||[]).forEach(u=>U[u.user_id]={name:u.display_name,team:(u.metadata&&u.metadata.team_name)||u.display_name,avatar:u.avatar});
  const owner={};(rosters||[]).forEach(r=>owner[r.roster_id]=r.owner_id||null);
  const weeks={},muRaw={};
  mus.forEach((mu,i)=>{const w=i+1;if(!mu||!mu.some(m=>m.points>0))return;muRaw[w]=mu.map(m=>({roster_id:m.roster_id,points:m.points||0}));
    weeks[w]=mu.map(m=>{const sp={};(m.starters||[]).forEach(pid=>{if(pid&&pid!=='0')sp[pid]=(m.players_points||{})[pid]||0});return{rid:m.roster_id,uid:owner[m.roster_id],mid:m.matchup_id,pts:m.points||0,sp}})});
  const trades=[];(txs||[]).forEach(list=>(list||[]).forEach(t=>{if(t.type!=='trade'||t.status!=='complete')return;
    trades.push({id:t.transaction_id,week:t.leg||0,ts:t.status_updated||t.created,rids:t.roster_ids||[],adds:t.adds||{},drops:t.drops||{},picks:(t.draft_picks||[]).map(p=>({season:Number(p.season),round:p.round,orig:p.roster_id,from:p.previous_owner_id,to:p.owner_id}))})}));
  // draft results, so a traded pick can be followed to the player it became
  const draft={};
  for(const d of (drafts||[]).filter(d=>d.status==='complete')){
    const [info,picks]=await Promise.all([tj(`${API}/v1/draft/${d.draft_id}`),tj(`${API}/v1/draft/${d.draft_id}/picks`)]);
    const slot=(info&&info.slot_to_roster_id)||{};
    (picks||[]).forEach(p=>{const orig=slot[p.draft_slot]||p.roster_id;draft[`${d.season||lg.season}-${p.round}-${orig}`]={pid:p.player_id,by:p.roster_id}})}
  const br=bracketResult(wb||[],lb||[],muRaw,pws);
  const H={id,season:Number(lg.season),name:lg.name,complete,pws,nPO:(lg.settings&&lg.settings.playoff_teams)||6,users:U,owner,weeks,trades,draft,br,
    poTeams:[...new Set((wb||[]).flatMap(m=>[m.t1,m.t2]).filter(x=>typeof x==='number'))]};
  if(complete)idbSet('hist_v1_'+id,H);
  return H;
}
async function loadHistory(){
  HX.state='loading';HX.err=null;HX.leagueId=S.leagueId;
  try{
    const chain=[];let lg=S.league;const seen=new Set();
    while(lg&&!seen.has(lg.league_id)&&chain.length<12){seen.add(lg.league_id);chain.push(lg);const prev=lg.previous_league_id;if(!prev||prev==='0')break;lg=await tj(`${API}/v1/league/${prev}`)}
    const seasons=[];for(const l of chain)seasons.push(await histSeason(l));
    seasons.sort((a,b)=>a.season-b.season);
    HX.data=histCompute(seasons);HX.state='ready';
  }catch(e){console.error(e);HX.state='error';HX.err=e.message||String(e)}
  if(S.tab==='history')render();
}

/* ---------- the numbers ---------- */
function histCompute(seasons){
  const M={};const who=uid=>M[uid]||(M[uid]={uid,name:'Unknown',team:'',seasons:0,w:0,l:0,t:0,pf:0,pa:0,games:0,po:0,titles:[],runner:[],third:[],toilet:[],best:null,trades:0,tProd:0,tVal:0,tScore:0,hiWeek:null});
  // latest names win
  for(const H of seasons)for(const uid in H.users){const m=who(uid);m.name=H.users[uid].name;m.team=H.users[uid].team}
  const recs={hiWeek:null,loWeek:null,blow:null,close:null};const players={};const seasonRows=[];
  for(const H of seasons){
    const st={};const ownerUid=r=>H.owner[r];
    Object.keys(H.owner).forEach(r=>{if(H.owner[r])st[r]={rid:Number(r),uid:H.owner[r],w:0,l:0,t:0,pf:0,pa:0,hi:0}});
    for(const [w,list] of Object.entries(H.weeks)){const wk=Number(w);
      const byMid={};list.forEach(x=>{if(x.mid!=null)(byMid[x.mid]=byMid[x.mid]||[]).push(x)});
      for(const x of list){for(const [pid,v] of Object.entries(x.sp)){const p=players[pid]||(players[pid]={pid,pts:0,games:0,by:{}});p.pts+=v;p.games++;p.by[x.uid]=(p.by[x.uid]||0)+v}}
      for(const pair of Object.values(byMid)){if(pair.length!==2)continue;const [a,b]=pair;
        for(const [x,y] of [[a,b],[b,a]]){const s=st[x.rid];if(!s)continue;
          if(!x.pts&&!y.pts)continue;
          const rec={pts:x.pts,uid:x.uid,season:H.season,week:wk,opp:y.uid};
          if(!recs.hiWeek||x.pts>recs.hiWeek.pts)recs.hiWeek=rec;
          if(wk<H.pws&&x.pts>0&&(!recs.loWeek||x.pts<recs.loWeek.pts))recs.loWeek=rec;
          const m=who(x.uid);if(!m.hiWeek||x.pts>m.hiWeek.pts)m.hiWeek=rec;
          if(wk>=H.pws)continue; // records below are regular season only
          s.pf+=x.pts;s.pa+=y.pts;if(x.pts>y.pts)s.w++;else if(x.pts<y.pts)s.l++;else s.t++;}
        if(wk<H.pws&&(a.pts||b.pts)){const W=a.pts>=b.pts?a:b,L=W===a?b:a,mg=W.pts-L.pts;const g={w:W.uid,l:L.uid,wp:W.pts,lp:L.pts,m:mg,season:H.season,week:wk};
          if(!recs.blow||mg>recs.blow.m)recs.blow=g;if(mg>0&&(!recs.close||mg<recs.close.m))recs.close=g}}
    }
    const rows=Object.values(st).filter(s=>s.w+s.l+s.t>0).sort((x,y)=>y.w-x.w||y.pf-x.pf);
    rows.forEach((s,i)=>{s.seed=i+1;s.po=H.poTeams.includes(s.rid);s.gp=s.w+s.l+s.t;
      const m=who(s.uid);m.seasons++;m.w+=s.w;m.l+=s.l;m.t+=s.t;m.pf+=s.pf;m.pa+=s.pa;m.games+=s.gp;if(s.po)m.po++;
      const wp=(s.w+s.t/2)/s.gp;if(!m.best||wp>m.best.wp||(wp===m.best.wp&&s.pf/s.gp>m.best.ppg))m.best={season:H.season,w:s.w,l:s.l,t:s.t,wp,ppg:s.pf/s.gp}});
    const br=H.br,u=r=>r!=null?ownerUid(r):null;
    if(H.complete){if(u(br.champ))who(u(br.champ)).titles.push(H.season);if(u(br.runner))who(u(br.runner)).runner.push(H.season);if(u(br.third))who(u(br.third)).third.push(H.season);if(u(br.toilet))who(u(br.toilet)).toilet.push(H.season)}
    seasonRows.push({H,rows,champ:u(br.champ),runner:u(br.runner),third:u(br.third),toilet:u(br.toilet),last:rows.length?rows[rows.length-1].uid:null});
  }
  const trades=gradeTrades(seasons,who);
  // best and worst single seasons
  const allSeasons=seasonRows.flatMap(x=>x.rows.map(r=>({...r,season:x.H.season,complete:x.H.complete,champ:x.champ===r.uid})));
  const done=allSeasons.filter(r=>r.complete);
  const byWp=[...done].sort((a,b)=>(b.w+b.t/2)/b.gp-(a.w+a.t/2)/a.gp||b.pf/b.gp-a.pf/a.gp);
  const byPf=[...done].sort((a,b)=>b.pf/b.gp-a.pf/a.gp);
  const topPlayers=Object.values(players).filter(p=>S.P[p.pid]).sort((a,b)=>b.pts-a.pts).slice(0,15);
  const mvps=seasonRows.map(x=>{const pts={};for(const list of Object.values(x.H.weeks))for(const e of list)for(const [pid,v] of Object.entries(e.sp)){if(!pts[pid])pts[pid]={v:0,by:{}};pts[pid].v+=v;pts[pid].by[e.uid]=(pts[pid].by[e.uid]||0)+v}
    const best=Object.entries(pts).filter(([pid])=>S.P[pid]).sort((a,b)=>b[1].v-a[1].v)[0];return best?{season:x.H.season,pid:best[0],pts:best[1].v,uid:Object.entries(best[1].by).sort((a,b)=>b[1]-a[1])[0][0]}:null});
  return{seasons:seasonRows,managers:Object.values(M).filter(m=>m.seasons>0),recs,topPlayers,mvps,trades,best:byWp[0],worst:byWp[byWp.length-1],bestPf:byPf[0],
    completeCount:seasonRows.filter(x=>x.H.complete).length};
}
/* production after a trade: points a player scored in the starting lineup of a team owned by uid, from the week after the trade on */
function gradeTrades(seasons,who){
  const idx=seasons.map(H=>({s:H.season,weeks:Object.entries(H.weeks).map(([w,l])=>({w:Number(w),list:l}))}));
  const prod=(pid,uid,s0,w0)=>{let t=0;for(const x of idx){if(x.s<s0)continue;for(const k of x.weeks){if(x.s===s0&&k.w<=w0)continue;for(const e of k.list)if(e.uid===uid&&e.sp[pid]!=null)t+=e.sp[pid]}}return t};
  const draftOf=(season,round,orig)=>{for(const H of seasons){const d=H.draft[`${season}-${round}-${orig}`];if(d)return d}return null};
  const futurePick=(season,round,orig)=>{const k=(S.picks||[]).find(p=>p.season===season&&p.round===round&&p.orig===orig);return k?pickValue(k):0};
  const out=[];
  for(const H of seasons)for(const t of H.trades){
    const uidOf=r=>H.owner[r];const items=[];
    for(const [pid,to] of Object.entries(t.adds)){const from=t.drops[pid];items.push({kind:'p',pid,from,to})}
    for(const p of t.picks)items.push({kind:'k',...p,from:p.from,to:p.to});
    for(const it of items){const toU=uidOf(it.to);
      if(it.kind==='p'){it.label=S.P[it.pid]?S.P[it.pid].n:'Unknown player';it.prod=prod(it.pid,toU,H.season,t.week);it.val=S.val[it.pid]||0}
      else{const d=draftOf(it.season,it.round,it.orig);const oName=(H.users[uidOf(it.orig)]||{}).team||'';
        it.label=`${it.season} round ${it.round}${oName?` (${oName})`:''}`;
        if(d){it.became=d.pid;it.label+=` → ${S.P[d.pid]?S.P[d.pid].n:'player'}`;it.prod=prod(d.pid,uidOf(d.by),it.season,0)*(uidOf(d.by)===toU?1:0);it.val=S.val[d.pid]||0}
        else{it.prod=0;it.val=futurePick(it.season,it.round,it.orig)}}}
    const sides=t.rids.map(r=>{const uid=uidOf(r);const inn=items.filter(i=>i.to===r),out_=items.filter(i=>i.from===r);
      const s={uid,rid:r,inn,out:out_,prodIn:inn.reduce((a,i)=>a+i.prod,0),prodOut:out_.reduce((a,i)=>a+i.prod,0),valIn:inn.reduce((a,i)=>a+i.val,0),valOut:out_.reduce((a,i)=>a+i.val,0)};
      s.prodNet=s.prodIn-s.prodOut;s.valNet=s.valIn-s.valOut;s.score=s.prodNet+s.valNet/50;return s});
    if(sides.length<2||!items.length)continue;
    const win=[...sides].sort((a,b)=>b.score-a.score)[0];const margin=win.score-[...sides].sort((a,b)=>b.score-a.score)[1].score;
    sides.forEach(s=>{const m=who(s.uid);m.trades++;m.tProd+=s.prodNet;m.tVal+=s.valNet;m.tScore+=s.score});
    out.push({season:H.season,week:t.week,ts:t.ts,sides,winner:margin>15?win.uid:null,margin});
  }
  return out.sort((a,b)=>b.season-a.season||b.week-a.week);
}

/* ---------- view ---------- */
const hName=uid=>{const m=HX.data&&HX.data.managers.find(x=>x.uid===uid);return m?m.team||m.name:'Unknown'};
const hWho=uid=>{const m=HX.data&&HX.data.managers.find(x=>x.uid===uid);return m?`<span class="pname">${h(m.team||m.name)}</span> <span class="psub">@${h(m.name)}</span>`:'Unknown'};
const rec=(w,l,t)=>`${w}-${l}${t?'-'+t:''}`;

    ${traders.length?card('Best trader',`<div>${hWho(traders[0].uid)}</div><div class="num hx-big">${traders[0].tProd>=0?'+':''}${f0(traders[0].tProd)} pts</div><div class="psub">won in production across ${traders[0].trades} ${traders[0].trades===1?'trade':'trades'}</div>`):''}
  </div>
  <h3>All-time standings</h3><div class="panel scroll"><table><thead><tr><th>Manager</th><th class="r">Seasons</th><th class="r">Record</th><th class="r">Win %</th><th class="r">Points for</th><th class="r">Per week</th><th class="r">Playoffs</th><th class="r">Titles</th><th class="r">Runner-up</th><th class="r">Toilet bowls</th><th>Best season</th></tr></thead><tbody>

function hxSeason(D,y){

const mostActive=tr=>{const c={};tr.forEach(t=>t.sides.forEach(s=>c[s.uid]=(c[s.uid]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]};
function tradeList(tr){return tr.map(t=>`<div class="panel hx-trade"><div class="psub">${t.season}${t.week?`, week ${t.week}`:', offseason'}${t.winner?`. Winner: <b>${h(hName(t.winner))}</b>`:'. Even so far'}</div>

    <div class="psub">Production <b class="num ${s.prodNet>=0?'up':'down'}">${s.prodNet>=0?'+':''}${f0(s.prodNet)}</b>, value today <b class="num ${s.valNet>=0?'up':'down'}">${s.valNet>=0?'+':''}${f0(s.valNet)}</b></div></div>`).join('')}</div></div>`).join('')}
function hxTrades(D){
  const T=[...D.managers].filter(m=>m.trades).sort((a,b)=>b.tScore-a.tScore);
  if(!D.trades.length)return `<div class="panel">No trades in this league's history yet.</div>`;
  const all=D.trades.flatMap(t=>t.sides.map(s=>({t,s})));const heist=[...all].sort((a,b)=>b.s.score-a.s.score)[0],fleeced=[...all].sort((a,b)=>a.s.score-b.s.score)[0];
  return `<p class="lede">Every trade is graded two ways. Production is the fantasy points the incoming players scored in that manager's starting lineup after the deal, minus what the outgoing players scored for their new teams. Value today is what those assets are worth on the current market (drafted picks count as the player they became). The overall score is production plus value divided by 50.</p>

<script>

/* Gazette: El Pasquín, the weekly roast newspaper built from real results */
function weekFacts(w){
  const mu=S.mu[w];if(!mu||!mu.some(m=>m.points>0))return null;
  const T={};mu.forEach(m=>{const t=S.byRid[m.roster_id];if(!t)return;const pp=m.players_points||{};
    const st=(m.starters||[]).filter(id=>id&&id!=='0'&&S.P[id]);const pl=(m.players||[]).filter(id=>S.P[id]);
    const opt=optimize(pl,id=>pp[id]||0).total;const sorted=st.map(id=>({id,p:pp[id]||0})).sort((a,b)=>b.p-a.p);
    const benchStar=pl.filter(id=>!st.includes(id)).map(id=>({id,p:pp[id]||0})).sort((a,b)=>b.p-a.p)[0];
    T[m.roster_id]={t,pts:m.points||0,opt,bench:Math.max(0,opt-(m.points||0)),star:sorted[0],dud:sorted[sorted.length-1],benchStar}});
  const games=pairsOf(mu).map(([a,b])=>{const A=T[a.roster_id],B=T[b.roster_id];const W=A.pts>=B.pts?A:B,L=W===A?B:A;W.won=true;L.won=false;W.opp=L;L.opp=W;W.margin=L.margin=W.pts-L.pts;return{W,L,m:W.pts-L.pts}});
  // records through this week
  const rec={};S.teams.forEach(t=>rec[t.rid]={w:0,l:0});
  for(let x=1;x<=w;x++)pairsOf(S.mu[x]).forEach(([a,b])=>{if(!(a.points||b.points))return;const wn=a.points>=b.points?a:b,ls=wn===a?b:a;rec[wn.roster_id].w++;rec[ls.roster_id].l++});
  const all=Object.values(T);all.forEach(x=>{x.rec=rec[x.t.rid];x.beat=all.filter(o=>o!==x&&x.pts>o.pts).length});
  const byPts=[...all].sort((a,b)=>b.pts-a.pts);const med=(byPts[Math.floor(all.length/2)-1].pts+byPts[Math.floor(all.length/2)].pts)/2;
  const tx=S.tx[w]||[];const trades=tx.filter(x=>x.type==='trade');const adds={};tx.filter(x=>x.type!=='trade').forEach(x=>(x.roster_ids||[]).forEach(r=>adds[r]=(adds[r]||0)+Object.keys(x.adds||{}).length));
  const byG=[...games].sort((a,b)=>b.m-a.m);
  return{w,all,games,top:byPts[0],low:byPts[byPts.length-1],blow:byG[0],close:byG[byG.length-1],med,
    benchKing:[...all].sort((a,b)=>b.bench-a.bench)[0],lucky:[...all].filter(x=>x.won&&x.pts<med).sort((a,b)=>a.pts-b.pts)[0],
    unlucky:[...all].filter(x=>!x.won&&x.pts>med).sort((a,b)=>b.pts-a.pts)[0],trades,adds,
    grinder:Object.entries(adds).sort((a,b)=>b[1]-a[1])[0],standings:[...S.teams].map(t=>({t,...rec[t.rid]})).sort((a,b)=>b.w-a.w||a.l-b.l)};
}

const LINES={

 en:{

  deck:[f=>`Meanwhile ${f.low.t.name} put up ${f1(f.low.pts)} and emergency services have been notified. All that and more in the week ${f.w} edition.`,f=>`In the basement, ${f.low.t.name} (${f1(f.low.pts)}) keeps proving that owning a roster is not the same as having a team.`],
  low:[f=>`With ${f1(f.low.pts)} points, ${f.low.t.name} remains the weekly relief of every opponent. Sources confirm the roster has been on strike since August.`,f=>`${f.low.t.name} finished with ${f1(f.low.pts)}. Even a replay review couldn't find more points.`],
  blow:f=>`${f.blow.W.t.name} ran over ${f.blow.L.t.name}, ${f1(f.blow.W.pts)} to ${f1(f.blow.L.pts)}. A ${f1(f.blow.m)}-point gap that has been reported to the authorities.`,
  close:f=>`${f.close.W.t.name} beat ${f.close.L.t.name} by just ${f1(f.close.m)}. League cardiologists remain on call.`,
  bench:f=>`${f.benchKing.t.name} left ${f1(f.benchKing.bench)} points rotting on the bench${f.benchKing.benchStar?`, including ${f1(f.benchKing.benchStar.p)} from ${nm(f.benchKing.benchStar.id)}`:''}. Head coach wanted; apply with the commissioner.`,
  lucky:f=>`${f.lucky.t.name} won with a measly ${f1(f.lucky.pts)}. Not even he believes it, but the W counts.`,

function writePaper(f,lang){
  const L=LINES[lang],r=rng(Number(S.leagueId.slice(-6))+f.w*97+(lang==='es'?1:2)),pick=a=>a[Math.floor(r()*a.length)];
  const stories=[{h:L.s.worst,b:pick(L.low)(f)},{h:L.s.blow,b:L.blow(f)},{h:L.s.close,b:L.close(f)}];
  if(f.benchKing&&f.benchKing.bench>8)stories.push({h:L.s.bench,b:L.bench(f)});
  if(f.lucky)stories.push({h:L.s.lucky,b:L.lucky(f)});
  if(f.unlucky)stories.push({h:L.s.unlucky,b:L.unlucky(f)});
  const mv=f.trades.map(tr=>L.trade(...(tr.roster_ids||[]).slice(0,2).map(id=>S.byRid[id]?S.byRid[id].name:'?')));
  if(f.grinder&&f.grinder[1]>=3)mv.push(L.grind(S.byRid[f.grinder[0]].name,f.grinder[1]));
  if(mv.length)stories.push({h:L.s.moves,b:mv.join(' ')});
  const caps=[...f.all].sort((a,b)=>b.pts-a.pts).map(x=>{const big=x.margin>25;const res=pick(L.cap[x.won?(big?'winBig':'winClose'):(big?'loseBig':'loseClose')])(x);
    const parts=[res];if(x.star)parts.push(pick(L.cap.star)(x));if(x.dud&&x.dud.p<6)parts.push(pick(L.cap.dud)(x));if(x.bench>12)parts.push(L.cap.bench(x));parts.push(L.cap.rec(x));
    return{name:x.t.name,handle:x.t.handle,pts:x.pts,body:parts.join(' ')}});
  return{headline:pick(L.head)(f),deck:pick(L.deck)(f),stories,caps};
}
function rPaper(){
  const weeks=range(1,S.week).filter(w=>(S.mu[w]||[]).some(m=>m.points>0));
  if(!weeks.length)return `<h2>Gazette</h2><p class="lede">The first edition prints once week 1 has points on the board.</p>`;
  if(!S.gzWeek||!weeks.includes(S.gzWeek))S.gzWeek=weeks.filter(w=>w<S.week).pop()||weeks[weeks.length-1];
  const f=weekFacts(S.gzWeek);const lang=S.lang||'es';const live=S.gzWeek===S.week;const native=!!LINES[lang];
  let P,L,trNote='';
  if(S.aiPaper[S.gzWeek+lang]){P=S.aiPaper[S.gzWeek+lang];L=(LINES[lang]||LINES.en).s}
  else if(native){P=writePaper(f,lang);L=LINES[lang].s}
  else{const T=gzTranslated(f,lang);P=T.P;L=T.L;trNote=T.note}
  const ctrl=`<div class="row"><select id="gzWeek" aria-label="Week">${weeks.map(w=>`<option value="${w}" ${w===S.gzWeek?'selected':''}>${L.week} ${w}${w===S.week?' (live)':''}</option>`).join('')}</select>
   ${langPicker(lang)}
   <button class="btn ghost" id="btnCopy">Copy for the group chat</button><button class="btn" id="btnAI" hidden>Have Claude write a sharper edition</button><span id="aiMsg" class="mute"></span></div>${trNote?`<p class="psub" style="margin:0 0 12px">${trNote}</p>`:''}`;
  return `<h2>The weekly roast</h2><p class="lede">Every storyline comes from real results: scores, margins, bench points left behind, lucky wins, trades and waiver moves.</p>${ctrl}
  <article class="paper" id="paperBody" lang="${h(lang)}" dir="${/^(ar|he|fa|ur)/.test(lang)?'rtl':'ltr'}">
    <header class="mast"><div class="name">El Pasquín</div><div class="sub">${h(S.league.name)}, ${h(L.week.toLowerCase())} ${f.w} ${h(L.of||'')} ${S.season}${live?` <span class="stamp">${h(L.live||'Live')}</span>`:''}</div></header>
    <h3 class="lead">${h(P.headline)}</h3><p class="deck">${h(P.deck)}</p>
    <div class="cols">${P.stories.map(s=>`<div class="story"><h4>${h(s.h)}</h4><p>${h(s.b)}</p></div>`).join('')}</div>
    <section class="caps"><h4 style="font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;margin:0">${L.caps}</h4>
    <div class="cols">${P.caps.map(c=>`<div class="story"><h5>${h(c.name)}</h5><div class="rec">@${h(c.handle||'')}${c.pts!=null?', '+f1(c.pts):''}</div><p>${h(c.body)}</p></div>`).join('')}</div></section>
    <section class="caps"><h4 style="font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;margin:0 0 6px">${L.stand}</h4><div class="scroll"><table><tbody>
    ${f.standings.map((s,i)=>`<tr><td>${i+1}</td><td>${h(s.t.name)}</td><td class="r">${s.w}-${s.l}</td></tr>`).join('')}</tbody></table></div></section>
  </article>`;
}

function getSample(){if(!samplePromise)samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);return samplePromise}
async function aiEdition(){
  const s=await getSample();if(!s)return;const f=weekFacts(S.gzWeek);const lang=S.lang;const btn=$('#btnAI'),msg=$('#aiMsg');btn.disabled=true;msg.textContent='Writing…';

    trades:f.trades.map(t=>(t.roster_ids||[]).map(id=>S.byRid[id]&&S.byRid[id].name)),waiver_moves:f.adds&&Object.fromEntries(Object.entries(f.adds).map(([k,v])=>[S.byRid[k]?S.byRid[k].name:k,v]))};
  const prompt=`You write a savage but friendly satirical fantasy football newspaper for a group of friends. Write in ${lang==='es'?'Mexican Spanish':langName(lang)}, casual and witty, no slurs, no insults about real-life traits. Roast everyone using ONLY these facts; never invent scores or players.\nFACTS: ${JSON.stringify(facts)}\nReturn ONLY JSON: {"headline":string,"deck":string,"stories":[{"h":string,"b":string}] (5-7 stories, 2-4 sentences each),"caps":[{"name":team name,"handle":manager,"pts":number,"body":2-3 sentence roast}] (one per team, ordered by points)}`;
  try{const out=await s.json(prompt,{modelTier:'default'});if(out&&out.headline){S.aiPaper[S.gzWeek+lang]=out;render()}else msg.textContent='The edition came back empty. Try again.'}
  catch(e){msg.textContent=e&&e.code==='rate_limited'?'Too many requests. Wait a minute and retry.':e&&e.code==='not_granted'?'Permission was not granted.':'Could not write the edition this time.';btn.disabled=false}
}

function langName(code){const k=LANGS.find(x=>x[0].toLowerCase()===String(code).toLowerCase());if(k)return k[1];try{return new Intl.DisplayNames(['en'],{type:'language'}).of(code)||code}catch(e){return code}}

function hashStr(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return (x>>>0).toString(36)}
/* build the English edition, shield names behind [n] tokens, translate, restore */
function gzTranslated(f,lang){
  const P=writePaper(f,'en'),Ls=LINES.en.s;
  const names=[...new Set([...S.teams.flatMap(t=>[t.name,t.handle]),...f.all.flatMap(x=>[x.star,x.dud,x.benchStar].filter(Boolean).map(y=>nm(y.id))),S.league.name].filter(n=>n&&n.length>1))].sort((a,b)=>b.length-a.length);
  const shield=s=>{let o=String(s);names.forEach((n,i)=>{o=o.split(n).join(`[${i}]`)});return o};
  const unshield=s=>String(s).replace(/\[\s*(\d+)\s*\]/g,(m,i)=>names[Number(i)]??m);
  const src=[P.headline,P.deck,...P.stories.flatMap(s=>[s.h,s.b]),...P.caps.map(c=>c.body),Ls.week,Ls.of,Ls.live,Ls.caps,Ls.stand].map(shield);
  const key=`wr_gz_${lang}_${hashStr(src.join('␞'))}`;
  let done=GZTR[key];if(!done){try{const c=JSON.parse(store.get(key)||'null');if(c&&c.length===src.length)done=GZTR[key]=c}catch(e){}}
  if(!done&&!GZTR[key+'_busy']){GZTR[key+'_busy']=true;translateAll(src,lang).then(out=>{GZTR[key]=out;store.set(key,JSON.stringify(out));delete GZTR[key+'_busy'];if(S.tab==='paper')render()}).catch(err=>{GZTR[key+'_err']=err.message||String(err);delete GZTR[key+'_busy'];if(S.tab==='paper')render()})}
  if(!done){const err=GZTR[key+'_err'];return{P,L:Ls,note:err?`Couldn't translate to ${h(langName(lang))}: ${h(err)} Showing English.`:`Translating to ${h(langName(lang))}… Showing English until it's ready.`}}
  let i=0;const t=()=>unshield(done[i++]);
  const TP={headline:t(),deck:t(),stories:P.stories.map(()=>({h:t(),b:t()})),caps:P.caps.map(c=>({...c,body:t()}))};
  const TL={...Ls,week:t(),of:t(),live:t(),caps:t(),stand:t()};
  return{P:TP,L:TL,note:`Machine-translated to ${h(langName(lang))}.`};
}
async function translateAll(list,lang){
  const cfg=(CONFIG.translate||{provider:'mymemory'});const out=new Array(list.length);let next=0,firstErr=null;
  const one=async s=>{
    if(!s||!s.trim())return s;
    if(cfg.provider==='libretranslate'){const r=await fetch(cfg.url.replace(/\/$/,'')+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:s,source:'en',target:lang.split('-')[0],format:'text',api_key:cfg.key||undefined})});if(!r.ok)throw new Error('Translation service returned '+r.status+'.');return (await r.json()).translatedText}
    if(cfg.provider==='proxy'){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:s,source:'en',target:lang})});if(!r.ok)throw new Error('Translation service returned '+r.status+'.');const d=await r.json();return d.text||d.translatedText}
    // MyMemory: free, no key, about 5,000 characters a day per visitor (50,000 with an email in config)
    const parts=s.length<=480?[s]:s.match(/[^.!?]+[.!?]*\s*/g).reduce((a,x)=>{if(a.length&&(a[a.length-1]+x).length<=480)a[a.length-1]+=x;else a.push(x);return a},[]);
    const res=[];for(const p of parts){const u=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(p)}&langpair=en|${encodeURIComponent(lang)}${cfg.email?'&de='+encodeURIComponent(cfg.email):''}`;
      const r=await fetch(u);if(!r.ok)throw new Error('Translation service returned '+r.status+'.');const d=await r.json();const txt=d&&d.responseData&&d.responseData.translatedText;
      if(!txt||Number(d.responseStatus)!==200||/MYMEMORY WARNING/i.test(txt))throw new Error(/QUOTA|WARNING/i.test(String(txt)+String(d.responseDetails))?'The free daily translation quota on this device is used up. Try again tomorrow.':'The translation service refused this language code.');
      res.push(txt)}
    return res.join(' ');
  };
  const worker=async()=>{while(next<list.length&&!firstErr){const i=next++;try{out[i]=await one(list[i])}catch(e){firstErr=e}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(firstErr)throw firstErr;return out;
}

<script>
/* js/app.js */
/* App shell: sign-in with a Sleeper username, league picker, tab bar, routing between modules, boot,
   and the screen shown when Sleeper can't be reached */
function tabs(){return [...MODULES].sort((a,b)=>a.order-b.order)}
function renderChrome(){
  const L=S.league,me=S.byRid[S.meRid];
  $('#lgName').textContent=L.name;
  const inProg=Object.values(S.games).some(g=>g.state==='in');
  $('#lgMeta').innerHTML=`${inProg?'<span class="live-dot"></span>':''}Week ${S.week}, ${S.season} season. ${L.total_rosters}-team ${S.isDynasty?'dynasty':'redraft'}, ${S.slots.includes('SUPER_FLEX')?'Superflex':'1QB'}, ${(L.scoring_settings.rec??0)} PPR.${me&&S.inLeague?` You are ${h(me.name)} (${me.w}-${me.l}${me.t?'-'+me.t:''}).`:' You aren’t in this league, so you’re viewing it as a guest.'}`;
  renderAcct();
  $('#tabs').innerHTML=tabs().map(m=>`<button role="tab" aria-selected="${S.tab===m.key}" data-tab="${m.key}">${m.label}</button>`).join('');
  $('#foot').innerHTML=`Data: Sleeper API (league, rosters, projections, live points), ESPN (game clocks, headlines), ${h(S.valueSource)}. ${S.projOK?'':'Sleeper projections did not load, so projections read as zero. '}Live numbers refresh every 60 seconds while games are on.`;
}
function renderAcct(){
  const lg=S.myLeagues||[];
  $('#acct').innerHTML=S.username?`<span class="acct-user">@${h(S.username)}</span>
    ${lg.length>1?`<select id="acctLeague" aria-label="League">${S.leagueId?'':'<option value="" selected disabled>Choose a league</option>'}${lg.map(l=>`<option value="${l.league_id}" ${l.league_id===S.leagueId?'selected':''}>${h(l.name)}</option>`).join('')}</select>`:''}
    <button class="acct-btn" id="acctSwitch" type="button">Switch user</button>`:'';
}
function render(){
  const m=MODULES.find(x=>x.key===S.tab)||tabs()[0];S.tab=m.key;
  try{$('#main').innerHTML=m.render();if(m.after)m.after()}
  catch(err){console.error(err);$('#main').innerHTML=`<div class="err"><b>${h(m.label)} hit an error.</b><p style="margin:6px 0 0">${h(err&&err.message||String(err))}</p><p class="psub" style="margin:6px 0 0">Send this message to whoever runs War Room. The other tabs still work.</p></div>`}
  try{history.replaceState(null,'',`?user=${encodeURIComponent(S.username)}&league=${encodeURIComponent(S.leagueId)}#${m.key}`)}catch(e){}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;renderChrome();render();window.scrollTo(0,0)});
if(location.hash.length>1)S.tab=location.hash.slice(1);

/* ---------- sign in and pick a league ---------- */
function bare(title,meta){$('#lgName').textContent=title;$('#lgMeta').textContent=meta||'';$('#tabs').innerHTML='';$('#foot').textContent='';renderAcct()}
function showSignIn(msg){
  bare('War Room','Live projections, rankings, trades, forecasts, a sportsbook and a weekly roast for your Sleeper league.');
  $('#main').innerHTML=`<section class="signin">
    <h2>Sign in with your Sleeper username</h2>
    <p class="lede">War Room finds every league you're in this season. No password: it only reads what Sleeper already makes public.</p>
    <form id="signin" class="signin-form" autocomplete="off"><label for="suUser">Sleeper username</label>
      <div class="row" style="margin:6px 0 0"><input id="suUser" value="${h(S.username||'')}" placeholder="e.g. antoniojzaratel" autocapitalize="none" spellcheck="false" required>
      <button class="btn" type="submit">Find my leagues</button></div></form>
    ${msg?`<p class="down" style="margin:10px 0 0">${h(msg)}</p>`:''}
  </section>`;
  setTimeout(()=>{const i=$('#suUser');if(i)i.focus()},0);
}
async function fetchLeagues(username){
  let user=null;try{user=await j(`${API}/v1/user/${encodeURIComponent(username)}`)}catch(e){if(!/^404/.test(e.message))throw e}
  if(!user||!user.user_id)return{user:null,leagues:[]};
  const st=await j(API+'/v1/state/nfl');let season=st.season;
  let leagues=(await tj(`${API}/v1/user/${user.user_id}/leagues/nfl/${season}`))||[];
  if(!leagues.length&&st.previous_season){season=st.previous_season;leagues=(await tj(`${API}/v1/user/${user.user_id}/leagues/nfl/${season}`))||[]}
  leagues.sort((a,b)=>(b.league_id===DEF_LEAGUE)-(a.league_id===DEF_LEAGUE)||a.name.localeCompare(b.name));
  return{user,leagues,season};
}
const lgDesc=l=>{const s=l.settings||{},rp=l.roster_positions||[];return `${l.total_rosters}-team ${s.type===2?'dynasty':s.type===1?'keeper':'redraft'}, ${rp.includes('SUPER_FLEX')?'Superflex':'1QB'}, ${(l.scoring_settings||{}).rec??0} PPR`};
function showPicker(){
  const lg=S.myLeagues||[];
  bare('War Room',`Signed in as @${S.username}`);
  $('#main').innerHTML=`<h2>Pick a league</h2><p class="lede">${lg.length} ${lg.length===1?'league':'leagues'} on Sleeper for @${h(S.username)}. You can switch any time from the top of the page.</p>
  <div class="lg-grid">${lg.map(l=>`<button class="lg-card" data-lg="${h(l.league_id)}">
    ${l.avatar?`<img src="https://sleepercdn.com/avatars/thumbs/${h(l.avatar)}" alt="" width="48" height="48" loading="lazy">`:'<span class="lg-ph" aria-hidden="true"></span>'}
    <span><span class="pname">${h(l.name)}</span>${l.league_id===DEF_LEAGUE?' <span class="tag good">War Room league</span>':''}<span class="psub" style="display:block">${h(lgDesc(l))}, ${h(l.season)}</span></span></button>`).join('')}</div>`;
}
async function signIn(username){
  username=username.trim();if(!username)return showSignIn();
  $('#main').innerHTML='<div class="status">Looking up your leagues on Sleeper…</div>';
  const r=await fetchLeagues(username);
  if(!r.user)return showSignIn(`Sleeper has no user called "${username}". Check the spelling; it's the name under your avatar in the Sleeper app.`);
  if(!r.leagues.length)return showSignIn(`@${r.user.display_name||username} isn't in any NFL leagues this season.`);
  S.username=r.user.display_name||username;S.myLeagues=r.leagues;store.set('wr_user',S.username);
  if(S.leagueId&&r.leagues.some(l=>l.league_id===S.leagueId))return openLeague(S.leagueId);
  if(r.leagues.length===1)return openLeague(r.leagues[0].league_id);
  S.leagueId='';showPicker();
}
async function openLeague(id){
  S.leagueId=id;store.set('wr_league',id);
  try{await load()}catch(e){console.error(e);showBlocked(e)}
}
document.addEventListener('submit',e=>{if(e.target.id==='signin'){e.preventDefault();boot(()=>signIn($('#suUser').value))}});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-lg]');if(c){boot(()=>openLeague(c.dataset.lg));return}
  if(e.target.id==='acctSwitch'){S.username='';S.leagueId='';S.myLeagues=null;store.set('wr_user','');store.set('wr_league','');clearInterval(liveTimer);showSignIn()}
});
document.addEventListener('change',e=>{if(e.target.id==='acctLeague')boot(()=>openLeague(e.target.value))});

/* ---------- when Sleeper can't be reached ---------- */
const SNAP=[["ZaraTDs","antoniojzaratel",9.4,23.8,94],["Colageno Special Team","FerCantu2001",8.6,18.5,92],["Glock Purdy","legargamer",8.4,15.7,89],["Turgers💍","Furber",8.2,16.8,91],["Juanimales (grr)","juanfrangzz",7.6,7.4,69],["Le Noide’s Equipe 🚬","HumbertoMena17",6.6,6.9,64],["UÑITAS 💅","andresguerecag",6.2,2.1,19],["Hock-Tua Fc","DiegoPedraza",6.1,3.6,34],["FM7","federicomedina72",4.8,2.9,27],["LALOCOMOTORA 🚂","Lalocomotora21",3.7,2.4,22]];
function showBlocked(err){
  const inClaude=/claude\.ai|claudeusercontent/.test(location.hostname)||location.protocol==='blob:'||window.top!==window.self;
  bare('War Room','Could not reach Sleeper');
  const site=CONFIG.siteUrl||'';
  $('#main').innerHTML=`<div class="err"><b>${inClaude?'This preview can’t load live data.':'Sleeper didn’t respond.'}</b>
    <p style="margin:6px 0 0">${inClaude?'Pages shown inside claude.ai aren’t allowed to call Sleeper, ESPN or other outside sites. The full War Room, with live scores, every tool and the sportsbook, runs on the GitHub Pages site.':h(err&&err.message||'The request failed.')+' Check your connection, then reload the page.'}</p>
    ${site?`<p style="margin:12px 0 0"><a class="btn" href="${h(site)}" target="_blank" rel="noopener">Open the live War Room</a></p>`:''}</div>
  ${inClaude||S.leagueId===DEF_LEAGUE?`<h2>La Dinastía, snapshot from September 25, 2026</h2><p class="lede">Three-season average projected wins and title odds from The Dynasty Terminal model.</p>
  <div class="panel scroll"><table><thead><tr><th>#</th><th>Team</th><th class="r">Avg wins</th><th class="r">Title odds</th><th class="r">Playoffs</th></tr></thead><tbody>
  ${SNAP.map((r,i)=>`<tr class="${r[1]===DEF_USER?'me':''}"><td class="num">${i+1}</td><td><div class="pname">${h(r[0])}</div><div class="psub">@${h(r[1])}</div></td><td class="r num">${r[2]}</td><td class="r num">${r[3]}%</td><td class="r num">${r[4]}%</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

/* ---------- boot ---------- */
async function boot(step){
  try{
    if(step)return await step();
    if(!S.username)return showSignIn();
    await signIn(S.username);
  }catch(e){console.error(e);showBlocked(e)}
}
boot();

</script>
