<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War Room · La Dinastía</title>
<meta name="description" content="Live projections, rankings, trades, forecasts, a sportsbook and a weekly roast newspaper for a Sleeper fantasy league.">
<meta name="theme-color" content="#1B4D33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cellipse cx=%2232%22 cy=%2232%22 rx=%2228%22 ry=%2217%22 fill=%22%239E6300%22 transform=%22rotate(-35 32 32)%22/%3E%3Cpath d=%22M22 40l20-16M27 33l4 4M31 29l4 4M35 25l4 4%22 stroke=%22%23fff%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EA;--panel:#FFFFFF;--panel2:#F4F7F1;--ink:#10251A;--mute:#5B6C60;--line:#D2DBCE;
  --amber:#9E6300;--red:#C0343A;--mint:#1C8150;--field:#1B4D33;--fieldink:#F3F7EF;--chalkline:rgba(243,247,239,.28);
  --num:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1D14;--panel:#12291C;--panel2:#173322;--ink:#E9F0E4;--mute:#95A99A;--line:#25452F;
  --amber:#F4B62C;--red:#F0646A;--mint:#5CD49B;--field:#0F3A24;--fieldink:#F3F7EF;}}
:root[data-theme="dark"]{--bg:#0C1D14;--panel:#12291C;--panel2:#173322;--ink:#E9F0E4;--mute:#95A99A;--line:#25452F;
  --amber:#F4B62C;--red:#F0646A;--mint:#5CD49B;--field:#0F3A24;--fieldink:#F3F7EF;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mute{color:var(--mute)}.up{color:var(--mint)}.down{color:var(--red)}.amber{color:var(--amber)}

/* header: the field */
.top{background:var(--field);color:var(--fieldink);position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--chalkline) calc(10% - 1px) 10%);pointer-events:none;opacity:.55}
.top-in{position:relative;max-width:1200px;margin:0 auto;padding:18px 20px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.brand h1{font-family:var(--num);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;letter-spacing:.01em}
.brand .meta{font-size:14px;opacity:.85}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF5A4E;margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
@keyframes pulse{50%{opacity:.25}}
.setup{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;align-items:center;font-size:14px}
.setup input{background:rgba(255,255,255,.1);border:1px solid var(--chalkline);border-radius:6px;padding:6px 9px;color:var(--fieldink);width:190px}
.setup button{background:var(--fieldink);color:var(--field);border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--fieldink);opacity:.72;padding:10px 14px 12px;font-family:var(--num);font-size:18px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--amber)}
main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
h2{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.1;margin:30px 0 6px}
h2:first-child{margin-top:4px}
h3{font-family:var(--num);font-weight:600;font-size:20px;margin:18px 0 6px}
p.lede{margin:0 0 16px;color:var(--mute);max-width:68ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:600;font-size:13px;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.me td{background:var(--panel2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.bad{color:var(--red);border-color:currentColor;background:transparent}
.tag.good{color:var(--mint);border-color:currentColor;background:transparent}
.pos{display:inline-block;min-width:34px;text-align:center;font-family:var(--num);font-weight:600;font-size:13px;border-radius:4px;padding:0 5px;color:#fff}
.pos.QB{background:#B8465A}.pos.RB{background:#2F8F6A}.pos.WR{background:#3C78B5}.pos.TE{background:#C27A1F}.pos.K{background:#6F6A8F}.pos.DEF{background:#5D6B5F}
.pos.FLEX,.pos.SUPER_FLEX,.pos.REC_FLEX,.pos.WRRB_FLEX{background:#7B8A7E}
.pname{font-weight:600}.psub{font-size:13px;color:var(--mute)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{padding:40px 0;color:var(--mute)}
.err{border-left:4px solid var(--red);background:var(--panel);padding:14px 16px;border-radius:6px;max-width:760px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--mint)}

/* scoreboard: the one loud thing */
.board{background:var(--field);color:var(--fieldink);border-radius:12px;padding:20px 22px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--chalkline)}
.board-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative;z-index:1}
.board .tname{font-family:var(--num);font-weight:600;font-size:clamp(18px,3vw,24px);line-height:1.1}
.board .handle{font-size:13px;opacity:.75}
.board .big{font-family:var(--num);font-weight:700;font-size:clamp(56px,11vw,96px);line-height:.95;color:#FFC94A;font-variant-numeric:tabular-nums;margin-top:8px}
.board .sub{font-size:14px;opacity:.85}
.board .side.right{text-align:right}
.wp{position:relative;z-index:1;margin-top:16px}
.wp .track{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;display:flex}
.wp .track i{display:block;background:#FFC94A}
.wp .lbl{display:flex;justify-content:space-between;font-family:var(--num);font-size:18px;margin-top:4px}
.mini{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mini .r{text-align:right}
.mini .sc{font-family:var(--num);font-size:24px;font-weight:600}
.mini .mid{font-family:var(--num);font-size:14px;color:var(--mute);text-align:center;min-width:70px}
.plist td{padding:6px 8px}
.flag{color:var(--red);font-weight:600;font-size:13px}

/* trade lab */
.tl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.tl{grid-template-columns:1fr}.board-grid{grid-template-columns:1fr}.board::after{display:none}.board .side.right{text-align:left}}
.assets{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.assets label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.assets label:last-child{border-bottom:0}
.assets .v{margin-left:auto;font-family:var(--num);font-size:16px}
.verdict{font-family:var(--num);font-size:28px;font-weight:700}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0}
.split i:first-child{background:var(--amber)}.split i:last-child{background:var(--mint)}

/* gazette */
.paper{background:#ECE8DF;color:#17140F;border-radius:4px;padding:26px clamp(16px,4vw,44px) 36px;box-shadow:0 1px 0 #cfc9bb inset;max-width:980px}
.mast{text-align:center;border-bottom:4px double #17140F;padding-bottom:10px;margin-bottom:18px}
.mast .name{font-family:Anton,Impact,sans-serif;font-size:clamp(40px,9vw,86px);line-height:.95;color:#B5121B;letter-spacing:.01em}
.mast .sub{font-family:"Source Serif 4",Georgia,serif;font-size:15px;margin-top:6px}
.paper .lead{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;margin:6px 0 10px;text-wrap:balance}
.paper .deck{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.5;margin:0 0 20px;font-style:italic}
.paper .cols{columns:2 300px;column-gap:32px;column-rule:1px solid #b9b2a2}
.paper .story{break-inside:avoid;margin:0 0 18px}
.paper .story h4{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:20px;line-height:1.2;margin:0 0 4px}
.paper p{font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.6;margin:0 0 8px}
.paper .caps{margin-top:18px;border-top:2px solid #17140F;padding-top:12px}
.paper .caps h5{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;margin:14px 0 2px;color:#17140F}
.paper .caps .rec{font-family:"Source Serif 4",Georgia,serif;font-size:14px;color:#6B6252}
.paper table{font-family:"Source Serif 4",Georgia,serif;font-size:15px}
.paper th,.paper td{border-color:#b9b2a2;color:#17140F}
.stamp{display:inline-block;border:2px solid #B5121B;color:#B5121B;font-family:Anton,Impact,sans-serif;padding:2px 10px;transform:rotate(-2deg);font-size:14px}

/* sportsbook */
.bk-bar{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center;background:var(--field);color:var(--fieldink);border-radius:12px;padding:16px 20px;margin-bottom:8px}
.bk-bar .psub{color:var(--fieldink);opacity:.75}
.bk-bar .chip{background:transparent;color:var(--fieldink);border-color:var(--chalkline)}
.bk-bar .chip[aria-pressed="true"]{background:var(--fieldink);color:var(--field)}
.bk-bar .up{color:#7BE3AE}.bk-bar .down{color:#FF9A9E}
.bk-big{font-size:40px;font-weight:700;line-height:1;color:#FFC94A}.bk-mid{font-size:28px;font-weight:600;line-height:1}
.bk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.bk-layout aside{position:sticky;top:12px;margin-top:18px}
.bk-games{padding:4px 16px}
.bk-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 78px 92px;gap:8px;align-items:center;padding:8px 0}
.bk-row.bk-second{border-bottom:1px solid var(--line);padding-bottom:12px}
.bk-games .bk-row:last-child{border-bottom:0}
.bk-head{font-size:13px;color:var(--mute);font-weight:600;padding:8px 0 0}.bk-head span{text-align:center}
.odd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:48px;padding:4px 6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;cursor:pointer;line-height:1.15}
.odd:hover{border-color:var(--ink)}
.odd[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.odd .ol{font-size:13px;opacity:.8}.odd .ov{font-size:18px;font-weight:600}
.bk-li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.bk-li:last-child{border-bottom:0}.bk-li .odd{min-width:78px;min-height:40px}
.bk-yn{display:grid;grid-template-columns:78px 78px;gap:6px;text-align:center}
.bk-leg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.bk-x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mute);padding:4px 8px}
.bk-stake{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:600}
.bk-stake input{width:110px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.bk-float{display:none}
@media (max-width:900px){.bk-layout{grid-template-columns:1fr}.bk-layout aside{position:static}
 .bk-float{display:block;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--amber);color:#1b1300;text-align:center;font-weight:700;padding:12px;border-radius:10px;text-decoration:none;z-index:5}}
@media (max-width:520px){.bk-row{grid-template-columns:minmax(0,1fr) 70px 62px 70px;gap:5px}.odd .ov{font-size:16px}.odd .ol{font-size:12px}}
footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;font-size:13px;color:var(--mute)}

/* forecast */
.fc-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(60px,40%) 48px;gap:10px;align-items:center;padding:5px 0}
.fc-row.fc-me .fc-name{font-weight:700}
.fc-rk{color:var(--mute);font-size:15px}.fc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}.fc-bar i{display:block;height:100%}
.fc-p{text-align:right;font-size:17px}
.fc-whatif{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.fc-whatif .psub{color:var(--fieldink);opacity:.75}.fc-big{font-size:28px;font-weight:700;color:#FFC94A}.fc-big .mute{color:var(--fieldink);opacity:.6;font-size:18px}

/* sportsbook sections, duels */
.bk-secs{margin:14px 0 4px}
.odd:disabled{cursor:default;opacity:.55}
.bk-duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bk-duel:last-child{border-bottom:0}
.bk-duel>div{display:flex;align-items:center;gap:10px;min-width:0}.bk-duel>div.r{justify-content:flex-end;text-align:right}
.bk-duel .odd{min-width:70px;min-height:42px;flex:none}
@media (max-width:520px){.bk-duel{grid-template-columns:1fr;gap:6px}.bk-duel>div.r{justify-content:flex-end;text-align:left;flex-direction:row-reverse}.bk-duel>.pos{display:none}}

.setup-wrap{margin-top:8px;font-size:14px}
.setup-wrap summary{cursor:pointer;opacity:.85;width:max-content}
.setup-wrap[open] summary{margin-bottom:4px}
.fc-board::after{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="lgName">War Room</h1>
      <span class="meta" id="lgMeta">Connecting to Sleeper…</span>
    </div>
    <details class="setup-wrap"><summary>Change league</summary>
    <form class="setup" id="setup" onsubmit="return false">
      <label>League ID <input id="inLeague" inputmode="numeric" autocomplete="off"></label>
      <label>Your Sleeper username <input id="inUser" autocomplete="off"></label>
      <button id="btnLoad" type="submit">Load league</button>
    </form></details>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="main"><div class="status">Loading your league from Sleeper…</div></main>
<footer id="foot"></footer>

<script>
/* js/config.js */
/* Edit these three values, commit, and GitHub Pages redeploys.
   Anyone can also open ?league=<id>&user=<sleeper username> to load a different league or view it as a different manager. */
const CONFIG={
  leagueId:'1314840770154364928',   // La Dinastía on Sleeper
  username:'antoniojzaratel',        // whose team is highlighted by default
  siteUrl:''                         // your GitHub Pages address, e.g. https://yourname.github.io/war-room/ (used by the claude.ai preview to link to the live site)
};

</script>
<script>
/* js/core.js */
/* War Room core: config, helpers, Sleeper loading, models. Every module reads the shared state S. */
/* ============ basics ============ */
const DEF_LEAGUE=CONFIG.leagueId, DEF_USER=CONFIG.username;
const API='https://api.sleeper.app';
const POS=['QB','RB','WR','TE','K','DEF'];
const ELIG={QB:['QB'],RB:['RB'],WR:['WR'],TE:['TE'],K:['K'],DEF:['DEF'],FLEX:['RB','WR','TE'],SUPER_FLEX:['QB','RB','WR','TE'],REC_FLEX:['WR','TE'],WRRB_FLEX:['RB','WR']};
const ORD=['QB','RB','WR','TE','K','DEF','REC_FLEX','WRRB_FLEX','FLEX','SUPER_FLEX'];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qs=new URLSearchParams(location.search);
const S={leagueId:qs.get('league')||store.get('wr_league')||DEF_LEAGUE,username:qs.get('user')||store.get('wr_user')||DEF_USER,
  tab:'live',lang:store.get('wr_lang')||'es',P:{},proj:{},ros:{},val:{},mu:{},tx:{},games:{},liveTeam:{},news:[],trend:[],sim:null,
  tc:{a:null,b:null,ga:new Set(),gb:new Set()},lineupTeam:null,lineupMode:'week',wvPos:'ALL',gzWeek:null,suggest:null,aiPaper:{}};
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=x=>(Math.round((x||0)*10)/10).toFixed(1);
const f0=x=>Math.round(x||0).toLocaleString('en-US');
const pc=x=>{x=x||0;return (x>0&&x<.01)?'<1%':(x>.99&&x<1)?'>99%':Math.round(x*100)+'%'};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' on '+u);return r.json()}
async function tj(u){try{return await j(u)}catch(e){return null}}

/* IndexedDB cache for the big Sleeper players file (Sleeper asks for at most one pull per day) */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('warroom',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}

/* ============ loading ============ */
async function loadPlayers(){
  const c=await idbGet('players');if(c&&Date.now()-c.t<864e5)return c.d;
  const d=await j(API+'/v1/players/nfl');const s={};
  for(const id in d){const p=d[id];if(!p||!POS.includes(p.position))continue;
    s[id]={n:p.position==='DEF'?`${p.first_name} ${p.last_name}`:(p.full_name||`${p.first_name||''} ${p.last_name||''}`.trim()),

function modelValue(id){

    if(c){used.add(c.id);lineup.push({slot:s,...c});total+=c.pts}else lineup.push({slot:s,id:null,pos:null,pts:0})}

  if(g.state==='pre')return 1;if(g.state==='post')return 0;const per=g.period||1,clk=g.clock||0;if(per>4)return .02;return Math.max(.02,((4-per)*900+clk)/3600)}

  T.forEach(t=>{t.apW=0;t.apG=0;t.hist=[]});

function simulate(N,force){

      if(force&&w===S.week&&(T[a].rid===force.rid||T[b].rid===force.rid)){const fa=T[a].rid===force.rid;if((sa>sb)!==(fa===force.win)){const x=sa;sa=sb;sb=x}}

    const order=T.map((_,i)=>i).sort((x,y)=>W[y]-W[x]||PF[y]-PF[x]);
    T.forEach((_,i)=>{res[i].wins+=W[i];res[i].w2+=W[i]*W[i]});res[order[0]].one++;

      while(al.length>1){al.sort((x,y)=>tb.indexOf(x)-tb.indexOf(y));const nx=[];for(let k=0;k<al.length/2;k++)nx.push(lose(al[k],al[al.length-1-k]));al=nx}

}

<script>
/* js/modules/lineup.js */
/* Lineup: optimal lineup vs current starters */
function currentVsOptimal(t,fn){
  const cur=S.slots.map((s,i)=>({slot:s,id:t.starters[i]&&t.starters[i]!=='0'?t.starters[i]:null}));
  const fixed=new Set();const out=cur.map(c=>({slot:c.slot,id:null}));
  cur.forEach((c,i)=>{if(c.id&&isLocked(c.id)){out[i].id=c.id;out[i].locked=true;fixed.add(c.id)}});
  const pool=startable(t).filter(id=>!fixed.has(id)&&!isLocked(id)).map(id=>({id,pos:S.P[id].pos,pts:fn(id)})).sort((a,b)=>b.pts-a.pts);
  const used=new Set();
  const order=out.map((o,i)=>i).filter(i=>!out[i].id).sort((a,b)=>ORD.indexOf(out[a].slot)-ORD.indexOf(out[b].slot));
  for(const i of order){const c=pool.find(p=>!used.has(p.id)&&ELIG[out[i].slot].includes(p.pos));if(c){used.add(c.id);out[i].id=c.id}}
  const tot=a=>a.reduce((s,x)=>s+(x.id?fn(x.id):0),0);
  return{cur,opt:out,curT:tot(cur),optT:tot(out)};
}
function rLineup(){

  const bench=startable(t).filter(id=>!optSet.has(id)).sort((a,b)=>fn(b)-fn(a));

  <div class="panel" style="margin-bottom:16px">${gain>.05?`<div class="verdict up">+${f1(gain)} points available</div><p style="margin:6px 0 0">${ins.map((id,i)=>`Start <b>${h(S.P[id].n)}</b> (${f1(fn(id))})${outs[i]?` over <b>${h(S.P[outs[i]].n)}</b> (${f1(fn(outs[i]))})`:''}`).join('. ')}.</p>`:
    `<div class="verdict">This lineup is already optimal</div><p class="mute" style="margin:6px 0 0">Projected ${f1(r.curT)} points.</p>`}</div>
  <div class="grid2">
   <div class="panel"><h3 style="margin-top:0">Current starters, ${f1(r.curT)}</h3>${luTable(r.cur,fn)}</div>

  <h3>Bench</h3><div class="panel scroll"><table><thead><tr><th>Player</th><th class="r">Proj</th><th class="r">Next 4 avg</th><th class="r">Value</th></tr></thead><tbody>
  ${bench.map(id=>`<tr><td>${pcell(id)}</td><td class="r num">${f1(wk(id))}</td><td class="r num">${f1(ros(id))}</td><td class="r num">${f0(S.val[id])}</td></tr>`).join('')}</tbody></table></div>`;
}

function oppOfWeek(w,rid){const p=pairsOf(S.mu[w]).find(x=>x.some(m=>m.roster_id===rid));return p?p.find(m=>m.roster_id!==rid).roster_id:null}

<script>
/* js/modules/trades.js */
/* Trades: calculator and win-win trade suggestions */
function teamAssets(t){
  const pl=t.players.map(id=>({k:'p:'+id,label:S.P[id].n,sub:`${S.P[id].pos} ${S.P[id].team||'FA'}`,v:S.val[id]||0}));
  const pk=S.picks.filter(p=>p.owner===t.rid).map(p=>({k:p.key,label:pickLabel(p),sub:'Pick',v:pickValue(p)}));
  return pl.concat(pk).sort((a,b)=>b.v-a.v);
}
function lineupAfter(t,give,get){const L=t.players.filter(id=>!give.includes(id)).concat(get);return optimize(L.filter(id=>!t.reserve.has(id)&&!t.taxi.has(id)),ros).total}
function rTrade(){
  const A=S.byRid[S.tc.a],B=S.byRid[S.tc.b];
  const sel=(id,cur,other)=>`<select id="${id}">${S.teams.filter(t=>t.rid!==other).map(t=>`<option value="${t.rid}" ${t.rid===cur?'selected':''}>${h(t.name)}</option>`).join('')}</select>`;
  const list=(t,set,side)=>`<div class="assets">${teamAssets(t).map(a=>`<label><input type="checkbox" data-side="${side}" value="${a.k}" ${set.has(a.k)?'checked':''}><span><span class="pname">${h(a.label)}</span> <span class="psub">${h(a.sub)}</span></span><span class="v">${f0(a.v)}</span></label>`).join('')}</div>`;
  const ga=[...S.tc.ga],gb=[...S.tc.gb];const va=ga.map(assetVal),vb=gb.map(assetVal);
  const sa=va.reduce((a,b)=>a+b,0),sb=vb.reduce((a,b)=>a+b,0);
  const adj=vs=>vs.reduce((s,v)=>s+Math.pow(v,1.15),0);const aa=adj(va),ab=adj(vb);
  const share=aa+ab?aa/(aa+ab):.5; // share of value that A sends
  const pa=ga.filter(k=>k.startsWith('p:')).map(k=>k.slice(2)),pb=gb.filter(k=>k.startsWith('p:')).map(k=>k.slice(2));
  const dA=lineupAfter(A,pa,pb)-A.rosMean,dB=lineupAfter(B,pb,pa)-B.rosMean;
  let verdict='Pick assets on both sides';
  if(ga.length&&gb.length){const d=Math.abs(share-.5);verdict=d<.05?'Fair trade':share>.5?`${B.name} wins this trade`:`${A.name} wins this trade`;if(d>=.05&&d<.12)verdict=verdict.replace('wins','slightly wins');}
  let fix='';if(ga.length&&gb.length&&Math.abs(share-.5)>=.05){const gap=Math.abs(sa-sb);const payer=share>.5?B:A;const set=share>.5?S.tc.gb:S.tc.ga;
    const c=teamAssets(payer).filter(a=>!set.has(a.k)&&a.v>0).sort((x,y)=>Math.abs(x.v-gap)-Math.abs(y.v-gap))[0];
    if(c)fix=`<p style="margin:8px 0 0">To even it out, ${h(payer.name)} could add <b>${h(c.label)}</b> (${f0(c.v)}).</p>`}
  let html=`<h2 id="tcTop">Trade calculator</h2><p class="lede">Value is ${h(S.valueSource)} with a consolidation premium, so one star is worth more than two pieces that add up to the same number. Lineup impact shows how each team's best weekly lineup changes over the next four weeks.</p>
  <div class="tl">
    <div class="panel"><div class="row">${sel('tcA',A.rid,B.rid)}<span class="mute">sends</span></div>${list(A,S.tc.ga,'a')}</div>
    <div class="panel"><div class="row">${sel('tcB',B.rid,A.rid)}<span class="mute">sends</span></div>${list(B,S.tc.gb,'b')}</div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="verdict">${h(verdict)}</div>
   <div class="split" aria-hidden="true"><i style="width:${share*100}%"></i><i style="width:${(1-share)*100}%"></i></div>
   <div class="row" style="justify-content:space-between;margin:0"><span>${h(A.name)} sends <b class="num">${f0(sa)}</b></span><span>${h(B.name)} sends <b class="num">${f0(sb)}</b></span></div>
   <div class="row" style="justify-content:space-between;margin:6px 0 0"><span>Lineup impact <b class="num ${dA>=0?'up':'down'}">${dA>=0?'+':''}${f1(dA)}</b> per week</span><span>Lineup impact <b class="num ${dB>=0?'up':'down'}">${dB>=0?'+':''}${f1(dB)}</b> per week</span></div>${fix}
  </div>`;
  html+=`<h2>Trade ideas for ${h(S.byRid[S.meRid].name)}</h2><p class="lede">Every one-for-one and two-for-one deal with every team was tested. These are the ones where your weekly lineup gets better, the value is close to fair, and the other manager doesn't lose starting production, so they have a reason to accept.</p>`;
  if(!S.suggest)html+='<div class="status">Testing trades across the league…</div>';
  else if(!S.suggest.length)html+='<div class="panel">No win-win deals found right now. Your lineup is tough to upgrade without overpaying.</div>';
  else html+=`<div class="panel scroll"><table><thead><tr><th>Partner</th><th>You give</th><th>You get</th><th class="r">Your lineup</th><th class="r">Their lineup</th><th class="r">Value</th><th></th></tr></thead><tbody>
    ${S.suggest.map((s,i)=>`<tr><td>${h(S.byRid[s.rid].name)}</td><td>${s.give.map(id=>h(S.P[id].n)).join(' + ')}</td><td>${s.get.map(id=>h(S.P[id].n)).join(' + ')}</td>
    <td class="r num up">+${f1(s.gain)}</td><td class="r num ${s.their>=0?'up':'down'}">${s.their>=0?'+':''}${f1(s.their)}</td><td class="r num ${s.dv>=0?'up':'down'}">${s.dv>=0?'+':''}${f0(s.dv)}</td>
    <td><button class="btn ghost" data-load="${i}">Open in calculator</button></td></tr>`).join('')}</tbody></table></div>`;
  return html;
}
function suggestTrades(){
  const me=S.byRid[S.meRid];const res=[];const mine=me.players.filter(id=>(S.val[id]||0)>250&&!me.taxi.has(id));
  const V=id=>S.val[id]||0;
  for(const t of S.teams){if(t.rid===me.rid)continue;const theirs=t.players.filter(id=>V(id)>250);
    const ev=(give,get)=>{const g=lineupAfter(me,give,get)-me.rosMean;if(g<.6)return;const th=lineupAfter(t,get,give)-t.rosMean;if(th<-1.2)return;
      const dv=get.reduce((s,x)=>s+V(x),0)-give.reduce((s,x)=>s+V(x),0);
      res.push({rid:t.rid,give,get,gain:g,their:th,dv,score:g+.4*Math.max(0,th)+(S.isDynasty?dv/900:0)})};
    for(const b of theirs){const vb=V(b);
      for(const a of mine){const va=V(a);if(Math.abs(va-vb)/Math.max(va,vb)<=.15)ev([a],[b])}
      for(let i=0;i<mine.length;i++)for(let k=i+1;k<mine.length;k++){const x=V(mine[i]),y=V(mine[k]);if(Math.max(x,y)>=vb)continue;const s=x+y;if(s>=vb*.95&&s<=vb*1.35)ev([mine[i],mine[k]],[b])}}}
  res.sort((a,b)=>b.score-a.score);const seen=new Set(),out=[];
  for(const r of res){const k=r.get.join()+'|'+r.rid;if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=12)break}
  return out;
}

document.addEventListener('change',e=>{
  if(e.target.id==='tcA'||e.target.id==='tcB'){S.tc[e.target.id==='tcA'?'a':'b']=Number(e.target.value);S.tc.ga.clear();S.tc.gb.clear();render()}
  if(e.target.dataset.side){const set=e.target.dataset.side==='a'?S.tc.ga:S.tc.gb;e.target.checked?set.add(e.target.value):set.delete(e.target.value);const y=window.scrollY;render();window.scrollTo(0,y)}});

<script>
/* js/modules/waivers.js */
/* Waivers: free agents, trending adds, drop candidates */
function rWire(){
  const rostered=new Set();S.teams.forEach(t=>t.players.forEach(id=>rostered.add(id)));
  const used=new Set(S.slots.flatMap(s=>ELIG[s]));const trend={};S.trend.forEach(x=>trend[x.player_id]=x.count);
  let fa=Object.keys(S.P).filter(id=>{const p=S.P[id];return p.team&&p.active&&used.has(p.pos)&&!rostered.has(id)&&(ros(id)>0||trend[id])});
  if(S.wvPos!=='ALL')fa=fa.filter(id=>S.P[id].pos===S.wvPos);
  fa.sort((a,b)=>ros(b)-ros(a));fa=fa.slice(0,30);
  const me=S.byRid[S.meRid];const lu=optimize(startable(me),ros);
  const worst={};lu.lineup.forEach(x=>{if(!x.id)return;const p=x.pos;if(worst[p]==null||x.pts<worst[p])worst[p]=x.pts});
  const drops=me.players.filter(id=>!lu.lineup.some(x=>x.id===id)).sort((a,b)=>(S.val[a]||0)-(S.val[b]||0)).slice(0,5);
  const chips=['ALL',...POS.filter(p=>used.has(p))].map(p=>`<button class="chip" data-wp="${p}" aria-pressed="${S.wvPos===p}">${p==='ALL'?'All':p}</button>`).join('');
  return `<h2>Waiver wire</h2><p class="lede">Unrostered players in your league ranked by projected points over the next four weeks. The trend column is how many Sleeper leagues added them in the last 48 hours.</p>
  <div class="row chips">${chips}</div>
  <div class="panel scroll"><table><thead><tr><th>Player</th><th class="r">This week</th><th class="r">Next 4 avg</th><th class="r">Adds, 48h</th><th class="r">Value</th><th>For you</th></tr></thead><tbody>
  ${fa.map(id=>{const p=S.P[id],up=worst[p.pos]!=null&&ros(id)>worst[p.pos];return `<tr><td>${pcell(id)}</td><td class="r num">${f1(wk(id))}</td><td class="r num">${f1(ros(id))}</td><td class="r num">${trend[id]?f0(trend[id]):''}</td><td class="r num">${f0(S.val[id])}</td><td>${up?`<span class="tag good">Beats your ${p.pos} starter</span>`:''}</td></tr>`}).join('')}
  </tbody></table></div>
  <h3>Your drop candidates</h3><div class="panel scroll"><table><tbody>${drops.map(id=>`<tr><td>${pcell(id)}</td><td class="r num">${f1(ros(id))} per week</td><td class="r num">${f0(S.val[id])} value</td></tr>`).join('')}</tbody></table></div>`;
}

<script>
/* js/modules/sportsbook.js */
/* Sportsbook: play-money betting on the league.
   Every price comes from the same projections and simulations as the rest of War Room, with a 5% house edge.
   Bets are stored on the device (localStorage) and settle automatically from real Sleeper results. */
const VIG=0.05,START_BANK=1000;
const B={slip:[],mode:'parlay',stake:50,fmt:store.get('wr_oddsfmt')||'us',msg:'',sec:'games',ppos:'ALL',pmu:'all'};
const bkKey=()=>`wr_book_${S.leagueId}_${S.username.toLowerCase()}`;
function bkLoad(){try{const d=JSON.parse(store.get(bkKey())||'null');if(d&&Array.isArray(d.bets))return d}catch(e){}return{bank:START_BANK,bets:[]}}
function bkSave(d){store.set(bkKey(),JSON.stringify(d))}
const priced=p=>{p=Math.min(.985,Math.max(.015,p));const d=1/Math.min(.995,p*(1+VIG));return Math.max(1.01,Math.round(d*100)/100)};
function oddsTxt(d){if(B.fmt==='dec')return d.toFixed(2);const a=d>=2?Math.round((d-1)*100/5)*5:-Math.round(100/(d-1)/5)*5;return a>0?'+'+a:String(a)}
const halfLine=x=>Math.round(x-.5)+.5;
const sgn=x=>x>0?'+'+x:String(x);
const tn=r=>S.byRid[r]?S.byRid[r].name:'?';
const pn=id=>S.P[id]?S.P[id].n:'Unknown player';
function oppOf(w,rid){const p=pairsOf(S.mu[w]).find(x=>x.some(m=>m.roster_id===rid));return p?p.find(m=>m.roster_id!==rid).roster_id:rid}
const mkOf=(w,rid)=>Math.min(rid,oppOf(w,rid));

/* ---------- when things are over ---------- */
function weekDone(w){if(w<S.week)return (S.mu[w]||[]).some(m=>m.points>0);if(w>S.week)return false;
  const g=Object.values(S.games);return g.length>0&&g.every(x=>x.state==='post')&&(S.mu[w]||[]).some(m=>m.points>0)}
function bookWeek(){let w=S.week;if(weekDone(w))w++;return w<=S.regEnd+3&&pairsOf(S.mu[w]).length?w:null}
const gameOver=id=>{const g=S.games[(S.P[id]||{}).team];return !!g&&g.state==='post'};

/* ---------- distributions ---------- */
function weekStarters(w,rid){
  if(w===S.week){const m=(S.mu[w]||[]).find(x=>x.roster_id===rid);const st=m&&(m.starters||[]).filter(id=>id&&id!=='0'&&S.P[id]);if(st&&st.length)return st}
  const pr=S.proj[w]||{};return optimize(startable(S.byRid[rid]),id=>pr[id]||0).lineup.map(x=>x.id).filter(Boolean);
}
function playerDist(w,id,rid){
  if(w===S.week){const m=(S.mu[w]||[]).find(x=>x.roster_id===rid);const lp=livePlayer(id,((m&&m.players_points)||{})[id]||0);return{mean:lp.mean,sd:Math.max(.3,lp.sd*1.1),full:lp.full,actual:lp.actual}}
  const mean=(S.proj[w]||{})[id]||0;return{mean,sd:Math.max(3,mean*.5),full:mean,actual:0};
}
function teamDist(rid,w){
  if(w===S.week&&S.liveTeam[rid]&&S.liveTeam[rid].mean>0)return S.liveTeam[rid];
  const pr=S.proj[w]||{};const mean=optimize(startable(S.byRid[rid]),id=>pr[id]||0).total||S.byRid[rid].rosMean;
  return{mean,sd:Math.max(16,mean*.17),actual:0};
}

/* ---------- markets ---------- */
function buildMarkets(){
  const w=bookWeek();const M={w,games:[],hi:[],lo:[],tt:[],blow:[],ptop:[],props:[],duels:[],fut:{}};
  if(w){
    const pairs=pairsOf(S.mu[w]);
    const dists={};pairs.flat().forEach(m=>dists[m.roster_id]=teamDist(m.roster_id,w));
    for(const [a,b] of pairs){const A=dists[a.roster_id],Bd=dists[b.roster_id],mk=Math.min(a.roster_id,b.roster_id);
      const dm=A.mean-Bd.mean,sd=Math.sqrt(A.sd**2+Bd.sd**2),pA=Phi(dm/sd);
      const lineA=-halfLine(Math.abs(dm))*Math.sign(dm||1),pCover=1-Phi((-lineA-dm)/sd);
      const T=A.mean+Bd.mean,tl=halfLine(T),pOver=1-Phi((tl-T)/sd);
      const stA=weekStarters(w,a.roster_id),stB=weekStarters(w,b.roster_id);
      const lock=w===S.week&&stA.concat(stB).every(gameOver);
      M.games.push({mk,lock,a:a.roster_id,b:b.roster_id,A,B:Bd,
        ml:[{t:'ml',w,rid:a.roster_id,d:priced(pA)},{t:'ml',w,rid:b.roster_id,d:priced(1-pA)}],
        sp:[{t:'sp',w,rid:a.roster_id,opp:b.roster_id,line:lineA,d:priced(pCover)},{t:'sp',w,rid:b.roster_id,opp:a.roster_id,line:-lineA,d:priced(1-pCover)}],
        tot:[{t:'tot',w,a:a.roster_id,b:b.roster_id,line:tl,side:'o',d:priced(pOver)},{t:'tot',w,a:a.roster_id,b:b.roster_id,line:tl,side:'u',d:priced(1-pOver)}]});
      for(const [rid,D] of [[a.roster_id,A],[b.roster_id,Bd]]){const l=halfLine(D.mean),po=1-Phi((l-D.mean)/D.sd);
        M.tt.push({rid,mk,lock,mean:D.mean,o:{t:'tt',w,rid,side:'o',line:l,d:priced(po)},u:{t:'tt',w,rid,side:'u',line:l,d:priced(1-po)}})}
      // player over/unders and same-slot duels
      const side=(st,rid)=>st.map(id=>({id,rid,pos:S.P[id].pos,...playerDist(w,id,rid)}));
      const PA=side(stA,a.roster_id),PB=side(stB,b.roster_id);
      for(const p of PA.concat(PB)){if(p.full<1.5&&!p.actual)continue;const done=w===S.week&&gameOver(p.id);
        const l=Math.max(.5,halfLine(p.mean)),po=1-Phi((l-p.mean)/p.sd);
        M.props.push({...p,mk,lock:done,o:{t:'pou',w,pid:p.id,rid:p.rid,side:'o',line:l,d:priced(po)},u:{t:'pou',w,pid:p.id,rid:p.rid,side:'u',line:l,d:priced(1-po)}})}
      const used=new Set();
      for(const x of PA){const y=PB.find(q=>q.pos===x.pos&&!used.has(q.id));if(!y||x.full<1.5||y.full<1.5)continue;used.add(y.id);
        const px=Phi((x.mean-y.mean)/Math.sqrt(x.sd**2+y.sd**2)),done=w===S.week&&gameOver(x.id)&&gameOver(y.id);
        M.duels.push({mk,lock:done,x,y,dx:{t:'pdu',w,pid:x.id,opp:y.id,rid:x.rid,d:priced(px)},dy:{t:'pdu',w,pid:y.id,opp:x.id,rid:y.rid,d:priced(1-px)}})}
    }
    // specials by simulation: top and lowest team, biggest blowout, top scoring player
    const rids=Object.keys(dists).map(Number),N=6000,hi={},lo={},bl={};rids.forEach(r=>{hi[r]=0;lo[r]=0});
    const mks=M.games.map(g=>g.mk);mks.forEach(k=>bl[k]=0);
    const pl=M.props.filter(p=>p.full>=4||p.actual>=4),top={};pl.forEach(p=>top[p.id]=0);
    for(let n=0;n<N;n++){const v={};let bi=0,li=0,bv=-1e9,lv=1e9;
      for(const r of rids){const d=dists[r];const x=d.mean+d.sd*gauss();v[r]=x;if(x>bv){bv=x;bi=r}if(x<lv){lv=x;li=r}}
      hi[bi]++;lo[li]++;let bm=-1,bk=null;for(const g of M.games){const m=Math.abs(v[g.a]-v[g.b]);if(m>bm){bm=m;bk=g.mk}}bl[bk]++;
      let tp=null,tv=-1e9;for(const p of pl){const x=p.mean+p.sd*gauss();if(x>tv){tv=x;tp=p.id}}if(tp)top[tp]++}
    M.hi=rids.map(r=>({t:'hi',w,rid:r,d:priced(hi[r]/N)})).sort((x,y)=>x.d-y.d);
    M.lo=rids.map(r=>({t:'lo',w,rid:r,d:priced(lo[r]/N)})).sort((x,y)=>x.d-y.d);
    M.blow=M.games.map(g=>({t:'blow',w,a:g.a,b:g.b,mk:g.mk,d:priced(bl[g.mk]/N)})).sort((x,y)=>x.d-y.d);
    M.ptop=pl.map(p=>({t:'ptop',w,pid:p.id,rid:p.rid,d:priced(top[p.id]/N)})).sort((x,y)=>x.d-y.d).slice(0,15);
  }
  const sim=S.sim||{},regOver=S.week>S.regEnd;
  const fut=(t,k)=>S.teams.map(x=>({t,rid:x.rid,d:priced((sim[x.rid]||{})[k]||0)})).sort((x,y)=>x.d-y.d);
  M.fut={champ:fut('champ','champ'),toilet:fut('toilet','toilet'),seed1:regOver?[]:fut('seed1','one'),last:regOver?[]:fut('last','last'),
    po:regOver?[]:S.teams.map(x=>{const p=(sim[x.rid]||{}).po||0;return{rid:x.rid,yes:{t:'po',rid:x.rid,yes:true,d:priced(p)},no:{t:'po',rid:x.rid,yes:false,d:priced(1-p)}}}),
    wins:regOver?[]:S.teams.map(x=>{const s=sim[x.rid]||{},l=halfLine(s.wins||0),sd=Math.max(.35,s.winsSd||.8),po=1-Phi((l-s.wins)/sd);
      return{rid:x.rid,line:l,o:{t:'wins',rid:x.rid,side:'o',line:l,d:priced(po)},u:{t:'wins',rid:x.rid,side:'u',line:l,d:priced(1-po)}}}).sort((a,b)=>b.line-a.line)};
  return M;
}

function legLabel(l){switch(l.t){
  case'ml':return `${tn(l.rid)} to win, week ${l.w}`;
  case'sp':return `${tn(l.rid)} ${sgn(l.line)} vs ${tn(l.opp)}, week ${l.w}`;
  case'tot':return `${l.side==='o'?'Over':'Under'} ${l.line} total points, ${tn(l.a)} vs ${tn(l.b)}, week ${l.w}`;
  case'tt':return `${tn(l.rid)} ${l.side==='o'?'over':'under'} ${l.line} points, week ${l.w}`;
  case'pou':return `${pn(l.pid)} ${l.side==='o'?'over':'under'} ${l.line} fantasy points, week ${l.w}`;
  case'pdu':return `${pn(l.pid)} outscores ${pn(l.opp)}, week ${l.w}`;
  case'ptop':return `${pn(l.pid)} top-scoring starter in the league, week ${l.w}`;
  case'hi':return `${tn(l.rid)} top-scoring team of week ${l.w}`;
  case'lo':return `${tn(l.rid)} lowest-scoring team of week ${l.w}`;
  case'blow':return `${tn(l.a)} vs ${tn(l.b)} is the biggest blowout of week ${l.w}`;
  case'champ':return `${tn(l.rid)} wins the championship`;
  case'toilet':return `${tn(l.rid)} loses the toilet bowl`;
  case'seed1':return `${tn(l.rid)} finishes as the #1 seed`;
  case'last':return `${tn(l.rid)} finishes last in the regular season`;
  case'po':return `${tn(l.rid)} ${l.yes?'makes':'misses'} the playoffs`;
  case'wins':return `${tn(l.rid)} ${l.side==='o'?'over':'under'} ${l.line} regular-season wins`}}
const legKey=l=>[l.t,l.w,l.rid,l.pid,l.opp,l.a,l.side,l.line,l.yes].join('|');

/* parlay rules: no two legs on the same game line, the same player, the same special or the same team's future,
   and no player prop combined with a team bet from that player's matchup (they move together) */
function legTags(l){const w=l.w;switch(l.t){
  case'ml':case'sp':case'tt':return['m:'+w+':'+mkOf(w,l.rid)];
  case'tot':return['m:'+w+':'+Math.min(l.a,l.b)];
  case'pou':return['p:'+w+':'+l.pid,'pm:'+w+':'+mkOf(w,l.rid)];
  case'pdu':return['p:'+w+':'+l.pid,'p:'+w+':'+l.opp,'pm:'+w+':'+mkOf(w,l.rid)];
  case'hi':case'lo':case'blow':case'ptop':return['s:'+w+':'+l.t];
  default:return['f:'+l.t,'fr:'+l.rid]}}
function conflict(a,b){const A=legTags(a),Bt=legTags(b);
  for(const x of A)for(const y of Bt){if(x===y&&!x.startsWith('pm:'))return true;if(x.slice(1)===y.slice(2)&&x[0]==='m'&&y.startsWith('pm:'))return true;if(y.slice(1)===x.slice(2)&&y[0]==='m'&&x.startsWith('pm:'))return true}
  return false}
function slipOK(){for(let i=0;i<B.slip.length;i++)for(let k=i+1;k<B.slip.length;k++)if(conflict(B.slip[i],B.slip[k]))return false;return true}

/* ---------- settlement from real Sleeper data ---------- */
function weekPts(w){const t={},p={},st=[];(S.mu[w]||[]).forEach(m=>{t[m.roster_id]=m.points||0;Object.assign(p,m.players_points||{});(m.starters||[]).forEach(id=>{if(id&&id!=='0')st.push(id)})});return{t,p,st}}
function standingsFinal(){if(S.week<=S.regEnd||!weekDone(S.regEnd))return null;
  const rec={};S.teams.forEach(t=>rec[t.rid]={w:0,pf:0});
  for(let w=1;w<=S.regEnd;w++)pairsOf(S.mu[w]).forEach(([a,b])=>{rec[a.roster_id].pf+=a.points||0;rec[b.roster_id].pf+=b.points||0;if(a.points>b.points)rec[a.roster_id].w++;else if(b.points>a.points)rec[b.roster_id].w++;else{rec[a.roster_id].w+=.5;rec[b.roster_id].w+=.5}});
  return{order:S.teams.map(t=>t.rid).sort((x,y)=>rec[y].w-rec[x].w||rec[y].pf-rec[x].pf),rec}}
function settleLeg(l){
  const cmp=(x,y)=>x>y?'win':x<y?'loss':'push';
  if(l.w!=null){if(!weekDone(l.w))return null;const W=weekPts(l.w),pts=W.t;
    switch(l.t){case'ml':return cmp(pts[l.rid],pts[oppOf(l.w,l.rid)]);
      case'sp':return cmp(pts[l.rid]+l.line,pts[l.opp]);
      case'tot':{const T=pts[l.a]+pts[l.b];return l.side==='o'?cmp(T,l.line):cmp(l.line,T)}
      case'tt':return l.side==='o'?cmp(pts[l.rid],l.line):cmp(l.line,pts[l.rid]);
      case'pou':{const v=W.p[l.pid];if(v==null)return'push';return l.side==='o'?cmp(v,l.line):cmp(l.line,v)}
      case'pdu':{const x=W.p[l.pid],y=W.p[l.opp];if(x==null||y==null)return'push';return cmp(x,y)}
      case'ptop':{const mx=Math.max(...W.st.map(id=>W.p[id]||0));return W.st.includes(l.pid)&&(W.p[l.pid]||0)===mx?'win':'loss'}
      case'hi':case'lo':{const v=Object.values(pts),x=l.t==='hi'?Math.max(...v):Math.min(...v);return pts[l.rid]===x?'win':'loss'}
      case'blow':{let bk=null,bm=-1;pairsOf(S.mu[l.w]).forEach(([a,b])=>{const m=Math.abs((a.points||0)-(b.points||0));if(m>bm){bm=m;bk=Math.min(a.roster_id,b.roster_id)}});return bk===Math.min(l.a,l.b)?'win':'loss'}}}
  const F=standingsFinal(),st=F&&F.order;const nPO=Math.min(S.league.settings.playoff_teams||6,S.teams.length);
  switch(l.t){
    case'seed1':return st?(st[0]===l.rid?'win':'loss'):null;
    case'last':return st?(st[st.length-1]===l.rid?'win':'loss'):null;
    case'po':return st?((st.indexOf(l.rid)<nPO)===l.yes?'win':'loss'):null;
    case'wins':return F?(l.side==='o'?cmp(F.rec[l.rid].w,l.line):cmp(l.line,F.rec[l.rid].w)):null;
    case'champ':{const f=(S.wb||[]).find(m=>m.p===1&&m.w);return f?(f.w===l.rid?'win':'loss'):(st&&st.indexOf(l.rid)>=nPO?'loss':null)}
    case'toilet':{const f=(S.lb||[]).find(m=>m.p===1&&m.l);return f?(f.l===l.rid?'win':'loss'):(st&&st.indexOf(l.rid)<nPO?'loss':null)}}
  return null}
function settleBet(b){const r=b.legs.map(settleLeg);if(r.includes('loss'))return{st:'loss',pay:0,r};if(r.includes(null))return{st:'open',r};
  const d=b.legs.reduce((x,l,i)=>x*(r[i]==='push'?1:l.d),1);return{st:r.every(x=>x==='push')?'push':'win',pay:b.stake*d,r}}
function ledger(){const d=bkLoad();let bank=d.bank,won=0,lost=0,open=0,pl=0,staked=0;
  const rows=d.bets.map(b=>{const s=settleBet(b);staked+=b.stake;if(s.st==='open'){bank-=b.stake;open++}else{bank+=s.pay-b.stake;pl+=s.pay-b.stake;if(s.st==='win')won++;if(s.st==='loss')lost++}return{b,...s}});
  return{d,bank,won,lost,open,pl,staked,rows}}

/* ---------- view ---------- */
function oddBtn(l,label,lock){const on=B.slip.some(x=>legKey(x)===legKey(l));
  if(lock)return `<button class="odd" disabled><span class="ol">${label||''}</span><span class="ov">Final</span></button>`;
  return `<button class="odd" data-leg='${h(JSON.stringify(l))}' aria-pressed="${on}">${label?`<span class="ol">${label}</span>`:''}<span class="ov num">${oddsTxt(l.d)}</span></button>`}
const SECS=[['games','Matchups'],['props','Player props'],['specials','Specials'],['futures','Futures'],['mine','My bets']];
function rBook(){

function bkMine(M,LG){

function rSlip(bank){
  if(!B.slip.length)return `<div class="panel"><h3 style="margin-top:0">Bet slip</h3><p class="mute" style="margin:0">Tap any odds to add a pick. Add two or more for a parlay.</p>${B.msg?`<p class="up" style="margin:8px 0 0">${h(B.msg)}</p>`:''}</div>`;
  const multi=B.slip.length>1,ok=slipOK(),parlay=multi&&B.mode==='parlay';
  const pd=B.slip.reduce((x,l)=>x*l.d,1),stake=Math.max(0,Number(B.stake)||0);
  const total=parlay?stake:stake*B.slip.length,ret=parlay?stake*pd:B.slip.reduce((s,l)=>s+stake*l.d,0);
  const err=parlay&&!ok?'Some of these picks depend on each other (same game, same player, or a player and his own matchup), so they can’t share a parlay. Remove one or bet them as singles.':total>bank?'Not enough chips for that stake.':stake<=0?'Enter a stake.':'';
  return `<div class="panel"><h3 style="margin-top:0">Bet slip</h3>
   ${multi?`<div class="chips" style="margin-bottom:10px"><button class="chip" data-bm="parlay" aria-pressed="${B.mode==='parlay'}">Parlay</button><button class="chip" data-bm="single" aria-pressed="${B.mode==='single'}">Singles</button></div>`:''}
   ${B.slip.map((l,i)=>`<div class="bk-leg"><div>${h(legLabel(l))}<div class="num psub">${oddsTxt(l.d)}</div></div><button class="bk-x" data-rm="${i}" aria-label="Remove pick">×</button></div>`).join('')}
   ${parlay?`<div class="bk-leg"><b>${B.slip.length}-leg parlay</b><b class="num">${oddsTxt(pd)}</b></div>`:''}
   <label class="bk-stake">${parlay||!multi?'Stake':'Stake per bet'} <input id="bkStake" type="number" min="1" step="10" value="${h(B.stake)}" inputmode="numeric"></label>
   <div class="bk-leg" style="border:0"><span>Total stake</span><b class="num">${f0(total)}</b></div>
   <div class="bk-leg" style="border:0"><span>Potential return</span><b class="num up" id="bkRet">${f0(ret)}</b></div>
   <p class="down" id="bkErr" style="margin:4px 0 8px"${err?'':' hidden'}>${err}</p>
   <div class="row" style="margin:6px 0 0"><button class="btn" id="bkPlace" ${err?'disabled':''}>Place ${parlay||!multi?'bet':B.slip.length+' bets'}</button><button class="btn ghost" id="bkClear">Clear</button></div></div>`;
}
function bkRerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function refreshSlip(){const LG=ledger();const s=$('#slip');if(s){const f=document.activeElement&&document.activeElement.id==='bkStake';s.innerHTML=rSlip(LG.bank);if(f){const i=$('#bkStake');i.focus();const v=i.value;i.value='';i.value=v}}}
document.addEventListener('click',e=>{
  if(S.tab!=='book')return;
  const o=e.target.closest('[data-leg]');if(o){const l=JSON.parse(o.dataset.leg);const k=legKey(l);const i=B.slip.findIndex(x=>legKey(x)===k);
    if(i>=0)B.slip.splice(i,1);else B.slip.push(l);B.msg='';bkRerender();return}

    const bets=B.slip.length>1&&B.mode==='parlay'?[{id:t,stake,legs:B.slip}]:B.slip.map((l,i)=>({id:t+i,stake,legs:[l]}));
    d.bets.push(...bets.map(b=>({...b,placed:new Date().toISOString()})));bkSave(d);
    B.msg=bets.length>1?`${bets.length} bets placed.`:'Bet placed.';B.slip=[];bkRerender();return}
  if(e.target.id==='bkReset'){if(confirm('Clear all your bets and reset to '+START_BANK+' chips?')){bkSave({bank:START_BANK,bets:[]});bkRerender()}return}
  if(e.target.id==='bkShare'){const L=ledger();const fmt=r=>{const d=r.b.legs.reduce((x,l)=>x*l.d,1);const st={open:'OPEN',win:'WON',loss:'LOST',push:'PUSH'}[r.st];

    const m=$('#bkShareMsg');navigator.clipboard?navigator.clipboard.writeText(txt).then(()=>m.textContent='Copied',()=>m.textContent='Copy blocked here'):m.textContent='Copy blocked here'}

<script>

/* Gazette: El Pasquín, the weekly roast newspaper built from real results */
function weekFacts(w){
  const mu=S.mu[w];if(!mu||!mu.some(m=>m.points>0))return null;
  const T={};mu.forEach(m=>{const t=S.byRid[m.roster_id];if(!t)return;const pp=m.players_points||{};
    const st=(m.starters||[]).filter(id=>id&&id!=='0'&&S.P[id]);const pl=(m.players||[]).filter(id=>S.P[id]);
    const opt=optimize(pl,id=>pp[id]||0).total;const sorted=st.map(id=>({id,p:pp[id]||0})).sort((a,b)=>b.p-a.p);
    const benchStar=pl.filter(id=>!st.includes(id)).map(id=>({id,p:pp[id]||0})).sort((a,b)=>b.p-a.p)[0];
    T[m.roster_id]={t,pts:m.points||0,opt,bench:Math.max(0,opt-(m.points||0)),star:sorted[0],dud:sorted[sorted.length-1],benchStar}});
  const games=pairsOf(mu).map(([a,b])=>{const A=T[a.roster_id],B=T[b.roster_id];const W=A.pts>=B.pts?A:B,L=W===A?B:A;W.won=true;L.won=false;W.opp=L;L.opp=W;W.margin=L.margin=W.pts-L.pts;return{W,L,m:W.pts-L.pts}});
  // records through this week
  const rec={};S.teams.forEach(t=>rec[t.rid]={w:0,l:0});
  for(let x=1;x<=w;x++)pairsOf(S.mu[x]).forEach(([a,b])=>{if(!(a.points||b.points))return;const wn=a.points>=b.points?a:b,ls=wn===a?b:a;rec[wn.roster_id].w++;rec[ls.roster_id].l++});
  const all=Object.values(T);all.forEach(x=>{x.rec=rec[x.t.rid];x.beat=all.filter(o=>o!==x&&x.pts>o.pts).length});
  const byPts=[...all].sort((a,b)=>b.pts-a.pts);const med=(byPts[Math.floor(all.length/2)-1].pts+byPts[Math.floor(all.length/2)].pts)/2;
  const tx=S.tx[w]||[];const trades=tx.filter(x=>x.type==='trade');const adds={};tx.filter(x=>x.type!=='trade').forEach(x=>(x.roster_ids||[]).forEach(r=>adds[r]=(adds[r]||0)+Object.keys(x.adds||{}).length));
  const byG=[...games].sort((a,b)=>b.m-a.m);
  return{w,all,games,top:byPts[0],low:byPts[byPts.length-1],blow:byG[0],close:byG[byG.length-1],med,
    benchKing:[...all].sort((a,b)=>b.bench-a.bench)[0],lucky:[...all].filter(x=>x.won&&x.pts<med).sort((a,b)=>a.pts-b.pts)[0],
    unlucky:[...all].filter(x=>!x.won&&x.pts>med).sort((a,b)=>b.pts-a.pts)[0],trades,adds,
    grinder:Object.entries(adds).sort((a,b)=>b[1]-a[1])[0],standings:[...S.teams].map(t=>({t,...rec[t.rid]})).sort((a,b)=>b.w-a.w||a.l-b.l)};
}

const LINES={
 es:{

   loseClose:[x=>`Cayó por ${f1(x.margin)} contra ${x.opp.t.name}. Tan cerca y tan lejos.`,x=>`Perdió por ${f1(x.margin)}: cualquier suplente decente lo habría salvado.`],
   star:[x=>`${nm(x.star.id)} cargó con ${f1(x.star.p)} puntos.`,x=>`El MVP fue ${nm(x.star.id)} con ${f1(x.star.p)}.`],
   dud:[x=>`${nm(x.dud.id)} aportó ${f1(x.dud.p)}, lo cual ya es mucho decir.`,x=>`${nm(x.dud.id)} (${f1(x.dud.p)}) jugó como si le debieran la quincena.`],
   bench:x=>`Dejó ${f1(x.bench)} puntos en la banca.`,
   rec:x=>x.rec.l===0?`Va ${x.rec.w}-0, invicto y cada vez más insoportable.`:x.rec.w===0?`Va 0-${x.rec.l} y sigue buscando su primera W, como quien busca estacionamiento en San Pedro un sábado.`:`Récord de ${x.rec.w}-${x.rec.l}.`},
  s:{best:'El mejor de la semana',worst:'El sótano',blow:'Masacre',close:'Infarto',bench:'El director técnico',lucky:'Robo a mano armada',unlucky:'La injusticia',moves:'Mercado',caps:'Equipo por equipo',stand:'Tabla',week:'Semana',edition:'Edición'}},
 en:{
  head:[f=>`${f.top.t.name} drops ${f1(f.top.pts)} and the league asks for mercy`,f=>`Sunday massacre: ${f.top.t.name} posts ${f1(f.top.pts)} and nobody can stop it`,f=>`${f.top.t.name} dresses up for ${f1(f.top.pts)}; everyone else wears black`],
  deck:[f=>`Meanwhile ${f.low.t.name} put up ${f1(f.low.pts)} and emergency services have been notified. All that and more in the week ${f.w} edition.`,f=>`In the basement, ${f.low.t.name} (${f1(f.low.pts)}) keeps proving that owning a roster is not the same as having a team.`],
  low:[f=>`With ${f1(f.low.pts)} points, ${f.low.t.name} remains the weekly relief of every opponent. Sources confirm the roster has been on strike since August.`,f=>`${f.low.t.name} finished with ${f1(f.low.pts)}. Even a replay review couldn't find more points.`],
  blow:f=>`${f.blow.W.t.name} ran over ${f.blow.L.t.name}, ${f1(f.blow.W.pts)} to ${f1(f.blow.L.pts)}. A ${f1(f.blow.m)}-point gap that has been reported to the authorities.`,
  close:f=>`${f.close.W.t.name} beat ${f.close.L.t.name} by just ${f1(f.close.m)}. League cardiologists remain on call.`,
  bench:f=>`${f.benchKing.t.name} left ${f1(f.benchKing.bench)} points rotting on the bench${f.benchKing.benchStar?`, including ${f1(f.benchKing.benchStar.p)} from ${nm(f.benchKing.benchStar.id)}`:''}. Head coach wanted; apply with the commissioner.`,
  lucky:f=>`${f.lucky.t.name} won with a measly ${f1(f.lucky.pts)}. Not even he believes it, but the W counts.`,
  unlucky:f=>`${f.unlucky.t.name} scored ${f1(f.unlucky.pts)}, more than ${f.unlucky.beat} teams, and still lost. Fantasy isn't fair, and nobody said it would be.`,
  trade:(a,b)=>`Deal on the table: ${a} and ${b} made a trade. December will tell us who cries.`,
  grind:(t,n)=>`${t} made ${n} waiver moves. Hyperactivity or panic, you decide.`,
  cap:{
   winBig:[x=>`Comfortable beatdown of ${x.opp.t.name} by ${f1(x.margin)}.`,x=>`Gave ${x.opp.t.name} a free lesson, winning by ${f1(x.margin)}.`],
   winClose:[x=>`Survived ${x.opp.t.name} by ${f1(x.margin)}, more luck than skill.`,x=>`Edged ${x.opp.t.name} by a hair: ${f1(x.margin)} points.`],
   loseBig:[x=>`${x.opp.t.name} knocked them flat by ${f1(x.margin)}.`,x=>`Lost by ${f1(x.margin)} to ${x.opp.t.name}. Pickup games have been closer.`],
   loseClose:[x=>`Fell by ${f1(x.margin)} to ${x.opp.t.name}. So close, so far.`,x=>`Lost by ${f1(x.margin)}: any decent backup would have saved it.`],
   star:[x=>`${nm(x.star.id)} carried with ${f1(x.star.p)}.`,x=>`MVP: ${nm(x.star.id)}, ${f1(x.star.p)}.`],
   dud:[x=>`${nm(x.dud.id)} chipped in ${f1(x.dud.p)}, which is generous.`,x=>`${nm(x.dud.id)} (${f1(x.dud.p)}) played like he's owed back pay.`],
   bench:x=>`Left ${f1(x.bench)} points on the bench.`,
   rec:x=>x.rec.l===0?`Now ${x.rec.w}-0, unbeaten and increasingly unbearable.`:x.rec.w===0?`Now 0-${x.rec.l} and still hunting the first W.`:`Record: ${x.rec.w}-${x.rec.l}.`},
  s:{best:'Team of the week',worst:'The basement',blow:'Massacre',close:'Heart attack',bench:'The head coach',lucky:'Daylight robbery',unlucky:'The injustice',moves:'Market',caps:'Team by team',stand:'Standings',week:'Week',edition:'Edition'}}};
function writePaper(f,lang){
  const L=LINES[lang],r=rng(Number(S.leagueId.slice(-6))+f.w*97+(lang==='es'?1:2)),pick=a=>a[Math.floor(r()*a.length)];
  const stories=[{h:L.s.worst,b:pick(L.low)(f)},{h:L.s.blow,b:L.blow(f)},{h:L.s.close,b:L.close(f)}];
  if(f.benchKing&&f.benchKing.bench>8)stories.push({h:L.s.bench,b:L.bench(f)});
  if(f.lucky)stories.push({h:L.s.lucky,b:L.lucky(f)});
  if(f.unlucky)stories.push({h:L.s.unlucky,b:L.unlucky(f)});
  const mv=f.trades.map(tr=>L.trade(...(tr.roster_ids||[]).slice(0,2).map(id=>S.byRid[id]?S.byRid[id].name:'?')));
  if(f.grinder&&f.grinder[1]>=3)mv.push(L.grind(S.byRid[f.grinder[0]].name,f.grinder[1]));
  if(mv.length)stories.push({h:L.s.moves,b:mv.join(' ')});
  const caps=[...f.all].sort((a,b)=>b.pts-a.pts).map(x=>{const big=x.margin>25;const res=pick(L.cap[x.won?(big?'winBig':'winClose'):(big?'loseBig':'loseClose')])(x);
    const parts=[res];if(x.star)parts.push(pick(L.cap.star)(x));if(x.dud&&x.dud.p<6)parts.push(pick(L.cap.dud)(x));if(x.bench>12)parts.push(L.cap.bench(x));parts.push(L.cap.rec(x));
    return{name:x.t.name,handle:x.t.handle,pts:x.pts,body:parts.join(' ')}});
  return{headline:pick(L.head)(f),deck:pick(L.deck)(f),stories,caps};
}
function rPaper(){
  const weeks=range(1,S.week).filter(w=>(S.mu[w]||[]).some(m=>m.points>0));
  if(!weeks.length)return `<h2>Gazette</h2><p class="lede">The first edition prints once week 1 has points on the board.</p>`;
  if(!S.gzWeek||!weeks.includes(S.gzWeek))S.gzWeek=weeks.filter(w=>w<S.week).pop()||weeks[weeks.length-1];
  const f=weekFacts(S.gzWeek);const lang=S.lang;const live=S.gzWeek===S.week;
  const P=S.aiPaper[S.gzWeek+lang]||writePaper(f,lang);const L=LINES[lang].s;
  const ctrl=`<div class="row"><select id="gzWeek" aria-label="Week">${weeks.map(w=>`<option value="${w}" ${w===S.gzWeek?'selected':''}>${L.week} ${w}${w===S.week?' (live)':''}</option>`).join('')}</select>
   <div class="chips"><button class="chip" data-lang="es" aria-pressed="${lang==='es'}">Español</button><button class="chip" data-lang="en" aria-pressed="${lang==='en'}">English</button></div>
   <button class="btn ghost" id="btnCopy">Copy for the group chat</button><button class="btn" id="btnAI" hidden>Have Claude write a sharper edition</button><span id="aiMsg" class="mute"></span></div>`;
  return `<h2>The weekly roast</h2><p class="lede">Every storyline comes from real results: scores, margins, bench points left behind, lucky wins, trades and waiver moves.</p>${ctrl}
  <article class="paper" id="paperBody">
    <header class="mast"><div class="name">El Pasquín</div><div class="sub">${h(S.league.name)}, ${L.week.toLowerCase()} ${f.w} de ${S.season}${live?` <span class="stamp">${lang==='es'?'En vivo':'Live'}</span>`:''}</div></header>
    <h3 class="lead">${h(P.headline)}</h3><p class="deck">${h(P.deck)}</p>
    <div class="cols">${P.stories.map(s=>`<div class="story"><h4>${h(s.h)}</h4><p>${h(s.b)}</p></div>`).join('')}</div>
    <section class="caps"><h4 style="font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;margin:0">${L.caps}</h4>
    <div class="cols">${P.caps.map(c=>`<div class="story"><h5>${h(c.name)}</h5><div class="rec">@${h(c.handle||'')}${c.pts!=null?', '+f1(c.pts):''}</div><p>${h(c.body)}</p></div>`).join('')}</div></section>
    <section class="caps"><h4 style="font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;margin:0 0 6px">${L.stand}</h4><div class="scroll"><table><tbody>
    ${f.standings.map((s,i)=>`<tr><td>${i+1}</td><td>${h(s.t.name)}</td><td class="r">${s.w}-${s.l}</td></tr>`).join('')}</tbody></table></div></section>
  </article>`;
}
/* Claude-written edition: only lights up inside claude.ai where the sample capability exists */
let samplePromise=null;
function getSample(){if(!samplePromise)samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);return samplePromise}
async function aiEdition(){
  const s=await getSample();if(!s)return;const f=weekFacts(S.gzWeek);const lang=S.lang;const btn=$('#btnAI'),msg=$('#aiMsg');btn.disabled=true;msg.textContent='Writing…';
  const facts={league:S.league.name,week:f.w,results:f.games.map(g=>({winner:g.W.t.name,winner_pts:g.W.pts,loser:g.L.t.name,loser_pts:g.L.pts})),
    teams:f.all.map(x=>({team:x.t.name,manager:x.t.handle,pts:x.pts,won:x.won,record:`${x.rec.w}-${x.rec.l}`,bench_points_left:Math.round(x.bench*10)/10,best_starter:x.star&&{name:nm(x.star.id),pts:x.star.p},worst_starter:x.dud&&{name:nm(x.dud.id),pts:x.dud.p},best_benched:x.benchStar&&{name:nm(x.benchStar.id),pts:x.benchStar.p},teams_outscored:x.beat})),
    trades:f.trades.map(t=>(t.roster_ids||[]).map(id=>S.byRid[id]&&S.byRid[id].name)),waiver_moves:f.adds&&Object.fromEntries(Object.entries(f.adds).map(([k,v])=>[S.byRid[k]?S.byRid[k].name:k,v]))};
  const prompt=`You write a savage but friendly satirical fantasy football newspaper for a group of friends${lang==='es'?' in Monterrey, Mexico. Write in Mexican Spanish, casual, witty, no slurs, no insults about real-life traits':' . Write in English, witty, no slurs, no insults about real-life traits'}. Roast everyone using ONLY these facts; never invent scores or players.\nFACTS: ${JSON.stringify(facts)}\nReturn ONLY JSON: {"headline":string,"deck":string,"stories":[{"h":string,"b":string}] (5-7 stories, 2-4 sentences each),"caps":[{"name":team name,"handle":manager,"pts":number,"body":2-3 sentence roast}] (one per team, ordered by points)}`;
  try{const out=await s.json(prompt,{modelTier:'default'});if(out&&out.headline){S.aiPaper[S.gzWeek+lang]=out;render()}else msg.textContent='The edition came back empty. Try again.'}
  catch(e){msg.textContent=e&&e.code==='rate_limited'?'Too many requests. Wait a minute and retry.':e&&e.code==='not_granted'?'Permission was not granted.':'Could not write the edition this time.';btn.disabled=false}
}

document.addEventListener('change',e=>{if(e.target.id==='gzWeek'){S.gzWeek=Number(e.target.value);render()}});
document.addEventListener('click',e=>{
  const lg=e.target.closest('[data-lang]');if(lg){S.lang=lg.dataset.lang;store.set('wr_lang',S.lang);render()}
  if(e.target.id==='btnCopy'){const txt=$('#paperBody').innerText;navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{e.target.textContent='Copied'},()=>{e.target.textContent='Copy blocked here'})}
  if(e.target.id==='btnAI')aiEdition();});
registerModule({key:'paper',label:'Gazette',order:90,render:rPaper,after(){getSample().then(s=>{const b=$('#btnAI');if(b&&s)b.hidden=false})}});

</script>
<script>
/* js/app.js */
/* App shell: tab bar, routing between modules, boot, and the screen shown when Sleeper can't be reached */
function tabs(){return [...MODULES].sort((a,b)=>a.order-b.order)}
function renderChrome(){
  const L=S.league,me=S.byRid[S.meRid];
  $('#lgName').textContent=L.name;
  const inProg=Object.values(S.games).some(g=>g.state==='in');
  $('#lgMeta').innerHTML=`${inProg?'<span class="live-dot"></span>':''}Week ${S.week}, ${S.season} season. ${L.total_rosters}-team ${S.isDynasty?'dynasty':'redraft'}, ${S.slots.includes('SUPER_FLEX')?'Superflex':'1QB'}, ${(L.scoring_settings.rec??0)} PPR. Viewing as ${h(me.name)} (${me.w}-${me.l}${me.t?'-'+me.t:''}).`;
  $('#tabs').innerHTML=tabs().map(m=>`<button role="tab" aria-selected="${S.tab===m.key}" data-tab="${m.key}">${m.label}</button>`).join('');
  $('#foot').innerHTML=`Data: Sleeper API (league, rosters, projections, live points), ESPN (game clocks, headlines), ${h(S.valueSource)}. ${S.projOK?'':'Sleeper projections did not load, so projections read as zero. '}Live numbers refresh every 60 seconds while games are on.`;
}
function render(){
  const m=MODULES.find(x=>x.key===S.tab)||tabs()[0];S.tab=m.key;
  $('#main').innerHTML=m.render();if(m.after)m.after();
  try{history.replaceState(null,'','#'+m.key)}catch(e){}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;renderChrome();render();window.scrollTo(0,0)});
if(location.hash.length>1)S.tab=location.hash.slice(1);

const SNAP=[["ZaraTDs","antoniojzaratel",9.4,23.8,94],["Colageno Special Team","FerCantu2001",8.6,18.5,92],["Glock Purdy","legargamer",8.4,15.7,89],["Turgers💍","Furber",8.2,16.8,91],["Juanimales (grr)","juanfrangzz",7.6,7.4,69],["Le Noide’s Equipe 🚬","HumbertoMena17",6.6,6.9,64],["UÑITAS 💅","andresguerecag",6.2,2.1,19],["Hock-Tua Fc","DiegoPedraza",6.1,3.6,34],["FM7","federicomedina72",4.8,2.9,27],["LALOCOMOTORA 🚂","Lalocomotora21",3.7,2.4,22]];
function showBlocked(err){
  const inClaude=/claude\.ai|claudeusercontent/.test(location.hostname)||location.protocol==='blob:'||window.top!==window.self;
  $('#lgName').textContent='War Room';$('#lgMeta').textContent='Could not reach Sleeper';$('#tabs').innerHTML='';
  const site=CONFIG.siteUrl?`${CONFIG.siteUrl}?league=${encodeURIComponent(S.leagueId)}`:'';
  $('#main').innerHTML=`<div class="err"><b>${inClaude?'This preview can’t load live data.':'Sleeper didn’t respond.'}</b>
    <p style="margin:6px 0 0">${inClaude?'Pages shown inside claude.ai aren’t allowed to call Sleeper, ESPN or other outside sites. The full War Room, with live scores, every tool and the sportsbook, runs on the league’s GitHub Pages site.':h(err&&err.message||'The request failed.')+' Check your connection and the league ID, then load again.'}</p>
    ${site?`<p style="margin:12px 0 0"><a class="btn" href="${h(site)}" target="_blank" rel="noopener">Open the live War Room</a></p>`:''}</div>
  ${S.leagueId===DEF_LEAGUE?`<h2>La Dinastía, snapshot from September 25, 2026</h2><p class="lede">Three-season average projected wins and title odds from The Dynasty Terminal model.</p>
  <div class="panel scroll"><table><thead><tr><th>#</th><th>Team</th><th class="r">Avg wins</th><th class="r">Title odds</th><th class="r">Playoffs</th></tr></thead><tbody>
  ${SNAP.map((r,i)=>`<tr class="${r[1]===DEF_USER?'me':''}"><td class="num">${i+1}</td><td><div class="pname">${h(r[0])}</div><div class="psub">@${h(r[1])}</div></td><td class="r num">${r[2]}</td><td class="r num">${r[3]}%</td><td class="r num">${r[4]}%</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

$('#inLeague').value=S.leagueId;$('#inUser').value=S.username;
$('#setup').addEventListener('submit',()=>{S.leagueId=$('#inLeague').value.trim()||DEF_LEAGUE;S.username=$('#inUser').value.trim()||DEF_USER;store.set('wr_league',S.leagueId);store.set('wr_user',S.username);boot()});
async function boot(){try{await load()}catch(e){console.error(e);showBlocked(e)}}
boot();
