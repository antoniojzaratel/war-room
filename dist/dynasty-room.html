<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty Room: the front office for your Sleeper leagues</title>
<meta name="description" content="Dynasty fantasy football tools for Sleeper: live win probability, lineups built to win, trade grades, three-year forecasts, league history, a play-money sportsbook and a weekly roast.">
<meta property="og:title" content="Dynasty Room">
<meta property="og:description" content="The front office for your Sleeper leagues.">
<meta property="og:url" content="https://dynasty-room.com">
<link rel="canonical" href="https://dynasty-room.com/">
<meta name="theme-color" content="#1B4D33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cellipse cx=%2232%22 cy=%2232%22 rx=%2228%22 ry=%2217%22 fill=%22%239E6300%22 transform=%22rotate(-35 32 32)%22/%3E%3Cpath d=%22M22 40l20-16M27 33l4 4M31 29l4 4M35 25l4 4%22 stroke=%22%23fff%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EA;--panel:#FFFFFF;--panel2:#F4F7F1;--ink:#10251A;--mute:#5B6C60;--line:#D2DBCE;
  --amber:#9E6300;--red:#C0343A;--mint:#1C8150;--field:#1B4D33;--fieldink:#F3F7EF;--chalkline:rgba(243,247,239,.28);
  --num:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1D14;--panel:#12291C;--panel2:#173322;--ink:#E9F0E4;--mute:#95A99A;--line:#25452F;
  --amber:#F4B62C;--red:#F0646A;--mint:#5CD49B;--field:#0F3A24;--fieldink:#F3F7EF;}}
:root[data-theme="dark"]{--bg:#0C1D14;--panel:#12291C;--panel2:#173322;--ink:#E9F0E4;--mute:#95A99A;--line:#25452F;
  --amber:#F4B62C;--red:#F0646A;--mint:#5CD49B;--field:#0F3A24;--fieldink:#F3F7EF;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mute{color:var(--mute)}.up{color:var(--mint)}.down{color:var(--red)}.amber{color:var(--amber)}

/* header: the field */
.top{background:var(--field);color:var(--fieldink);position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--chalkline) calc(10% - 1px) 10%);pointer-events:none;opacity:.55}
.top-in{position:relative;max-width:1200px;margin:0 auto;padding:18px 20px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.brand h1{font-family:var(--num);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;letter-spacing:.01em}
.brand .meta{font-size:14px;opacity:.85}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF5A4E;margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
@keyframes pulse{50%{opacity:.25}}
.setup{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;align-items:center;font-size:14px}
.setup input{background:rgba(255,255,255,.1);border:1px solid var(--chalkline);border-radius:6px;padding:6px 9px;color:var(--fieldink);width:190px}
.setup button{background:var(--fieldink);color:var(--field);border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--fieldink);opacity:.72;padding:10px 14px 12px;font-family:var(--num);font-size:18px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--amber)}
main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
h2{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.1;margin:30px 0 6px}
h2:first-child{margin-top:4px}
h3{font-family:var(--num);font-weight:600;font-size:20px;margin:18px 0 6px}
p.lede{margin:0 0 16px;color:var(--mute);max-width:68ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:600;font-size:13px;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.me td{background:var(--panel2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.bad{color:var(--red);border-color:currentColor;background:transparent}
.tag.good{color:var(--mint);border-color:currentColor;background:transparent}
.pos{display:inline-block;min-width:34px;text-align:center;font-family:var(--num);font-weight:600;font-size:13px;border-radius:4px;padding:0 5px;color:#fff}
.pos.QB{background:#B8465A}.pos.RB{background:#2F8F6A}.pos.WR{background:#3C78B5}.pos.TE{background:#C27A1F}.pos.K{background:#6F6A8F}.pos.DEF{background:#5D6B5F}
.pos.FLEX,.pos.SUPER_FLEX,.pos.REC_FLEX,.pos.WRRB_FLEX{background:#7B8A7E}
.pname{font-weight:600}.psub{font-size:13px;color:var(--mute)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{padding:40px 0;color:var(--mute)}
.err{border-left:4px solid var(--red);background:var(--panel);padding:14px 16px;border-radius:6px;max-width:760px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--mint)}

/* scoreboard: the one loud thing */
.board{background:var(--field);color:var(--fieldink);border-radius:12px;padding:20px 22px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--chalkline)}
.board-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative;z-index:1}
.board .tname{font-family:var(--num);font-weight:600;font-size:clamp(18px,3vw,24px);line-height:1.1}
.board .handle{font-size:13px;opacity:.75}
.board .big{font-family:var(--num);font-weight:700;font-size:clamp(56px,11vw,96px);line-height:.95;color:#FFC94A;font-variant-numeric:tabular-nums;margin-top:8px}
.board .sub{font-size:14px;opacity:.85}
.board .side.right{text-align:right}
.wp{position:relative;z-index:1;margin-top:16px}
.wp .track{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;display:flex}
.wp .track i{display:block;background:#FFC94A}
.wp .lbl{display:flex;justify-content:space-between;font-family:var(--num);font-size:18px;margin-top:4px}
.mini{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mini .r{text-align:right}
.mini .sc{font-family:var(--num);font-size:24px;font-weight:600}
.mini .mid{font-family:var(--num);font-size:14px;color:var(--mute);text-align:center;min-width:70px}
.plist td{padding:6px 8px}
.flag{color:var(--red);font-weight:600;font-size:13px}

/* trade lab */
.tl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.tl{grid-template-columns:1fr}.board-grid{grid-template-columns:1fr}.board::after{display:none}.board .side.right{text-align:left}}
.assets{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.assets label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.assets label:last-child{border-bottom:0}
.assets .v{margin-left:auto;font-family:var(--num);font-size:16px}
.verdict{font-family:var(--num);font-size:28px;font-weight:700}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0}
.split i:first-child{background:var(--amber)}.split i:last-child{background:var(--mint)}

/* gazette */
.paper{background:#ECE8DF;color:#17140F;border-radius:4px;padding:26px clamp(16px,4vw,44px) 36px;box-shadow:0 1px 0 #cfc9bb inset;max-width:980px}
.mast{text-align:center;border-bottom:4px double #17140F;padding-bottom:10px;margin-bottom:18px}
.mast .name{font-family:Anton,Impact,sans-serif;font-size:clamp(40px,9vw,86px);line-height:.95;color:#B5121B;letter-spacing:.01em}
.mast .sub{font-family:"Source Serif 4",Georgia,serif;font-size:15px;margin-top:6px}
.paper .lead{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;margin:6px 0 10px;text-wrap:balance}
.paper .deck{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.5;margin:0 0 20px;font-style:italic}
.paper .cols{columns:2 300px;column-gap:32px;column-rule:1px solid #b9b2a2}
.paper .story{break-inside:avoid;margin:0 0 18px}
.paper .story h4{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:20px;line-height:1.2;margin:0 0 4px}
.paper p{font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.6;margin:0 0 8px}
.paper .caps{margin-top:18px;border-top:2px solid #17140F;padding-top:12px}
.paper .caps h5{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;margin:14px 0 2px;color:#17140F}
.paper .caps .rec{font-family:"Source Serif 4",Georgia,serif;font-size:14px;color:#6B6252}
.paper table{font-family:"Source Serif 4",Georgia,serif;font-size:15px}
.paper th,.paper td{border-color:#b9b2a2;color:#17140F}
.stamp{display:inline-block;border:2px solid #B5121B;color:#B5121B;font-family:Anton,Impact,sans-serif;padding:2px 10px;transform:rotate(-2deg);font-size:14px}

/* sportsbook */
.bk-bar{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center;background:var(--field);color:var(--fieldink);border-radius:12px;padding:16px 20px;margin-bottom:8px}
.bk-bar .psub{color:var(--fieldink);opacity:.75}
.bk-bar .chip{background:transparent;color:var(--fieldink);border-color:var(--chalkline)}
.bk-bar .chip[aria-pressed="true"]{background:var(--fieldink);color:var(--field)}
.bk-bar .up{color:#7BE3AE}.bk-bar .down{color:#FF9A9E}
.bk-big{font-size:40px;font-weight:700;line-height:1;color:#FFC94A}.bk-mid{font-size:28px;font-weight:600;line-height:1}
.bk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.bk-layout aside{position:sticky;top:12px;margin-top:18px}
.bk-games{padding:4px 16px}
.bk-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 78px 92px;gap:8px;align-items:center;padding:8px 0}
.bk-row.bk-second{border-bottom:1px solid var(--line);padding-bottom:12px}
.bk-games .bk-row:last-child{border-bottom:0}
.bk-head{font-size:13px;color:var(--mute);font-weight:600;padding:8px 0 0}.bk-head span{text-align:center}
.odd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:48px;padding:4px 6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;cursor:pointer;line-height:1.15}
.odd:hover{border-color:var(--ink)}
.odd[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.odd .ol{font-size:13px;opacity:.8}.odd .ov{font-size:18px;font-weight:600}
.bk-li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.bk-li:last-child{border-bottom:0}.bk-li .odd{min-width:78px;min-height:40px}
.bk-yn{display:grid;grid-template-columns:78px 78px;gap:6px;text-align:center}
.bk-leg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.bk-x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mute);padding:4px 8px}
.bk-stake{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:600}
.bk-stake input{width:110px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.bk-float{display:none}
@media (max-width:900px){.bk-layout{grid-template-columns:1fr}.bk-layout aside{position:static}
 .bk-float{display:block;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--amber);color:#1b1300;text-align:center;font-weight:700;padding:12px;border-radius:10px;text-decoration:none;z-index:5}}
@media (max-width:520px){.bk-row{grid-template-columns:minmax(0,1fr) 70px 62px 70px;gap:5px}.odd .ov{font-size:16px}.odd .ol{font-size:12px}}
footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;font-size:13px;color:var(--mute)}

/* forecast */
.fc-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(60px,40%) 48px;gap:10px;align-items:center;padding:5px 0}
.fc-row.fc-me .fc-name{font-weight:700}
.fc-rk{color:var(--mute);font-size:15px}.fc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}.fc-bar i{display:block;height:100%}
.fc-p{text-align:right;font-size:17px}
.fc-whatif{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.fc-whatif .psub{color:var(--fieldink);opacity:.75}.fc-big{font-size:28px;font-weight:700;color:#FFC94A}.fc-big .mute{color:var(--fieldink);opacity:.6;font-size:18px}

/* sportsbook sections, duels */
.bk-secs{margin:14px 0 4px}
.odd:disabled{cursor:default;opacity:.55}
.bk-duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bk-duel:last-child{border-bottom:0}
.bk-duel>div{display:flex;align-items:center;gap:10px;min-width:0}.bk-duel>div.r{justify-content:flex-end;text-align:right}
.bk-duel .odd{min-width:70px;min-height:42px;flex:none}
@media (max-width:520px){.bk-duel{grid-template-columns:1fr;gap:6px}.bk-duel>div.r{justify-content:flex-end;text-align:left;flex-direction:row-reverse}.bk-duel>.pos{display:none}}

.setup-wrap{margin-top:8px;font-size:14px}
.setup-wrap summary{cursor:pointer;opacity:.85;width:max-content}
.setup-wrap[open] summary{margin-bottom:4px}
.fc-board::after{display:none}

/* live: expandable matchups */
.lv-mu{padding:2px 16px;margin-bottom:10px}
.lv-mu>summary{list-style:none;cursor:pointer}
.lv-mu>summary::-webkit-details-marker{display:none}
.lv-mu .mini{border-bottom:0}
.lv-mu[open]>summary .mini{border-bottom:1px solid var(--line)}
.plist tr:last-child td{border-bottom:0}

/* multi-team trades */
.tl.tl-3,.tl.tl-4{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tc-a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.tc-a:last-child{border-bottom:0}
.tc-a.on{background:var(--panel2)}
.tc-a label{display:flex;gap:8px;align-items:center;cursor:pointer;flex:1 1 160px;min-width:0;padding:0;border:0}
.tc-a select{font-size:13px;padding:4px 6px;max-width:170px}
.tc-a .v{margin-left:auto;font-family:var(--num);font-size:16px}

/* forecast: outlook cards, slope chart, projected lineups */
.tag.warn{color:var(--amber);border-color:currentColor;background:transparent}
.ol-leg{display:flex;gap:10px;align-items:baseline;padding:4px 0}
.ol-leg .tag{flex:none;min-width:150px;text-align:center}
.ol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.ol-card.ol-me{border:2px solid var(--amber)}
.ol-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ol-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ol-n{font-size:24px;font-weight:600;line-height:1.1}.ol-n .mute{font-size:16px}
.ol-list{margin:12px 0 0;padding-left:18px;font-size:15px}.ol-list li{margin:0 0 6px}
.ol-advice{margin:10px 0 0;padding:10px 12px;background:var(--panel2);border-radius:8px;font-size:15px}
.sl-wrap{position:relative;overflow-x:auto}
.slope{width:100%;min-width:560px;height:auto;display:block}
.sl-yr{font-family:var(--num);font-weight:600;font-size:16px;fill:var(--ink)}
.sl-rk{font-family:var(--num);font-size:13px;fill:var(--mute)}
.sl-ax{stroke:var(--line);stroke-width:1}
.sl-line{fill:none;stroke:var(--mute);stroke-width:2;opacity:.55;stroke-linejoin:round}
.sl-dot{fill:var(--mute);stroke:var(--panel);stroke-width:2;opacity:.8}
.sl-lab{font-size:13px;fill:var(--mute)}
.sl-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.sl-me .sl-line{stroke:var(--amber);stroke-width:3.5;opacity:1}.sl-me .sl-dot{fill:var(--amber);opacity:1}.sl-me .sl-lab{fill:var(--ink);font-weight:700}
.sl-g:focus{outline:none}.sl-g:focus .sl-line,.sl-g:hover .sl-line{stroke:var(--ink);opacity:1;stroke-width:3}
.sl-g:focus .sl-lab,.sl-g:hover .sl-lab{fill:var(--ink);font-weight:700}
.sl-g.sl-dim{opacity:.25}
.sl-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:6px 9px;border-radius:6px;max-width:320px;z-index:2}
.fc-lu{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
@media (max-width:520px){.ol-stats{grid-template-columns:1fr 1fr}.ol-leg{flex-direction:column;gap:2px}.ol-leg .tag{min-width:0}}

/* sign-in, league picker, account bar */
.acct{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:14px}
.acct:empty{display:none}
.acct-user{opacity:.9;font-weight:600}
.acct select{background:rgba(255,255,255,.1);color:var(--fieldink);border:1px solid var(--chalkline);border-radius:6px;padding:5px 8px;max-width:260px}
.acct select option{color:#10251A}
.acct-btn{background:none;border:1px solid var(--chalkline);color:var(--fieldink);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px}
.signin{max-width:560px;padding:10px 0 30px}
.signin-form label{font-weight:600}
.signin-form input{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:17px}
.signin-form .btn{padding:10px 16px}
.lg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lg-card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;width:100%}
.lg-card:hover{border-color:var(--ink)}
.lg-card img,.lg-ph{width:48px;height:48px;border-radius:50%;flex:none;background:var(--field);object-fit:cover}

/* history */
.hx-trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.hx-tro{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start}
.hx-tro>div:not(.hx-yr){grid-column:2}
.hx-yr{grid-row:1/4;font-size:34px;font-weight:700;color:var(--amber);line-height:1}
.hx-recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hx-rec{display:flex;flex-direction:column;gap:2px}
.hx-big{font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
.hx-podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.hx-p1{border:2px solid var(--amber)}
.hx-toilet{border:2px dashed var(--red)}
.hx-trade{margin-bottom:12px}
.hx-sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:8px}
.hx-sides ul{margin:4px 0 6px;padding-left:18px;font-size:15px}
.hx-sides>div{padding:8px 10px;border-radius:8px;background:var(--panel2)}
.hx-sides>div.hx-win{outline:2px solid var(--mint)}

/* gazette language picker */
.gz-lang{position:relative}
.gz-lang>summary{list-style:none;display:inline-block}
.gz-lang>summary::-webkit-details-marker{display:none}
.gz-lang-pop{position:absolute;z-index:6;top:calc(100% + 6px);left:0;width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.gz-lang-pop input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.paper[dir="rtl"] .cols{direction:rtl}

/* rankings: players and start/sit */
.tier-row td{background:var(--panel2);font-family:var(--num);font-weight:600;font-size:15px;color:var(--amber);padding:6px 10px}
.ss-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.ss-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#ssAdd{flex:1 1 260px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
/* hindsight */
.hs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lock{font-size:11px;font-weight:700;background:var(--amber);color:#1b1300;border-radius:4px;padding:0 4px;margin-left:2px}
/* premium, pricing, landing */
.pro-card{border:2px solid var(--amber)}
.pro-badge{display:inline-block;font-size:12px;font-weight:700;background:var(--amber);color:#1b1300;border-radius:4px;padding:1px 8px}
.acct-plan{font-size:12px;font-weight:700;border:1px solid var(--chalkline);border-radius:4px;padding:1px 7px}
.acct-plan.pro{background:#FFC94A;color:#1b1300;border-color:#FFC94A}
.acct-up{background:#FFC94A;color:#1b1300;border-color:#FFC94A;font-weight:700}
.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:10px}
.pricing ul{margin:10px 0 0;padding-left:18px}.pricing li{margin:0 0 6px}
.pricing .price{font-size:40px;font-weight:700;line-height:1}
.pro-plan{border:2px solid var(--amber)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding:18px 0 8px}
.hero-h{font-family:var(--num);font-size:clamp(34px,5.4vw,58px);line-height:1.02;margin:0 0 14px;text-wrap:balance}
.hero-p{font-size:18px;color:var(--mute);max-width:56ch;margin:0 0 20px}
.hero-board{background:var(--field);color:var(--fieldink);border-radius:12px;padding:20px 22px}
.hb-row{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;padding:4px 0}
.hb-row b{font-size:44px;color:#FFC94A;font-weight:700}
.btn-google{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;padding:11px 18px;font-size:16px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px 28px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.feat-i h3{margin:0 0 4px}.feat-i p{margin:0;color:var(--mute)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:20;max-width:90vw}
footer a{color:inherit;margin-left:10px}
.panel form input:not([type=checkbox]){background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex:1 1 160px;min-width:0}
</style>

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="lgName">Dynasty Room</h1>
      <span class="meta" id="lgMeta">Loading…</span>
    </div>
    <div class="acct" id="acct"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="main"><div class="status">Loading your league from Sleeper…</div></main>
<footer id="foot"></footer>

<script>
/* js/config.js */
/* Dynasty Room settings. Everything here is safe to publish: the Supabase anon key is public by design,
   and Stripe secret keys live only in Supabase function secrets (see docs/LAUNCH.md). */
const CONFIG={
  appName:'Dynasty Room',
  siteUrl:'https://dynasty-room.com',
  featuredLeagueId:'1314840770154364928',   // La Dinastía: listed first when a user belongs to it

  /* Backend. Leave url empty to run without accounts: username sign-in, every feature unlocked (handy for testing). */
  supabase:{url:'',anonKey:''},

  /* Plans shown on the pricing section. Stripe price ids go in the Supabase function secrets, not here. */
  pricing:{monthly:'$4.99',yearly:'$14.99',currency:'USD'},

  /* Data sources. Sleeper covers leagues, projections, scores and the schedule.
     espnClock adds the live game clock to live projections (factual data from ESPN's public scoreboard);
     espnNews shows ESPN headlines, which are ESPN's content: keep it off for the commercial site. */
  sources:{espnClock:true,espnNews:false},

  /* Gazette translation for free machine translation in dev mode. With the backend on, premium members get
     editions written by AI in their own language instead (the ai-gazette function). */
  translate:{provider:'mymemory',email:''}
};

</script>
<script>
/* js/core.js */
/* Dynasty Room core: config, helpers, Sleeper loading, models. Every module reads the shared state S. */
/* ============ basics ============ */
const DEF_LEAGUE=CONFIG.featuredLeagueId||'', DEF_USER='antoniojzaratel';
const API='https://api.sleeper.app';
const POS=['QB','RB','WR','TE','K','DEF'];
const ELIG={QB:['QB'],RB:['RB'],WR:['WR'],TE:['TE'],K:['K'],DEF:['DEF'],FLEX:['RB','WR','TE'],SUPER_FLEX:['QB','RB','WR','TE'],REC_FLEX:['WR','TE'],WRRB_FLEX:['RB','WR']};
const ORD=['QB','RB','WR','TE','K','DEF','REC_FLEX','WRRB_FLEX','FLEX','SUPER_FLEX'];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qs=new URLSearchParams(location.search);
const S={leagueId:qs.get('league')||store.get('wr_league')||'',username:qs.get('user')||store.get('wr_user')||'',myLeagues:null,
  tab:'live',lang:store.get('wr_lang')||'es',P:{},proj:{},ros:{},val:{},adp:{},padp:{},mu:{},tx:{},games:{},liveTeam:{},news:[],trend:[],sim:null,
  tc:null,lineupTeam:null,lineupMode:'week',wvPos:'ALL',gzWeek:null,suggest:null,aiPaper:{}};
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=x=>(Math.round((x||0)*10)/10).toFixed(1);
const f0=x=>Math.round(x||0).toLocaleString('en-US');
const pc=x=>{x=x||0;return (x>0&&x<.01)?'<1%':(x>.99&&x<1)?'>99%':Math.round(x*100)+'%'};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' on '+u);return r.json()}
async function tj(u){try{return await j(u)}catch(e){return null}}

/* IndexedDB cache for the big Sleeper players file (Sleeper asks for at most one pull per day) */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('warroom',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}

/* ============ loading ============ */
async function loadPlayers(){
  const c=await idbGet('players');if(c&&Date.now()-c.t<864e5)return c.d;
  const d=await j(API+'/v1/players/nfl');const s={};
  for(const id in d){const p=d[id];if(!p||!POS.includes(p.position))continue;
    s[id]={n:p.position==='DEF'?`${p.first_name} ${p.last_name}`:(p.full_name||`${p.first_name||''} ${p.last_name||''}`.trim()),
      pos:p.position,team:p.team||null,age:p.age||null,exp:p.years_exp??null,inj:p.injury_status||null,body:p.injury_body_part||null,active:p.active!==false,rank:p.search_rank||99999}}
  idbSet('players',{t:Date.now(),d:s});return s;
}
const projURL=(s,w)=>`${API}/projections/nfl/${s}/${w}?season_type=regular&${POS.map(p=>'position[]='+p).join('&')}`;
function ptsFromStats(st,pos){
  if(!st)return 0;const sc=S.league.scoring_settings||{};
  if(pos==='DEF'||pos==='K'){const f=st.pts_ppr??st.pts_half_ppr??st.pts_std;if(f!=null)return f}
  let t=0;for(const k in sc){const v=st[k];if(typeof v==='number')t+=v*sc[k]}
  if(!t){const r=sc.rec||0;t=r>=1?(st.pts_ppr||0):r>=.5?(st.pts_half_ppr||0):(st.pts_std||0)}
  return Math.round(t*10)/10;
}

async function load(){
  S.P={};S.proj={};S.ros={};S.val={};S.adp={};S.padp={};S.mu={};S.tx={};S.sim=null;S.suggest=null;S.aiPaper={};
  $('#main').innerHTML='<div class="status">Pulling league, rosters, projections and values…</div>';
  document.dispatchEvent(new Event('wr:reset'));
  const L=S.leagueId;
  const [state,league]=await Promise.all([j(API+'/v1/state/nfl'),j(`${API}/v1/league/${L}`)]);
  if(!league)throw new Error('League not found. Check the league ID.');
  S.state=state;S.league=league;S.season=league.season;
  const [users,rosters,picks,P]=await Promise.all([j(`${API}/v1/league/${L}/users`),j(`${API}/v1/league/${L}/rosters`),tj(`${API}/v1/league/${L}/traded_picks`),loadPlayers()]);
  S.P=P;S.users=users;S.rosters=rosters;S.traded=picks||[];
  S.isDynasty=(league.settings&&league.settings.type)===2;
  S.slots=(league.roster_positions||[]).filter(s=>ELIG[s]);
  S.slotsSorted=[...S.slots].sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b));
  S.regEnd=Math.max(1,(league.settings.playoff_week_start||15)-1);
  const sameSeason=String(state.season)===String(league.season);
  let wk=1;
  if(sameSeason){if(state.season_type==='regular')wk=state.week||state.display_week||1;else if(state.season_type==='post')wk=18}
  else if(Number(state.season)>Number(league.season))wk=18;
  S.week=Math.min(Math.max(wk,1),18);
  S.gzWeek=null;

  // who am I
  let me=users.find(u=>(u.display_name||'').toLowerCase()===S.username.toLowerCase());
  if(!me){const u=await tj(`${API}/v1/user/${encodeURIComponent(S.username)}`);if(u)me=users.find(x=>x.user_id===u.user_id)}
  S.teams=rosters.map(r=>{const u=users.find(x=>x.user_id===r.owner_id)||{};const st=r.settings||{};
    return{rid:r.roster_id,uid:r.owner_id,name:(u.metadata&&u.metadata.team_name)||u.display_name||('Team '+r.roster_id),handle:u.display_name||'orphan',
      players:(r.players||[]).filter(id=>P[id]),starters:r.starters||[],reserve:new Set(r.reserve||[]),taxi:new Set(r.taxi||[]),
      w:st.wins||0,l:st.losses||0,t:st.ties||0,pf:(st.fpts||0)+(st.fpts_decimal||0)/100,pa:(st.fpts_against||0)+(st.fpts_against_decimal||0)/100}});
  S.byRid={};S.teams.forEach(t=>S.byRid[t.rid]=t);
  S.meRid=me?(S.teams.find(t=>t.uid===me.user_id)||{}).rid:null;
  S.inLeague=S.meRid!=null;
  if(S.meRid==null)S.meRid=S.teams[0].rid;
  S.lineupTeam=S.meRid;S.tc={teams:[S.meRid,S.teams.find(t=>t.rid!==S.meRid).rid],mv:{}};

  // projections: this week + next three for rest-of-season strength
  const pweeks=range(S.week,Math.min(S.week+3,18));
  const lastMu=Math.max(S.regEnd,S.week);
  const SRC=CONFIG.sources||{};
  const [projs,mus,txs,sched,espn,news,trend]=await Promise.all([
    Promise.all(pweeks.map(w=>tj(projURL(S.season,w)))),
    Promise.all(range(1,lastMu).map(w=>tj(`${API}/v1/league/${L}/matchups/${w}`))),
    Promise.all(range(1,S.week).map(w=>tj(`${API}/v1/league/${L}/transactions/${w}`))),
    tj(`${API}/schedule/nfl/regular/${S.season}`),
    SRC.espnClock?tj('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'):null,
    SRC.espnNews?tj('https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=50'):null,
    tj(`${API}/v1/players/nfl/trending/add?lookback_hours=48&limit=60`)]);
  pweeks.forEach((w,i)=>{const m={};(projs[i]||[]).forEach(r=>{const p=P[r.player_id];if(!p)return;m[r.player_id]=ptsFromStats(r.stats,p.pos);
    const st=r.stats||{};if(st.adp_dd_ppr>0&&st.adp_dd_ppr<999)S.adp[r.player_id]=Math.min(S.adp[r.player_id]||999,st.adp_dd_ppr);
    if(st.pos_adp_dd_ppr>0&&st.pos_adp_dd_ppr<999)S.padp[r.player_id]=Math.min(S.padp[r.player_id]||999,st.pos_adp_dd_ppr)});S.proj[w]=m});
  S.projOK=!!(projs[0]&&projs[0].length);
  for(const id in P){let s=0;pweeks.forEach(w=>s+=(S.proj[w][id]||0));S.ros[id]=s/pweeks.length}
  range(1,lastMu).forEach((w,i)=>S.mu[w]=mus[i]||[]);
  range(1,S.week).forEach((w,i)=>S.tx[w]=(txs[i]||[]).filter(t=>t.status==='complete'));
  S.sched=sched||[];parseGames(S.sched,espn);S.planWeek=Math.min(S.weekOver?S.week+1:S.week,18);S.news=(news&&news.articles)||[];S.trend=trend||[];
  const [wb,lb]=await Promise.all([tj(`${API}/v1/league/${L}/winners_bracket`),tj(`${API}/v1/league/${L}/losers_bracket`)]);
  S.wb=wb||[];S.lb=lb||[];
  computeHist();computeValues();
  computeAll();
  renderChrome();render();
  startLiveLoop();
}
/* game state for the Sleeper week: the Sleeper schedule says pre / in / final; ESPN, when enabled, adds the live clock */
function parseGames(sched,espn){
  S.games={};S.weekOver=false;S.espnOK=!!espn;
  const wkGames=(sched||[]).filter(g=>g.week===S.week&&g.status!=='canceled');
  const st=s=>s==='complete'?'post':s==='in_game'||s==='in_progress'?'in':'pre';
  for(const g of wkGames)for(const tm of [g.home,g.away])S.games[tm]={state:st(g.status),detail:g.status==='complete'?'Final':g.status==='pre_game'?g.date:'In progress'};
  if(espn&&espn.events&&(espn.week||{}).number===S.week){
    for(const ev of espn.events){const c=ev.competitions&&ev.competitions[0];if(!c)continue;const s=ev.status||c.status||{};
      for(const tm of c.competitors||[]){let ab=(tm.team&&tm.team.abbreviation)||'';if(ab==='WSH')ab='WAS';
        S.games[ab]={state:s.type&&s.type.state,period:s.period,clock:s.clock,detail:s.type&&s.type.shortDetail}}}}
  const all=Object.values(S.games);
  // the week is over once every game is final (Sleeper keeps the same week number until Wednesday)
  if(all.length&&all.every(g=>g.state==='post')&&(S.mu[S.week]||[]).some(m=>m.points>0))S.weekOver=true;
  if(S.state&&S.state.season_type==='regular'&&S.state.week>S.week)S.weekOver=true;
}
/* ============ Dynasty Room value model ============
   Points above replacement at each position for this season and the next three (aging curves in ppgYear),
   discounted by year, blended with Sleeper's dynasty ADP as the market's read. Scaled so the best asset is about 10,000. */
function computeValues(){
  const n=S.league.total_rosters||S.teams.length,slots=S.slots,cnt=p=>slots.filter(s=>s===p).length;
  const flex=cnt('FLEX'),sf=cnt('SUPER_FLEX'),wr_=cnt('WRRB_FLEX'),rec=cnt('REC_FLEX');
  const starters={QB:(cnt('QB')+sf*.9)*n,RB:(cnt('RB')+flex*.45+wr_*.5)*n,WR:(cnt('WR')+flex*.45+wr_*.5+rec*.7)*n,TE:(cnt('TE')+flex*.1+rec*.3)*n};
  const Y=S.isDynasty?[0,1,2,3]:[0],disc=[1,.8,.62,.48];
  const ids=Object.keys(S.P).filter(id=>{const p=S.P[id];return p.team||(S.isDynasty&&p.active&&p.age&&p.age<30)});
  const raw={};
  for(const y of Y){const byPos={QB:[],RB:[],WR:[],TE:[]};
    for(const id of ids){const p=S.P[id];if(!byPos[p.pos])continue;byPos[p.pos].push([id,ppgYear(id,y)])}
    for(const pos in byPos){const arr=byPos[pos].sort((a,b)=>b[1]-a[1]);const k=Math.max(1,Math.round(starters[pos]||n));const repl=(arr[k]||[0,0])[1];
      for(const [id,v] of arr){const vor=Math.max(0,v-repl);if(vor>0)raw[id]=(raw[id]||0)+vor*disc[y]}}}
  const vmax=Math.max(1,...Object.values(raw));
  for(const id of ids){const p=S.P[id];if(p.pos==='K'||p.pos==='DEF'){S.val[id]=p.team?40:0;continue}
    const model=(raw[id]||0)/vmax;
    const mkt=S.adp[id]?Math.exp(-(S.adp[id]-1)/55):0;
    const v=S.isDynasty?(S.adp[id]?.6*model+.4*mkt:model*.9):model;
    if(v>0)S.val[id]=Math.round(10000*Math.pow(v,1.1))}
  S.valueSource='the Dynasty Room value model';
}
function modelValue(id){
  const p=S.P[id];if(!p||!p.team)return 0;if(p.pos==='K'||p.pos==='DEF')return 40;
  const ppg=Math.min(S.ros[id]||0,27);if(ppg<=0)return 0;
  let ageF=1;
  if(S.isDynasty&&p.age){const end={QB:34,RB:26,WR:28,TE:29}[p.pos]||28;const drop={QB:.14,RB:.22,WR:.16,TE:.16}[p.pos]||.16;
    ageF=p.age<=end?Math.min(1.3,1+(end-p.age)*.04):Math.max(.12,1-(p.age-end)*drop)}
  const sf=S.slots.includes('SUPER_FLEX');const posF={QB:sf?1.25:.55,RB:1,WR:1,TE:.9}[p.pos]||1;
  return Math.round(9500*Math.pow(ppg/27,1.7)*ageF*posF);
}

/* ============ core models ============ */
function startable(t,list){const L=list||t.players;return L.filter(id=>S.P[id]&&!(t&&t.reserve.has(id))&&!(t&&t.taxi.has(id)))}
function optimize(pids,fn){
  const pool=pids.filter(id=>S.P[id]).map(id=>({id,pos:S.P[id].pos,pts:fn(id)})).sort((a,b)=>b.pts-a.pts);
  const used=new Set(),lineup=[];let total=0;
  for(const s of S.slotsSorted){const c=pool.find(p=>!used.has(p.id)&&ELIG[s].includes(p.pos));
    if(c){used.add(c.id);lineup.push({slot:s,...c});total+=c.pts}else lineup.push({slot:s,id:null,pos:null,pts:0})}

/* annual change in fantasy output by position and age, from typical aging curves */
function ageStep(pos,age){
  if(!age)return 1;
  if(pos==='RB')return age<=23?1.06:age<=25?1:age<=26?.94:age<=27?.88:.8;
  if(pos==='WR')return age<=23?1.1:age<=26?1.03:age<=28?1:age<=29?.93:.86;
  if(pos==='TE')return age<=24?1.12:age<=27?1.04:age<=29?1:age<=31?.92:.85;
  if(pos==='QB')return age<=25?1.08:age<=31?1.02:age<=34?1:age<=36?.92:.85;
  return 1;
}
const POSF=pos=>({QB:S.slots.includes('SUPER_FLEX')?1.25:.55,RB:1,WR:1,TE:.9}[pos]||1);
function basePpg(id){const r=S.ros[id]||0;const h=S.histPpg&&S.histPpg[id]||0;return Math.max(r,h*.9)}
/* points per game for player id, y seasons from now (0 = rest of this season) */
function ppgYear(id,y){
  const p=S.P[id];if(!p||!p.team&&y===0)return 0;
  let v=basePpg(id);if(y===0)return v;
  if(p.pos==='K'||p.pos==='DEF')return v;
  const age=p.age||26;
  if(age+y>=({QB:40,RB:32,WR:34,TE:35}[p.pos]||34))return 0;
  let f=1;for(let k=0;k<y;k++)f*=ageStep(p.pos,age+k);
  if(p.exp===0)f*=1.1;
  let curve=v*f;

  const pr=S.padp[id];
  if(age+y<=26&&pr){const implied={QB:14+10*Math.exp(-(pr-1)/12),RB:6+16*Math.exp(-(pr-1)/18),WR:6+16*Math.exp(-(pr-1)/22),TE:5+12*Math.exp(-(pr-1)/10)}[p.pos]||0;
    if(implied>curve)curve=curve*.5+implied*.5*Math.min(1,.7+.15*y)}

function rookiePpg(pk,yearsAfterDraft){

/* how much a player's weekly score swings: position baseline, blended with his real volatility once he has 3+ games */
function playerSd(id,mean){
  const p=S.P[id]||{};const r={QB:.33,RB:.5,WR:.58,TE:.65,K:.4,DEF:.55}[p.pos]||.5;const base=Math.max(2,mean*r);
  const v=S.vol&&S.vol[id];if(v&&v.n>=3)return Math.max(2,Math.sqrt(.5*base*base+.5*v.sd*v.sd));return base;
}
const floorOf=(m,sd)=>Math.max(0,m-1.28*sd),ceilOf=(m,sd)=>m+1.28*sd;

/* ============ playoff brackets ============ */
/* Sleeper's losers bracket doesn't say whether "w" is the team that won the game or the team that advanced toward the bottom,
   so read it from the real scores of the first consolation round. Returns champion, runner-up, third place and the
   toilet bowl loser (the last team standing at the bottom). mu is {week: matchups}. */
function bracketResult(wb,lb,mu,pws){
  const out={champ:null,runner:null,third:null,toilet:null,mode:null};
  const f=(b,p)=>(b||[]).find(m=>m.p===p&&m.w);
  const g1=f(wb,1),g3=f(wb,3);if(g1){out.champ=g1.w;out.runner=g1.l}if(g3)out.third=g3.w;
  const done=(lb||[]).filter(m=>m.w&&m.l);if(!done.length)return out;
  let toiletMode=false;const r1=done.filter(m=>m.r===1);
  for(const m of r1){const pts={};for(const x of (mu&&mu[pws])||[])pts[x.roster_id]=x.points||0;
    if(pts[m.w]!=null&&pts[m.l]!=null&&pts[m.w]!==pts[m.l]){toiletMode=pts[m.w]<pts[m.l];break}}
  out.mode=toiletMode?'toilet':'consolation';
  if(toiletMode){const p1=done.find(m=>m.p===1);out.toilet=p1?p1.w:null}
  else{const last=done.filter(m=>m.p).sort((a,b)=>b.p-a.p)[0];out.toilet=last?last.l:null}
  return out;
}

  const proj0=(m.starters||[]).filter(id=>id&&id!=='0').reduce((s,id)=>s+wk(id),0);return{t,m,lt,proj0}}

      <div class="r"><div class="pname">${h(B.t.name)}</div><div class="psub">${over?`proj ${f1(B.proj0)}`:`${f1(B.lt.actual)} scored, ${pc(1-p)} to win`}</div></div></div></summary>

<script>
/* js/modules/lineup.js */
/* Lineup: optimal lineup by points, by chance to beat this week's opponent (upside mode), and over the next four weeks */
function currentVsOptimal(t,fn){
  const cur=S.slots.map((s,i)=>({slot:s,id:t.starters[i]&&t.starters[i]!=='0'?t.starters[i]:null}));
  const fixed=new Set();const out=cur.map(c=>({slot:c.slot,id:null}));
  const lk=S.planWeek===S.week;cur.forEach((c,i)=>{if(lk&&c.id&&isLocked(c.id)){out[i].id=c.id;out[i].locked=true;fixed.add(c.id)}});
  const pool=startable(t).filter(id=>!fixed.has(id)&&!(lk&&isLocked(id))).map(id=>({id,pos:S.P[id].pos,pts:fn(id)})).sort((a,b)=>b.pts-a.pts);
  const used=new Set();
  const order=out.map((o,i)=>i).filter(i=>!out[i].id).sort((a,b)=>ORD.indexOf(out[a].slot)-ORD.indexOf(out[b].slot));
  for(const i of order){const c=pool.find(p=>!used.has(p.id)&&ELIG[out[i].slot].includes(p.pos));if(c){used.add(c.id);out[i].id=c.id}}
  const tot=a=>a.reduce((s,x)=>s+(x.id?fn(x.id):0),0);
  return{cur,opt:out,curT:tot(cur),optT:tot(out)};
}

/* ---------- upside mode: maximise the chance of beating this week's opponent ---------- */
function weekDist(id){
  const lk=S.planWeek===S.week;
  if(lk&&isLocked(id)){let act=0;for(const m of S.mu[S.week]||[])if((m.players_points||{})[id]!=null)act=m.players_points[id];const lp=livePlayer(id,act);return{mean:lp.mean,sd:Math.max(.1,lp.sd)}}
  const m=wkPlan(id);return{mean:m,sd:playerSd(id,m)};
}
function oppLineup(rid){
  const w=S.planWeek,p=pairsOf(S.mu[w]).find(x=>x.some(m=>m.roster_id===rid));if(!p)return null;
  const om=p.find(m=>m.roster_id!==rid),o=S.byRid[om.roster_id];
  let ids=(om.starters||[]).filter(id=>id&&id!=='0'&&S.P[id]);
  const assumed=!ids.length||S.planWeek!==S.week;
  if(assumed)ids=optimize(startable(o),wkPlan).lineup.map(x=>x.id).filter(Boolean);
  let mean=0,v=0;ids.forEach(id=>{const d=weekDist(id);mean+=d.mean;v+=d.sd*d.sd});
  return{t:o,ids,mean,sd:Math.sqrt(v),assumed};
}
function winProb(lineup,opp){let m=0,v=0;lineup.forEach(x=>{if(x.id){const d=weekDist(x.id);m+=d.mean;v+=d.sd*d.sd}});return{p:Phi((m-opp.mean)/Math.sqrt(v+opp.sd*opp.sd)),mean:m,sd:Math.sqrt(v)}}
function winLineup(t,opp,base){
  let L=base.map(x=>({...x}));let best=winProb(L,opp);
  const pool=startable(t).filter(id=>!(S.planWeek===S.week&&isLocked(id)));
  for(let it=0;it<25;it++){let move=null;
    const inL=new Set(L.map(x=>x.id));
    L.forEach((x,i)=>{if(x.locked)return;
      for(const c of pool){if(inL.has(c)||!ELIG[x.slot].includes(S.P[c].pos))continue;
        const T=L.map((y,k)=>k===i?{...y,id:c}:y);const r=winProb(T,opp);if(r.p>best.p+1e-4&&(!move||r.p>move.r.p))move={T,r}}
      // shuffle within the lineup: move a starter to this slot and fill his old slot from the bench
      L.forEach((y,k)=>{if(k===i||y.locked||!y.id||!ELIG[x.slot].includes(S.P[y.id].pos))return;
        for(const c of pool){if(inL.has(c)||!ELIG[y.slot].includes(S.P[c].pos))continue;
          const T=L.map((z,q)=>q===i?{...z,id:y.id}:q===k?{...z,id:c}:z);const r=winProb(T,opp);if(r.p>best.p+1e-4&&(!move||r.p>move.r.p))move={T,r}}});
    });
    if(!move)break;L=move.T;best=move.r;
  }
  return{lineup:L,...best};
}

function rLineup(){
  const t=S.byRid[S.lineupTeam];const mode=S.lineupMode;
  const opts=S.teams.map(x=>`<option value="${x.rid}" ${x.rid===t.rid?'selected':''}>${h(x.name)}${x.rid===S.meRid&&S.inLeague?' (you)':''}</option>`).join('');
  const head=`<h2>Optimal lineup</h2><p class="lede">${mode==='win'?`Upside mode: instead of the most projected points, this picks the lineup with the best chance to beat your week ${S.planWeek} opponent. When you're the underdog it reaches for boom players with a high ceiling, even if they project a little less; when you're the favorite it prefers steady ones.`:'Built from Sleeper projections scored with your league’s exact settings. Players whose games already kicked off stay locked where they are.'}</p>
  <div class="row"><select id="luTeam" aria-label="Team">${opts}</select>
    <div class="chips" role="group" aria-label="Optimise for"><button class="chip" data-lm="week" aria-pressed="${mode==='week'}">Most points, week ${S.planWeek}</button><button class="chip" data-lm="win" aria-pressed="${mode==='win'}">Best chance to win, week ${S.planWeek}</button><button class="chip" data-lm="ros" aria-pressed="${mode==='ros'}">Next 4 weeks</button></div></div>`;
  if(mode==='win')return head+(needsPro('upside')?proCard('upside'):rWinMode(t));
  const fn=mode==='week'?wkPlan:ros;const r=currentVsOptimal(t,fn);
  const gain=r.optT-r.curT;const curSet=new Set(r.cur.map(x=>x.id)),optSet=new Set(r.opt.map(x=>x.id));
  const ins=[...optSet].filter(id=>id&&!curSet.has(id)),outs=[...curSet].filter(id=>id&&!optSet.has(id));
  const bench=startable(t).filter(id=>!optSet.has(id)).sort((a,b)=>fn(b)-fn(a));
  return head+`<div class="panel" style="margin-bottom:16px">${gain>.05?`<div class="verdict up">+${f1(gain)} points available</div><p style="margin:6px 0 0">${ins.map((id,i)=>`Start <b>${h(S.P[id].n)}</b> (${f1(fn(id))})${outs[i]?` over <b>${h(S.P[outs[i]].n)}</b> (${f1(fn(outs[i]))})`:''}`).join('. ')}.</p>`:
    `<div class="verdict">This lineup is already optimal</div><p class="mute" style="margin:6px 0 0">Projected ${f1(r.curT)} points.</p>`}</div>
  <div class="grid2">
   <div class="panel"><h3 style="margin-top:0">Current starters, ${f1(r.curT)}</h3>${luTable(r.cur,fn)}</div>
   <div class="panel"><h3 style="margin-top:0">Optimal, ${f1(r.optT)}</h3>${luTable(r.opt,fn)}</div>
  </div>
  <h3>Bench</h3><div class="panel scroll"><table><thead><tr><th>Player</th><th class="r">Week ${S.planWeek}</th><th class="r">Next 4 avg</th><th class="r">Value</th></tr></thead><tbody>
  ${bench.map(id=>`<tr><td>${pcell(id)}</td><td class="r num">${f1(wkPlan(id))}</td><td class="r num">${f1(ros(id))}</td><td class="r num">${f0(S.val[id])}</td></tr>`).join('')}</tbody></table></div>`;
}
function rWinMode(t){
  const opp=oppLineup(t.rid);
  if(!opp)return `<div class="panel">No opponent for ${h(t.name)} in week ${S.planWeek}, so there's nothing to beat. Use Most points instead.</div>`;
  const base=currentVsOptimal(t,wkPlan).opt,cur=currentVsOptimal(t,wkPlan).cur;
  const W=winLineup(t,opp,base),P0=winProb(base,opp),Pc=winProb(cur,opp);
  const baseSet=new Set(base.map(x=>x.id)),winSet=new Set(W.lineup.map(x=>x.id));
  const ins=[...winSet].filter(id=>id&&!baseSet.has(id)),outs=[...baseSet].filter(id=>id&&!winSet.has(id));
  const dist=id=>weekDist(id);
  const fav=P0.p>=.5;
  const row=x=>{if(!x.id)return `<tr><td>${posTag(x.slot)}</td><td class="flag">Empty</td><td></td><td></td><td></td></tr>`;const d=dist(x.id);
    return `<tr><td>${posTag(x.slot)}</td><td>${pcell(x.id)}${x.locked?' <span class="tag">Locked</span>':''}${ins.includes(x.id)?' <span class="tag good">Upside pick</span>':''}</td><td class="r num">${f1(d.mean)}</td><td class="r num mute">${f1(floorOf(d.mean,d.sd))}</td><td class="r num">${f1(ceilOf(d.mean,d.sd))}</td></tr>`};
  const tbl=L=>`<div class="scroll"><table><thead><tr><th>Slot</th><th>Player</th><th class="r">Proj</th><th class="r">Floor</th><th class="r">Ceiling</th></tr></thead><tbody>${L.map(row).join('')}</tbody></table></div>`;
  const booms=startable(t).filter(id=>!winSet.has(id)&&S.P[id].pos!=='K'&&S.P[id].pos!=='DEF').map(id=>({id,...dist(id)})).filter(x=>x.mean>0).sort((a,b)=>ceilOf(b.mean,b.sd)-ceilOf(a.mean,a.sd)).slice(0,6);
  const oppRows=opp.ids.map(id=>{const d=dist(id);return `<tr><td>${pcell(id)}</td><td class="r num">${f1(d.mean)}</td><td class="r num">${f1(ceilOf(d.mean,d.sd))}</td></tr>`}).join('');
  return `<div class="board fc-board" style="margin-bottom:16px"><div style="position:relative;z-index:1">
    <div class="tname">${h(t.name)} vs ${h(opp.t.name)}, week ${S.planWeek}</div>
    <div class="sub" style="margin-bottom:12px">${fav?'You’re the favorite, so steady players protect the lead.':'You’re the underdog, so higher-ceiling players give you more ways to steal the win.'}${opp.assumed?` Assumes ${h(opp.t.name)} starts its best projected lineup.`:''}</div>
    <div class="fc-whatif">
      <div><div class="psub">Current starters</div><div class="num fc-big">${pc(Pc.p)}</div></div>
      <div><div class="psub">Most-points lineup</div><div class="num fc-big">${pc(P0.p)}</div></div>
      <div><div class="psub">Best-chance lineup</div><div class="num fc-big">${pc(W.p)}</div></div>
      <div><div class="psub">Projected score</div><div class="num fc-big">${f1(W.mean)} <span class="mute">vs</span> ${f1(opp.mean)}</div></div></div></div></div>
  <div class="panel" style="margin-bottom:16px">${ins.length?`<div class="verdict up">+${f1((W.p-P0.p)*100)} points of win probability</div><p style="margin:6px 0 0">${ins.map((id,i)=>{const a=dist(id),b=outs[i]?dist(outs[i]):null;return `Start <b>${h(S.P[id].n)}</b> (proj ${f1(a.mean)}, ceiling ${f1(ceilOf(a.mean,a.sd))})${b?` over <b>${h(S.P[outs[i]].n)}</b> (proj ${f1(b.mean)}, ceiling ${f1(ceilOf(b.mean,b.sd))})`:''}`}).join('. ')}.</p>`:
    `<div class="verdict">The most-points lineup is also your best chance to win</div><p class="mute" style="margin:6px 0 0">No swap on your bench raises your ${pc(P0.p)} win probability.</p>`}</div>
  <div class="grid2"><div class="panel"><h3 style="margin-top:0">Best-chance lineup</h3>${tbl(W.lineup)}</div>
    <div class="panel"><h3 style="margin-top:0">${h(opp.t.name)}${opp.assumed?', projected lineup':''}</h3><div class="scroll"><table><thead><tr><th>Player</th><th class="r">Proj</th><th class="r">Ceiling</th></tr></thead><tbody>${oppRows}</tbody></table></div></div></div>
  ${booms.length?`<h3>Boom candidates on your bench</h3><p class="psub" style="margin:-4px 0 10px">Floor and ceiling are a bad week and a big week (roughly 1 in 10 each), from each player's real week-to-week swings in this league.</p>
  <div class="panel scroll"><table><thead><tr><th>Player</th><th class="r">Proj</th><th class="r">Floor</th><th class="r">Ceiling</th></tr></thead><tbody>${booms.map(b=>`<tr><td>${pcell(b.id)}</td><td class="r num">${f1(b.mean)}</td><td class="r num mute">${f1(floorOf(b.mean,b.sd))}</td><td class="r num">${f1(ceilOf(b.mean,b.sd))}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}
function luTable(arr,fn){return `<div class="scroll"><table><tbody>${arr.map(x=>`<tr><td>${posTag(x.slot)}</td><td>${x.id?pcell(x.id):'<span class="flag">Empty</span>'}${x.locked?' <span class="tag">Locked</span>':''}</td><td class="r num" style="font-size:18px">${x.id?f1(fn(x.id)):'0.0'}</td></tr>`).join('')}</tbody></table></div>`}
document.addEventListener('change',e=>{if(e.target.id==='luTeam'){S.lineupTeam=Number(e.target.value);render()}});

<script>
/* js/modules/rankings.js */
/* Rankings: team power and dynasty rankings, player rankings with tiers, and a start/sit comparison */
function rRankTeams(){
  const T=[...S.teams].sort((a,b)=>a.pRank-b.pRank),sim=S.sim||{};
  const maxR=Math.max(...S.teams.map(t=>t.rosMean));
  let html=`<h2>Power rankings</h2><p class="lede">35% all-play record (how you'd do against everyone every week), 15% actual record, 50% the strength of each team's best lineup over the next four weeks. Playoff and title odds come from ${S.sim?'3,000+':'a'} simulated seasons on the real schedule.</p>
  <div class="panel scroll"><table><thead><tr><th>#</th><th>Team</th><th class="r">Record</th><th class="r">Points for</th><th class="r">All-play</th><th>Lineup strength</th><th class="r">Proj. wins</th><th class="r">Playoffs</th><th class="r">Bye</th><th class="r">Title</th></tr></thead><tbody>
  ${T.map(t=>{const s=sim[t.rid]||{};return `<tr class="${t.rid===S.meRid?'me':''}"><td class="num" style="font-size:20px">${t.pRank}</td>
    <td><div class="pname">${h(t.name)}</div><div class="psub">@${h(t.handle)}</div></td>
    <td class="r num">${t.w}-${t.l}${t.t?'-'+t.t:''}</td><td class="r num">${f1(t.pf)}</td>
    <td class="r num">${t.ap==null?'<span class="mute">n/a</span>':pc(t.ap)}</td>
    <td style="min-width:140px"><div class="bar"><i style="width:${t.rosMean/maxR*100}%"></i></div><div class="psub">${f1(t.rosMean)} per week</div></td>
    <td class="r num">${f1(s.wins)}</td><td class="r num">${pc(s.po)}</td><td class="r num">${pc(s.bye)}</td><td class="r num">${pc(s.champ)}</td></tr>`}).join('')}
  </tbody></table></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="btnSim">Rerun 6,000 simulations</button></div>`;
  const D=[...S.teams].sort((a,b)=>a.dRank-b.dRank);const maxD=Math.max(...D.map(t=>t.dTotal));
  html+=`<h2>${S.isDynasty?'Dynasty power rankings':'Keeper value rankings'}</h2><p class="lede">Total asset value: starters at full value, the best eight bench players at 35%, and owned draft picks at 60%, with picks priced by where the original team is likely to finish. Values from ${h(S.valueSource)}.</p>
  <div class="panel scroll"><table><thead><tr><th>#</th><th>Team</th><th>Window</th><th>Total value</th><th class="r">Starters</th><th class="r">Bench</th><th class="r">Picks</th><th class="r">Starter age</th><th class="r">Win-now rank</th></tr></thead><tbody>
  ${D.map(t=>`<tr class="${t.rid===S.meRid?'me':''}"><td class="num" style="font-size:20px">${t.dRank}</td><td><div class="pname">${h(t.name)}</div><div class="psub">${t.myPicks.filter(p=>p.round===1).length} first-round picks</div></td>
    <td><span class="tag ${({good:'good',bad:'bad'})[OUTLOOK[t.outlook].tone]||''}">${h(t.tier)}</span></td>
    <td style="min-width:140px"><div class="bar"><i style="width:${t.dTotal/maxD*100}%;background:var(--amber)"></i></div><div class="psub">${f0(t.dTotal)}</div></td>
    <td class="r num">${f0(t.dStart)}</td><td class="r num">${f0(t.dBench)}</td><td class="r num">${f0(t.dPicks)}</td><td class="r num">${t.age?f1(t.age):'n/a'}</td><td class="r num">${t.nowRank}</td></tr>`).join('')}
  </tbody></table></div>`;
  return html;
}

document.addEventListener('click',e=>{if(e.target.id==='btnSim'){S.sim=simulate(6000);S.bookM=null;S.whatIf=null;render()}});

const RK={sec:'teams',pos:'ALL',mode:null,ss:null};
const RSECS=[['teams','Teams'],['players','Players'],['ss','Start/Sit']];
function rRank(){
  const body={teams:rRankTeams,players:rRankPlayers,ss:rStartSit}[RK.sec]||rRankTeams;
  return `<nav class="chips" style="margin:4px 0 6px" aria-label="Rankings sections">${RSECS.map(([k,l])=>`<button class="chip" data-rk="${k}" aria-pressed="${RK.sec===k}">${l}</button>`).join('')}</nav>${body()}`;
}
/* ---------- player rankings with tiers ---------- */
function ownerTag(id){const t=S.teams.find(x=>x.players.includes(id));return t?`<span class="tag ${t.rid===S.meRid?'good':''}">${h(t.name)}</span>`:'<span class="tag">Free agent</span>'}
function rRankPlayers(){
  if(!RK.mode)RK.mode=S.isDynasty?'dyn':'week';
  const modes=[['week',`Week ${S.planWeek}`],['ros','Rest of season'],...(S.isDynasty?[['dyn','Dynasty']]:[])];
  const fn=RK.mode==='dyn'?id=>S.val[id]||0:RK.mode==='ros'?ros:wkPlan;
  const allowK=RK.mode!=='dyn';
  const poss=['ALL','QB','RB','WR','TE',...(allowK?['K','DEF']:[])];if(!poss.includes(RK.pos))RK.pos='ALL';
  let ids=Object.keys(S.P).filter(id=>{const p=S.P[id];return p.team&&(RK.pos==='ALL'?['QB','RB','WR','TE'].includes(p.pos):p.pos===RK.pos)&&fn(id)>0});
  ids.sort((a,b)=>fn(b)-fn(a));ids=ids.slice(0,RK.pos==='ALL'?150:60);
  const posRank={};const cnt={};Object.keys(S.P).filter(id=>S.P[id].team&&fn(id)>0).sort((a,b)=>fn(b)-fn(a)).forEach(id=>{const p=S.P[id].pos;cnt[p]=(cnt[p]||0)+1;posRank[id]=p+cnt[p]});
  // tiers: a new tier starts when a player falls far enough below the tier's first player
  const thr=RK.mode==='dyn'?.18:.14;let tier=0,lead=null;const rows=[];
  ids.forEach((id,i)=>{const v=fn(id);if(lead==null||v<lead*(1-thr)){tier++;lead=v;rows.push(`<tr class="tier-row"><td colspan="7">Tier ${tier}</td></tr>`)}
    const sd=RK.mode==='dyn'?null:playerSd(id,RK.mode==='ros'?ros(id):wkPlan(id));
    rows.push(`<tr><td class="num">${i+1}</td><td>${pcell(id)}</td><td class="num">${posRank[id]}</td><td class="r num" style="font-size:17px">${RK.mode==='dyn'?f0(v):f1(v)}</td>
      <td class="r num mute">${sd!=null?`${f1(floorOf(v,sd))} to ${f1(ceilOf(v,sd))}`:(S.adp[id]?`ADP ${f1(S.adp[id])}`:'')}</td><td>${ownerTag(id)}</td></tr>`)});
  return `<h2>Player rankings</h2><p class="lede">${RK.mode==='dyn'?'Dynasty value from our model: production above replacement this season and the next three, with aging curves, blended with Sleeper’s dynasty ADP.':RK.mode==='ros'?'Average points per week over the next four weeks, scored with your league’s settings.':`Projected points for week ${S.planWeek}, scored with your league’s settings, with a bad-week floor and a big-week ceiling.`} Tiers group players with little separation between them.</p>
  <div class="row"><div class="chips">${modes.map(([k,l])=>`<button class="chip" data-rkm="${k}" aria-pressed="${RK.mode===k}">${l}</button>`).join('')}</div>
  <div class="chips">${poss.map(p=>`<button class="chip" data-rkp="${p}" aria-pressed="${RK.pos===p}">${p==='ALL'?'All':p}</button>`).join('')}</div></div>
  <div class="panel scroll"><table class="rk-tbl"><thead><tr><th>#</th><th>Player</th><th>Pos</th><th class="r">${RK.mode==='dyn'?'Value':'Proj'}</th><th class="r">${RK.mode==='dyn'?'Market':'Floor to ceiling'}</th><th>In your league</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
/* ---------- start/sit ---------- */
function ssDefault(){
  const me=S.byRid[S.meRid];const lu=optimize(startable(me),wkPlan);const flex=lu.lineup.filter(x=>x.id&&/FLEX/.test(x.slot)).pop()||lu.lineup.filter(x=>x.id).pop();
  const alt=flex&&lu.bench.find(b=>ELIG[flex.slot].includes(b.pos));return [flex&&flex.id,alt&&alt.id].filter(Boolean);
}
function rStartSit(){
  if(!RK.ss)RK.ss=ssDefault();
  const pool=Object.keys(S.P).filter(id=>S.P[id].team&&wkPlan(id)>0).sort((a,b)=>wkPlan(b)-wkPlan(a)).slice(0,500);
  const P=RK.ss.filter(id=>S.P[id]);
  let res='';
  if(P.length>=2){const N=20000,best={};P.forEach(id=>best[id]=0);const D=P.map(id=>({id,m:wkPlan(id),sd:playerSd(id,wkPlan(id))}));
    for(let n=0;n<N;n++){let b=null,bv=-1e9;for(const x of D){const v=x.m+x.sd*gauss();if(v>bv){bv=v;b=x.id}}best[b]++}
    const sorted=[...D].sort((a,b)=>best[b.id]-best[a.id]);const top=sorted[0],upside=[...D].sort((a,b)=>ceilOf(b.m,b.sd)-ceilOf(a.m,a.sd))[0];
    const second=sorted[1],close=(best[top.id]-best[second.id])/N<.04,safe=[...D].sort((a,b)=>floorOf(b.m,b.sd)-floorOf(a.m,a.sd))[0];
    res=`<div class="panel" style="margin-top:14px">${close?`<div class="verdict">Too close to call</div><p style="margin:6px 0 0">${h(S.P[top.id].n)} and ${h(S.P[second.id].n)} come out on top about equally often. If you’re the underdog this week, take the higher ceiling: <b>${h(S.P[upside.id].n)}</b> (${f1(ceilOf(upside.m,upside.sd))}). If you’re favored, take the higher floor: <b>${h(S.P[safe.id].n)}</b> (${f1(floorOf(safe.m,safe.sd))}).</p>`
      :`<div class="verdict up">Start ${h(S.P[top.id].n)}</div><p style="margin:6px 0 0">He outscores the others in ${pc(best[top.id]/N)} of 20,000 simulated week ${S.planWeek}s.${upside.id!==top.id?` If you need a big week to win, <b>${h(S.P[upside.id].n)}</b> has the higher ceiling (${f1(ceilOf(upside.m,upside.sd))}).`:''}</p>`}</div>
    <div class="ss-grid">${sorted.map(x=>`<div class="panel"><div class="row" style="justify-content:space-between;margin:0 0 8px"><div>${pcell(x.id)}</div><button class="bk-x" data-ssrm="${x.id}" aria-label="Remove">×</button></div>
      <div class="num hx-big">${pc(best[x.id]/N)}</div><div class="psub">chance to score the most</div>
      <div class="ss-stats"><div><div class="psub">Proj</div><b class="num">${f1(x.m)}</b></div><div><div class="psub">Floor</div><b class="num">${f1(floorOf(x.m,x.sd))}</b></div><div><div class="psub">Ceiling</div><b class="num">${f1(ceilOf(x.m,x.sd))}</b></div></div>
      <div style="margin-top:8px">${ownerTag(x.id)}</div></div>`).join('')}</div>`}
  return `<h2>Start/Sit</h2><p class="lede">Compare up to four players for week ${S.planWeek}. Each player’s week is simulated 20,000 times from his projection and his real week-to-week swings; the pick is whoever finishes on top most often.</p>
  <div class="row">${P.length<4?`<input id="ssAdd" list="ssList" placeholder="Add a player" aria-label="Add a player" autocomplete="off"><datalist id="ssList">${pool.map(id=>`<option value="${h(S.P[id].n)} (${S.P[id].pos} ${S.P[id].team})"></option>`).join('')}</datalist>`:''}
    ${P.length?'<button class="btn ghost" id="ssClear">Clear</button>':''}</div>
  ${P.length<2?`<div class="panel">Add ${P.length?'one more player':'two players'} to compare.${P.length?` So far: ${h(S.P[P[0]].n)}.`:''}</div>`:res}`;
}
document.addEventListener('click',e=>{if(S.tab!=='rank')return;
  const r=e.target.closest('[data-rk]');if(r){RK.sec=r.dataset.rk;render();return}
  const m=e.target.closest('[data-rkm]');if(m){RK.mode=m.dataset.rkm;render();return}
  const p=e.target.closest('[data-rkp]');if(p){RK.pos=p.dataset.rkp;render();return}
  const x=e.target.closest('[data-ssrm]');if(x){RK.ss=RK.ss.filter(id=>id!==x.dataset.ssrm);render();return}
  if(e.target.id==='ssClear'){RK.ss=[];render()}});
document.addEventListener('change',e=>{if(e.target.id!=='ssAdd')return;const v=e.target.value;
  const id=Object.keys(S.P).find(k=>S.P[k].team&&`${S.P[k].n} (${S.P[k].pos} ${S.P[k].team})`===v);if(id&&!RK.ss.includes(id)){RK.ss.push(id);render()}});
document.addEventListener('wr:reset',()=>{RK.ss=null;RK.mode=null});
registerModule({key:'rank',label:'Rankings',order:30,render:rRank});

</script>
<script>
/* js/modules/forecast.js */
/* Forecast: this season's odds, team outlooks (contender, win now, rebuilding, tanking...) and the next three seasons */
const FC={sec:store.get('wr_fcsec')||'season',team:null};
function fcBars(key,title,lede,color){
  const sim=S.sim||{};const rows=[...S.teams].map(t=>({t,p:(sim[t.rid]||{})[key]||0})).sort((a,b)=>b.p-a.p);const mx=Math.max(.0001,...rows.map(r=>r.p));
  return `<div class="panel"><h3 style="margin-top:0">${title}</h3><p class="psub" style="margin:-4px 0 10px">${lede}</p>
  ${rows.map((r,i)=>`<div class="fc-row ${r.t.rid===S.meRid?'fc-me':''}" title="${h(r.t.name)}: ${pc(r.p)}"><span class="num fc-rk">${i+1}</span><span class="fc-name">${h(r.t.name)}</span>
    <span class="fc-bar"><i style="width:${r.p/mx*100}%;background:${color}"></i></span><span class="num fc-p">${pc(r.p)}</span></div>`).join('')}</div>`;
}
function oppOfWeek(w,rid){const p=pairsOf(S.mu[w]).find(x=>x.some(m=>m.roster_id===rid));return p?p.find(m=>m.roster_id!==rid).roster_id:null}
const yearLabel=y=>y===0?`${S.season} (rest)`:String(Number(S.season)+y);

/* ---------- this season ---------- */
function fcSeason(){
  const sim=S.sim||{},regLeft=S.week<=S.regEnd,wkQ=S.planWeek;
  let whatIf='';
  if(regLeft&&wkQ<=S.regEnd&&pairsOf(S.mu[wkQ]).some(p=>p.some(m=>m.roster_id===S.meRid))){
    if(!S.whatIf)S.whatIf={win:simulate(2500,{rid:S.meRid,win:true,week:wkQ}),lose:simulate(2500,{rid:S.meRid,win:false,week:wkQ})};
    const W=S.whatIf.win[S.meRid],L=S.whatIf.lose[S.meRid],opp=S.byRid[oppOfWeek(wkQ,S.meRid)];
    const cell=(k,label)=>`<div><div class="psub">${label}</div><div class="num fc-big">${pc(W[k])} <span class="mute">vs</span> ${pc(L[k])}</div></div>`;
    whatIf=`<div class="board fc-board" style="margin-bottom:16px"><div style="position:relative;z-index:1">
      <div class="tname">What week ${wkQ} against ${h(opp?opp.name:'your opponent')} is worth</div>
      <div class="sub" style="margin-bottom:12px">Your odds if you win, versus if you lose.</div>
      <div class="fc-whatif">${cell('po','Make the playoffs')}${cell('bye','First-round bye')}${cell('champ','Win the title')}${cell('toilet','Lose the toilet bowl')}</div></div></div>`;
  }
  const T=[...S.teams].sort((a,b)=>(sim[b.rid].champ-sim[a.rid].champ)||(sim[b.rid].wins-sim[a.rid].wins));
  return `<p class="lede">Every remaining regular-season game on your real schedule, then the playoff bracket and the toilet bowl, simulated thousands of times.</p>
  ${whatIf}
  <div class="grid2">${fcBars('champ','Champion forecast','Chance of winning the title game.','var(--mint)')}
  ${fcBars('toilet','Toilet bowl loser forecast','Chance of missing the playoffs and then losing every consolation game down to the bottom.','var(--red)')}</div>
  <h3>Full odds</h3><div class="panel scroll"><table><thead><tr><th>Team</th><th>Outlook</th><th class="r">Record</th><th class="r">Proj. wins</th><th class="r">Playoffs</th><th class="r">Bye</th><th class="r">#1 seed</th><th class="r">Champion</th><th class="r">Last place</th><th class="r">Toilet bowl</th></tr></thead><tbody>
  ${T.map(t=>{const s=sim[t.rid];return `<tr class="${t.rid===S.meRid?'me':''}"><td><div class="pname">${h(t.name)}</div><div class="psub">@${h(t.handle)}</div></td><td>${olTag(t)}</td><td class="r num">${t.w}-${t.l}${t.t?'-'+t.t:''}</td><td class="r num">${f1(s.wins)}</td><td class="r num">${pc(s.po)}</td><td class="r num">${pc(s.bye)}</td><td class="r num">${pc(s.one)}</td><td class="r num">${pc(s.champ)}</td><td class="r num">${pc(s.last)}</td><td class="r num">${pc(s.toilet)}</td></tr>`}).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="btnSim">Rerun 6,000 simulations</button></div>`;
}
const olTag=t=>{const o=OUTLOOK[t.outlook]||{};return `<span class="tag ${o.tone==='good'?'good':o.tone==='bad'?'bad':'warn'}">${h(o.label||'')}</span>`};

/* ---------- team outlook ---------- */
function fcOutlook(){
  const T=[...S.teams].sort((a,b)=>(b.rid===S.meRid)-(a.rid===S.meRid)||a.fut[0].rank-b.fut[0].rank);
  const nm=id=>h(S.P[id].n);const n=S.teams.length;
  const counts={};S.teams.forEach(t=>counts[t.outlook]=(counts[t.outlook]||0)+1);
  const legend=Object.keys(OUTLOOK).filter(k=>counts[k]).map(k=>`<div class="ol-leg">${olTag({outlook:k})} <span class="psub">${counts[k]} ${counts[k]===1?'team':'teams'}. ${OUTLOOK[k].line}</span></div>`).join('');
  return `<p class="lede">Each team is placed by how strong its best lineup is now versus two seasons from now, how old its starters are, and the draft picks it owns.</p>
  <div class="panel" style="margin-bottom:16px">${legend}</div>
  <div class="ol-grid">${T.map(t=>{const f=t.fut,d=f[2].rank-f[0].rank;
    const firstsBy={};t.firsts.forEach(p=>(firstsBy[p.season]=firstsBy[p.season]||[]).push(p.orig===t.rid?'own':S.byRid[p.orig].name));
    return `<article class="panel ol-card ${t.rid===S.meRid?'ol-me':''}">
      <div class="ol-head"><div><div class="pname" style="font-size:18px">${h(t.name)}${t.rid===S.meRid?' <span class="tag">You</span>':''}</div><div class="psub">@${h(t.handle)}, ${t.w}-${t.l}</div></div>${olTag(t)}</div>
      <p style="margin:8px 0 12px">${OUTLOOK[t.outlook].line}</p>
      <div class="ol-stats">
        <div><div class="psub">Lineup rank</div><div class="num ol-n">#${f[0].rank} <span class="mute">to</span> #${f[2].rank}</div><div class="psub">now to ${yearLabel(2)}${d<0?', climbing':d>0?', falling':''}</div></div>
        <div><div class="psub">Starter age</div><div class="num ol-n">${t.coreAge?f1(t.coreAge):'n/a'}</div><div class="psub">league avg ${f1(S.teams.reduce((s,x)=>s+(x.coreAge||0),0)/n)}</div></div>
        <div><div class="psub">First-round picks</div><div class="num ol-n">${t.firsts.length}</div><div class="psub">${Object.keys(firstsBy).sort().map(s=>`${s}: ${firstsBy[s].length}`).join(', ')||'none owned'}</div></div>
      </div>
      <ul class="ol-list">
        <li><b>Strongest:</b> ${t.strongPos.p} (${t.strongPos.d>=0?'+':''}${f1(t.strongPos.d)} pts/wk vs league). <b>Weakest:</b> ${t.weakPos.p} (${f1(t.weakPos.d)}).</li>
        ${t.youngCore.length?`<li><b>Young core:</b> ${t.youngCore.slice(0,3).map(id=>`${nm(id)} (${S.P[id].age})`).join(', ')}.</li>`:'<li><b>Young core:</b> none worth building around yet.</li>'}
        ${t.decliners.length?`<li><b>Sell before they drop:</b> ${t.decliners.slice(0,3).map(x=>`${nm(x.id)} (${f1(x.now)} to ${f1(x.y2)} pts/wk)`).join(', ')}.</li>`:''}
        ${t.risers.length?`<li><b>On the rise:</b> ${t.risers.slice(0,3).map(x=>`${nm(x.id)} (${f1(x.now)} to ${f1(x.y2)})`).join(', ')}.</li>`:''}
        ${t.ownNext1&&t.fut[0].rank>n-3?`<li><b>Tank incentive:</b> owns its own ${pickSeasons()[0]} first.</li>`:''}
      </ul>
      <p class="ol-advice"><b>Move:</b> ${h(outlookAdvice(t))}</p>
    </article>`}).join('')}</div>`;
}

/* ---------- next three seasons ---------- */
function slopeChart(){
  const T=S.teams,n=T.length,Y=[0,1,2];
  const W=760,top=28,rowH=34,H=top+rowH*(n-1)+30,xs=[250,380,510];
  const y=r=>top+(r-1)*rowH;
  const lines=T.map(t=>{const me=t.rid===S.meRid;const pts=Y.map(k=>[xs[k],y(t.fut[k].rank)]);
    const tip=`${t.name}: ${Y.map(k=>`${yearLabel(k)} #${t.fut[k].rank} (${f1(t.fut[k].total)} pts/wk)`).join(', ')}`;
    return `<g class="sl-g${me?' sl-me':''}" data-tip="${h(tip)}" tabindex="0">
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="sl-line"/>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${me?6:4.5}" class="sl-dot"/>`).join('')}
      <text x="${xs[0]-14}" y="${pts[0][1]+5}" text-anchor="end" class="sl-lab">${h(t.name)}</text>
      <text x="${xs[2]+14}" y="${pts[2][1]+5}" class="sl-lab">${h(t.name)}</text>
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="sl-hit"/></g>`}).sort((a,b)=>a.includes('sl-me')-b.includes('sl-me')).join('');
  const axis=Y.map(k=>`<text x="${xs[k]}" y="14" text-anchor="middle" class="sl-yr">${yearLabel(k)}</text><line x1="${xs[k]}" x2="${xs[k]}" y1="${top-8}" y2="${H-18}" class="sl-ax"/>`).join('');
  const ranks=range(1,n).map(r=>`<text x="${W-18}" y="${y(r)+5}" text-anchor="end" class="sl-rk">#${r}</text>`).join('');
  return `<div class="sl-wrap"><svg viewBox="0 0 ${W} ${H}" class="slope" role="img" aria-label="Lineup strength rank for each team, now and the next two seasons. Table below has the numbers.">${axis}${ranks}${lines}</svg><div class="sl-tip" hidden></div></div>`;
}
function fcFuture(){
  const T=[...S.teams].sort((a,b)=>a.fut[2].rank-b.fut[2].rank);
  if(!FC.team)FC.team=S.meRid;const t=S.byRid[FC.team];
  const lu=y=>t.fut[y].lineup.map(x=>`<tr><td>${posTag(x.slot)}</td><td>${x.rk?`<span class="pname">${h(pickLabel(x.pick))}</span><div class="psub">Rookie from this pick, drafted ${x.pick.season}</div>`:`<span class="pname">${h(S.P[x.id].n)}</span><div class="psub">${S.P[x.id].pos}, age ${S.P[x.id].age?S.P[x.id].age+y:'?'} in ${yearLabel(y).slice(0,4)}</div>`}</td><td class="r num">${f1(x.pts)}</td></tr>`).join('');
  return `<p class="lede">Each player is projected forward with a typical aging curve for his position, nudged by his dynasty market value, so a young player priced like a star is read as a breakout in progress. Draft picks turn into expected rookies, scaled by round and by how the original team is likely to finish. Numbers are each team's best lineup, in points per week.</p>
  <div class="panel">${slopeChart()}</div>
  <h3>Strength by season</h3><div class="panel scroll"><table><thead><tr><th>Team</th><th>Outlook</th>${[0,1,2].map(k=>`<th class="r">${yearLabel(k)}</th>`).join('')}<th class="r">Change</th><th class="r">Rookies starting in ${yearLabel(2)}</th></tr></thead><tbody>
  ${T.map(x=>{const ch=x.fut[2].total-x.fut[0].total;return `<tr class="${x.rid===S.meRid?'me':''}"><td class="pname">${h(x.name)}</td><td>${olTag(x)}</td>${[0,1,2].map(k=>`<td class="r num">${f1(x.fut[k].total)} <span class="psub">#${x.fut[k].rank}</span></td>`).join('')}
    <td class="r num ${ch>=0?'up':'down'}">${ch>=0?'+':''}${f1(ch)}</td><td class="r num">${x.fut[2].rookies}</td></tr>`}).join('')}</tbody></table></div>
  <h3>Projected lineups</h3><div class="row"><select id="fcTeam" aria-label="Team">${S.teams.map(x=>`<option value="${x.rid}" ${x.rid===t.rid?'selected':''}>${h(x.name)}${x.rid===S.meRid?' (you)':''}</option>`).join('')}</select></div>
  <div class="fc-lu">${[0,1,2].map(y=>`<div class="panel"><h3 style="margin-top:0">${yearLabel(y)}, ${f1(t.fut[y].total)} pts/wk</h3><div class="scroll"><table><tbody>${lu(y)}</tbody></table></div></div>`).join('')}</div>`;
}
const FSECS=[['season','This season'],['outlook','Team outlook'],['future','Next 3 seasons']];

}

document.addEventListener('change',e=>{if(e.target.id==='fcTeam'){FC.team=Number(e.target.value);const y=window.scrollY;render();window.scrollTo(0,y)}});
/* slope chart hover and keyboard focus tooltip */
function slTip(g,ev){const w=g.closest('.sl-wrap'),tip=w.querySelector('.sl-tip');w.querySelectorAll('.sl-g').forEach(x=>x.classList.toggle('sl-dim',x!==g));
  tip.textContent=g.dataset.tip;tip.hidden=false;const r=w.getBoundingClientRect();const x=ev&&ev.clientX?ev.clientX-r.left:r.width/2,y=ev&&ev.clientY?ev.clientY-r.top:20;
